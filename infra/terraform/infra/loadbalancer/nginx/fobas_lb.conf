# === FOBAS LOAD BALANCER (PREPARED / DISABLED) ===

upstream fobas_api {
    # VPS2 – API servers
    server 10.0.0.2:3000;  # placeholder
    # server 10.0.0.3:3000; # future API
}

upstream fobas_workers {
    # VPS3 – workers / jobs
    server 10.0.0.4:4000;  # placeholder
}

server {
    listen 80;
    server_name api.fobas.ht;

    location / {
        proxy_pass http://fobas_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
