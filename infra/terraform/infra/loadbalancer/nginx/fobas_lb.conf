# === FOBAS LOAD BALANCER (ACTIVE FOR 3 VPS) ===

upstream fobas_api {
    # VPS1 – API server aktyèl
    server 80.91.65.75:3000;  # VPS1 (existing)
    # VPS2 – API server nouvo
    server 10.0.0.2:3000;     # VPS2 placeholder
    # VPS3 – API server (future)
    # server 10.0.0.3:3000;   # keep commented until ready
}

upstream fobas_workers {
    # VPS3 – workers / jobs
    server 10.0.0.4:4000;  # VPS3 placeholder
}

server {
    listen 80;
    server_name api.fobas.ht;

    location / {
        proxy_pass http://fobas_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
