<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>FOBAS BUSINESSES</title>

  <link rel="stylesheet" href="businesses.css"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body>

  <!-- LOADER -->
  <div class="loader-wrapper" id="loader">
    <div class="loader"></div>
  </div>

  <!-- NAVBAR -->
  <header class="navbar">

    <div class="logo">
      <span class="yellow">FOBAS</span>
      <span class="blue">BUSINESSES</span>
    </div>

    <nav>
      <a href="#">Accueil</a>
      <a href="#">Entrepreneurs</a>
      <a href="#">Business</a>
      <a href="#">Contact</a>
    </nav>

  </header>

  <!-- HERO -->
  <section class="hero">

    <div class="hero-content">

      <h1>
        Découvrez les meilleurs business
        du réseau FOBAS.
      </h1>

      <p>
        Une plateforme digitale intelligente
        dédiée aux entrepreneurs haïtiens.
      </p>

    </div>

  </section>

  <!-- SEARCH -->
  <section class="search-section">

    <div class="search-box">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        type="text"
        id="searchBusiness"
        placeholder="Rechercher un business..."
      />

    </div>

  </section>

  <!-- BUSINESSES GRID -->
  <section class="businesses-section">

    <div class="section-title">
      <h2>Business Disponibles</h2>
    </div>

    <div class="business-grid" id="businessGrid">

      <!-- DYNAMIC -->

    </div>

  </section>

  <script src="businesses.js"></script>

</body>
</html>
