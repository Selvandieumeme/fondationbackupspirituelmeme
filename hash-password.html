<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Générateur Hash SHA-256</title>
  <style>
    body{font-family:Arial;max-width:600px;margin:auto;padding:20px}
    input,button{width:100%;padding:12px;margin-top:10px;font-size:16px}
    pre{background:#222;color:#0f0;padding:12px;font-size:14px}
  </style>
</head>
<body>

<h2>Générer Hash (SHA-256)</h2>

<label>Mot de passe temporaire :</label>
<input id="pwd" type="password" placeholder="Tapez mot de passe">

<button onclick="generate()">Générer Hash</button>

<h3>Résultat :</h3>
<pre id="out"></pre>

<script>
  async function generate(){
    const pwd = document.getElementById("pwd").value;

    if(pwd.length < 6){
      alert("Mot de passe trop court !");
      return;
    }

    const encoder = new TextEncoder();
    const data = encoder.encode(pwd);

    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2,"0")).join("");

    document.getElementById("out").textContent = hashHex;
  }
</script>

</body>
</html>
