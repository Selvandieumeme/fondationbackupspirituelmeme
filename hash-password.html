<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Générateur Hash Bcrypt (Admin) — Debuggable</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto;max-width:720px;margin:30px auto;padding:18px;}
    label{display:block;margin-top:12px;font-weight:600}
    input[type="password"], input[type="text"], input[type="number"]{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-top:6px}
    button{margin-top:12px;padding:10px 14px;border-radius:8px;border:none;background:#16a34a;color:white;font-weight:700;cursor:pointer}
    pre{background:#0f172a;color:#e6eef8;padding:12px;border-radius:8px;white-space:pre-wrap}
    .meta{font-size:13px;color:#555;margin-top:8px}
    .status{margin-top:10px;font-weight:700}
  </style>
</head>
<body>
  <h1>Générateur Hash Bcrypt (Admin)</h1>
  <p class="meta">Saisissez un mot de passe temporaire, cliquez <em>Générer</em>, puis copiez le hash dans votre base (Robo3T / Compass).</p>

  <label for="pwd">Nouveau mot de passe (temporaire)</label>
  <input id="pwd" type="password" placeholder="Tapez mot de passe temporaire ici">

  <label for="cost">Cost (work factor) — recommandé 12</label>
  <input id="cost" type="number" min="8" max="14" value="12">

  <button id="gen">Générer le hash</button>
  <div class="status" id="status"></div>

  <div id="result" style="margin-top:14px;display:none">
    <label>Hash bcrypt (à copier dans passwordHash)</label>
    <pre id="hashOutput"></pre>
    <button id="copyBtn">Copier le hash</button>
    <p class="meta">Collez la valeur dans la propriété <code>passwordHash</code> du document utilisateur (Robo3T/Compass).</p>
  </div>

  <script>
    // URL fiable bcryptjs
    const BCRYPT_CDN = "https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js";

    const genBtn = document.getElementById('gen');
    const hashOutput = document.getElementById('hashOutput');
    const resultDiv = document.getElementById('result');
    const copyBtn = document.getElementById('copyBtn');
    const statusEl = document.getElementById('status');

    // helper: load script dynamically
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector('script[src="' + src + '"]')) return resolve();
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => resolve();
        s.onerror = (e) => reject(new Error('Impossible de charger ' + src));
        document.head.appendChild(s);
      });
    }

    // main
    async function ensureBcrypt() {
      if (window.bcrypt && typeof window.bcrypt.hashSync === 'function') return;
      statusEl.textContent = "Chargement de bcryptjs...";
      try {
        await loadScript(BCRYPT_CDN);
        // small delay to ensure availability
        await new Promise(r => setTimeout(r, 150));
        if (!(window.bcrypt && typeof window.bcrypt.hashSync === 'function')) {
          throw new Error('bcrypt introuvable après chargement');
        }
        statusEl.textContent = "bcryptjs chargé.";
      } catch (err) {
        statusEl.textContent = "Erreur: impossible de charger bcryptjs.";
        console.error("load bcrypt error:", err);
        throw err;
      }
    }

    genBtn.addEventListener('click', async () => {
      const pwd = document.getElementById('pwd').value;
      let cost = parseInt(document.getElementById('cost').value, 10) || 12;
      if (cost < 8) cost = 8;
      if (cost > 14) cost = 14;

      if (!pwd || pwd.length < 6) {
        alert('Veuillez entrer un mot de passe d\'au moins 6 caractères (temporaire).');
        return;
      }

      genBtn.disabled = true;
      genBtn.textContent = 'Génération en cours...';
      statusEl.textContent = '';

      try {
        await ensureBcrypt();

        // Use non-blocking approach: generate salt + hash in a setTimeout to avoid freezing UI too long
        statusEl.textContent = `Génération (cost=${cost}) — patience...`;

        // run in a microtask to avoid blocking immediate UI
        await new Promise((resolve) => setTimeout(resolve, 20));

        // synchronous functions provided by bcryptjs
        const salt = bcrypt.genSaltSync(cost);
        const hashed = bcrypt.hashSync(pwd, salt);

        hashOutput.textContent = hashed;
        resultDiv.style.display = 'block';
        statusEl.textContent = "Hash généré avec succès.";
      } catch (err) {
        console.error("Erreur lors de la génération du hash:", err);
        statusEl.textContent = "Erreur lors de la génération du hash. Vérifiez console (F12).";
        alert("Erreur lors de la génération du hash. Ouvrez la console (F12) pour plus de détails.");
      } finally {
        genBtn.disabled = false;
        genBtn.textContent = 'Générer le hash';
      }
    });

    copyBtn.addEventListener('click', async () => {
      const text = hashOutput.textContent;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'Copié !';
        setTimeout(() => copyBtn.textContent = 'Copier le hash', 2000);
      } catch (e) {
        alert('Impossible de copier automatiquement. Copiez manuellement.');
      }
    });

    // auto-load bcrypt on page load (optional)
    (async () => {
      try {
        await ensureBcrypt();
      } catch (e) {
        // nothing, user can still try but will see error
      }
    })();
  </script>
</body>
</html>
