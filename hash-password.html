<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin – Générer Hash BCRYPT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      padding: 40px;
      color: #222;
    }
    .card {
      background: white;
      width: 450px;
      margin: auto;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      font-size: 16px;
      margin-top: 8px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      margin-top: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #1e4fcc; }
    .copy-btn {
      background: #10b981;
      margin-top: 5px;
    }
    .copy-btn:hover { background: #0e9f6d; }
    h2 { text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Admin – Générer Hash BCRYPT</h2>

    <label>Entrer le nouveau mot de passe :</label>
    <input type="password" id="password" placeholder="Mot de passe...">

    <button onclick="generateHash()">Générer le Hash</button>

    <label>Hash BCRYPT (à coller dans Robo3T) :</label>
    <textarea id="hash" rows="4" readonly></textarea>
    <button class="copy-btn" onclick="copyText('hash')">Copier Hash</button>

    <label>Mot de passe à envoyer à l'utilisateur :</label>
    <textarea id="plain" rows="2" readonly></textarea>
    <button class="copy-btn" onclick="copyText('plain')">Copier Mot de Passe</button>
  </div>

<script>
function generateHash() {
  const password = document.getElementById("password").value.trim();
  if (!password) { 
    alert("Veuillez entrer un mot de passe."); 
    return; 
  }

  // Jenere hash BCRYPT ak bcryptjs nan browser
  const hash = bcrypt.hashSync(password, 10);

  document.getElementById("hash").value = hash;
  document.getElementById("plain").value = password;
}

// Fonksyon kopi
function copyText(id) {
  const element = document.getElementById(id);
  element.select();
  element.setSelectionRange(0, 99999);
  document.execCommand("copy");
  alert("Copié !");
}
</script>
</body>
</html>
