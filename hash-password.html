<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Générer Hash Bcrypt</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 30px; }
    input, textarea, button { font-size: 16px; margin: 5px 0; }
    textarea { width: 100%; }
    button { padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Admin: Générer Hash Bcrypt pour Reset Mot de Passe</h2>

  <label>Nouveau mot de passe :</label><br>
  <input type="text" id="password" placeholder="Entrer mot de passe"><br>

  <button onclick="generateHash()">Générer Hash</button><br><br>

  <label>Hash BCRYPT à mettre dans Robo3T :</label><br>
  <textarea id="hash" rows="4" readonly></textarea><br>

  <label>Mot de passe pwovizwa à envoyer à utilisateur :</label><br>
  <textarea id="plain" rows="2" readonly></textarea><br>

  <script>
    function generateHash() {
      const pass = document.getElementById("password").value;
      if(!pass) { alert("Veuillez entrer un mot de passe."); return; }

      // Générer hash BCRYPT
      const hash = bcrypt.hashSync(pass, 10);

      document.getElementById("hash").value = hash;
      document.getElementById("plain").value = pass;
    }
  </script>
</body>
</html>
