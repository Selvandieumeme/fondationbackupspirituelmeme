<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fom Eleves Direktè</title>
<style>
  body { font-family: Arial, sans-serif; margin:20px; background:#f9f9f9; }
  h1,h2 { color:#333; }
  select, input, textarea { padding:8px; margin:5px 0; width:100%; max-width:400px; border-radius:5px; border:1px solid #ccc; }
  button { padding:10px 20px; background:#4CAF50; color:white; border:none; border-radius:5px; cursor:pointer; }
  button:hover { background:#45a049; }
  .student-list { margin-top:30px; }
  .student-card { background:#fff; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ddd; }
</style>
</head>
<body>

<h1>Fom Ranpli Eleves</h1>

<label for="classSelect">Chwazi Klas:</label>
<select id="classSelect">
  <option value="">-- Chwazi Klas --</option>
  <option value="6eme">6ème</option>
  <option value="5eme">5ème</option>
  <option value="4eme">4ème</option>
  <option value="3eme">3ème</option>
  <option value="2nd">2eme</option>
  <option value="1ere">1ère</option>
  <option value="Tle">Tle</option>
  <option value="PetiteSection">Petite Section</option>
  <option value="MoyenneSection">Moyenne Section</option>
  <option value="GrandeSection">Grande Section</option>
  <option value="7eme">7eme</option>
  <option value="8eme">8eme</option>
  <option value="9eme">9eme</option>
  <option value="NSI">NSI</option>
  <option value="NSII">NSII</option>
  <option value="NSIII">NSIII</option>
  <option value="NSIV">NSIV</option>
</select>

<div id="formContainer" style="margin-top:20px; display:none;">
  <h2>Fom Eleve</h2>
  <form id="studentForm">
    <input type="text" name="nom" placeholder="Non" required>
    <input type="text" name="prenom" placeholder="Prenom" required>
    <input type="email" name="email" placeholder="Email Eleve" required>
    <input type="text" name="numero_dossier" placeholder="Numero Dossier" required>
    <input type="text" name="promotion" placeholder="Promotion" value="2025-2026" readonly>
    <textarea name="notes" placeholder="Nòt oswa Remak" rows="4"></textarea>
    <button type="submit">Valide</button>
  </form>
</div>

<h2>Lis Eleves Ranpli:</h2>
<div id="studentList" class="student-list"></div>

<script>
const API_URL = "https://examen-backend-ihlx.onrender.com/api/eleves";
const classSelect = document.getElementById('classSelect');
const formContainer = document.getElementById('formContainer');
const studentForm = document.getElementById('studentForm');
const studentList = document.getElementById('studentList');

// Afichaj fòm lè chwazi klas
classSelect.addEventListener('change', () => {
  formContainer.style.display = classSelect.value ? 'block' : 'none';
  loadStudents(classSelect.value);
});

// Chaje lis elèv ki nan MongoDB pou klas chwazi
async function loadStudents(classe) {
  if(!classe) return studentList.innerHTML = '';
  try {
    const res = await fetch(`${API_URL}?classe=${classe}`);
    const data = await res.json();
    studentList.innerHTML = "";
    if(data.success && data.data.length){
      data.data.forEach(student => {
        const card = document.createElement('div');
        card.className = 'student-card';
        card.innerHTML = `
          <strong>Klas:</strong> ${student.classe}<br>
          <strong>Non:</strong> ${student.nom}<br>
          <strong>Prenom:</strong> ${student.prenom}<br>
          <strong>Email:</strong> ${student.email}<br>
          <strong>Numero Dossier:</strong> ${student.numero_dossier}<br>
          <strong>Promotion:</strong> ${student.promotion}<br>
          <strong>Remak:</strong> ${student.notes || '-'}
        `;
        studentList.appendChild(card);
      });
    } else {
      studentList.innerHTML = '<p>Aucun elèv pou klas sa a.</p>';
    }
  } catch (err) {
    console.error("Erè pandan chajman lis elèv yo:", err);
    studentList.innerHTML = '<p>Erè pandan chajman elèv yo.</p>';
  }
}

// Submit fòm pou sove nan MongoDB epi voye kopi nan FormSubmit
studentForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(studentForm);
  const student = {};
  formData.forEach((v,k) => student[k] = v);
  student.classe = classSelect.value;

  try {
    // 1️⃣ Sove nan MongoDB
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(student)
    });
    const data = await res.json();

    if(res.ok && data.success){
      // 2️⃣ Voye kopi nan FormSubmit.co san redireksyon ni CAPTCHA
      const fsData = new FormData();
      fsData.append('Subject', `Nouvo eleve: ${student.nom} ${student.prenom} (${student.classe})`);
      fsData.append('message', JSON.stringify(student, null, 2));
      fsData.append('Email', 'infos@fondationbackupspirituel.com');

      try {
        await fetch('https://formsubmit.co/ajax/infos@fondationbackupspirituel.com', {
          method:'POST',
          body: fsData,
          headers: { 'Accept': 'application/json' }
        });
      } catch(err) {
        console.warn("⚠️ Pwoblèm pandan voye email (pa anpeche MongoDB):", err);
      }

      alert("✅ Eleve anrejistre nan MongoDB epi kopi voye nan email lekòl la!");
      studentForm.reset();
      loadStudents(classSelect.value);
    } else {
      alert("❌ Erè pandan anrejistreman elèv la: " + (data.message || ''));
    }
  } catch (err) {
    alert("❌ Pwoblèm rezo oswa serve a inaktif!");
    console.error(err);
  }
});

// Chajman inisyal si klas deja chwazi
if(classSelect.value) loadStudents(classSelect.value);
</script>

</body>
</html>
