<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Création de compte | FOBAS</title>

  <meta name="description" content="Création de compte FOBAS sécurisé. Dépôt et retrait manuel avec vérification WhatsApp."/>
  <meta name="robots" content="index, follow"/>

</head>

<body>

<main>

<!-- === BLOK FOBAS === -->
<div id="wallet-fobas-section" style="max-width:900px; margin:30px auto; padding:30px; border-radius:25px; background:linear-gradient(135deg,#fffbea,#e0f7ff); text-align:center; box-shadow:0 15px 35px rgba(0,0,0,0.1); font-family:'Inter', sans-serif;">
  <h2 style="color:#16a34a; font-weight:800; font-size:1.8rem; margin-bottom:15px;">🟢 FOBAS – Sans Carte (Modèle Ledger)</h2>
  <p style="font-size:1.05rem; color:#1f2937;">Créez votre compte FOBAS sécurisé. Dépôt et retrait manuel – vérification par WhatsApp.</p>

  <!-- FORMULAIRE CREATION FOBAS COMPLET -->
  <form id="createWalletForm" style="margin-top:25px; text-align:left; max-width:600px; margin-left:auto; margin-right:auto;">

    <label><strong>Nom complet :</strong></label>
    <input type="text" name="walletFullName" placeholder="Ex : Jean Dupont" required
      style="padding:10px; width:100%; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:12px;">

    <label><strong>Nom du Parrain / Marraine :</strong></label>
    <input type="text" name="walletSponsorName" placeholder="Ex : Meme Selvandieu" required
      style="padding:10px; width:100%; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:12px;">

    <label><strong>Email du Parrain / Marraine :</strong></label>
    <input type="email" name="walletSponsorEmail" placeholder="exemple@sponsor.com" required
      style="padding:10px; width:100%; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:12px;">

    <label><strong>Vous êtes :</strong></label>
    <select name="walletAccountType" required
      style="padding:10px; width:100%; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:12px;">
      <option value="">-- Sélectionnez votre statut --</option>
      <option value="Agent Autorise">Agent Autorisé</option>
      <option value="Etudiant">Étudiant</option>
      <option value="ONG">ONG</option>
      <option value="Entreprise">Entreprise</option>
      <option value="Ecole">École</option>
      <option value="Eglise">Église</option>
      <option value="Membre">Membre</option>
    </select>

    <label><strong>Email (Gmail) :</strong></label>
    <input type="email" name="walletEmail" placeholder="votremail@gmail.com" required
      style="padding:10px; width:100%; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:12px;">

    <label><strong>Email de récupération :</strong></label>
    <input type="email" name="walletRecoveryEmail" placeholder="Email secondaire"
      style="padding:10px; width:100%; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:12px;">

    <label><strong>Numéro WhatsApp :</strong></label>
    <input type="text" name="walletWhatsApp" placeholder="+509XXXXXXXX" required
      style="padding:10px; width:100%; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:12px;">

    <label><strong>Date de naissance :</strong></label>
    <input type="date" name="walletBirthDate" required
      style="padding:10px; width:100%; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:12px;">

    <label><strong>Lieu de naissance :</strong></label>
    <input type="text" name="walletBirthPlace" placeholder="Ex : Port-au-Prince" required
      style="padding:10px; width:100%; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:12px;">

    <label><strong>Mot de passe :</strong></label>
    <input type="password" name="walletPassword" placeholder="Créer un mot de passe" required
      style="padding:10px; width:100%; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:12px;">

    <label><strong>Confirmer mot de passe :</strong></label>
    <input type="password" name="walletPasswordConfirm" placeholder="Retapez mot de passe" required
      style="padding:10px; width:100%; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:18px;">

    <button type="submit"
      style="padding:12px 25px; background:#16a34a; color:#fff; border:none; width:100%; border-radius:12px; font-weight:700; cursor:pointer;">
      Créer mon compte FOBAS
    </button>
  </form>

  <div id="wallet-msg" style="margin-top:20px; font-weight:600; color:#1f2937;"></div>

  <div id="wallet-dashboard" style="display:none;"></div>
</div>

</main>

<footer style="text-align:center; margin-top:40px; color:#6b7280;">
  © 2026 —  FOBAS • Support WhatsApp : +50946057952
</footer>

</body>
</html>
