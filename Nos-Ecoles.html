<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nos Écoles — Espas Egzamen</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f5f8fb;color:#072b44;padding:16px}
  .card{max-width:1000px;margin:12px auto;padding:18px;border-radius:10px;background:#fff;box-shadow:0 6px 20px rgba(11,59,102,0.05)}
  .btn{padding:8px 12px;border-radius:8px;border:none;background:#0b63b3;color:#fff;cursor:pointer}
  .btn-outline{background:#fff;color:#0b63b3;border:1px solid #0b63b3}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .hidden{display:none}
  .small{font-size:13px;color:#666}
  .timer{font-weight:700;color:#b02a37}
  .school-container{margin-bottom:40px;border-top:2px solid #0b63b3;padding-top:20px;}
  .banner-lock{position:fixed;left:0;right:0;top:0;background:#ffc; color:#222;padding:8px 12px;border-bottom:2px solid #f0c040;z-index:99999;font-weight:700;text-align:center}
  .no-select{user-select:none;-webkit-user-select:none;-ms-user-select:none}
  input,textarea{font-family:inherit}
</style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 8px">Fondation BackupSpirituel — Espas Egzamen</h2>
    <p class="small">Chwazi lekòl anba a epi antre modpas lekòl / klas / matyè.</p>
  </div>

  <div id="schools-wrapper" class="card"></div>

<script>
(() => {
  // ---------- CONFIG ----------
  const BASE_URL = 'https://examen-backend-ihlx.onrender.com';
  const ENDPOINTS = {
    school: BASE_URL + '/api/verify-school',
    class: BASE_URL + '/api/verify-class',
    subject: BASE_URL + '/api/verify-subject'
  };
  // Default formsubmit (will post to school's configured email or central info)
  const GLOBAL_FORM_ENDPOINT = 'https://formsubmit.co/ajax/infos@fondationbackupspirituel.com';

  // ---------- SCHOOLS LIST (no passwords here) ----------
  const schools = [
    { id:'fobas', name:'Fondation BackupSpirituel', formEmail:'infos@fondationbackupspirituel.com' },
    { id:'lumiere', name:'College Lumiere Lakay de Mare Rouge', formEmail:'lumiere@fondationbackupspirituel.com' },
    { id:'cefotech', name:'College CEFOTECH-CO de Mare Rouge', formEmail:'cefotech@fondationbackupspirituel.com' }
  ];

  // classes & subjects (shared lists)
  const classesList = [
    { id:'7em', label:'7èm' },
    { id:'8em', label:'8èm' },
    { id:'9em', label:'9èm' },
    { id:'NS1', label:'NS I' },
    { id:'NS2', label:'NS II' },
    { id:'NS3', label:'NS III' },
    { id:'NS4', label:'NS IV' }
  ];

  const subjectsList = [
    { id:'math', label:'Matematik' },
    { id:'informatique', label:'Informatique' },
    { id:'creole', label:'Kreyòl' },
    { id:'francais', label:'Franse' },
    { id:'anglais', label:'Anglè' },
    { id:'sciences', label:'Syans' },
    { id:'histoire', label:'Istwa' },
    { id:'geographie', label:'Jeyografi' },
    { id:'espagnol', label:'Espayòl' },
    { id:'philosophie', label:'Filosofi' }
  ];

  const wrapper = document.getElementById('schools-wrapper');

  // ---------- UTILITIES (IP fetch) ----------
  async function fetchClientIP(){
    try{
      const r = await fetch('https://api.ipify.org?format=json');
      if(!r.ok) return 'unknown';
      const j = await r.json();
      return j.ip || 'unknown';
    }catch(e){ return 'unknown'; }
  }

  // ---------- RENDER single school block ----------
  function renderSchool(school){
    const container = document.createElement('div');
    container.className = 'school-container';
    container.innerHTML = `
      <h3>${school.name}</h3>

      <div class="section-school">
        <input class="school-pw" type="password" placeholder="Modpas lekòl (pa gen modpas nan kòd)">
        <button class="btn school-validate">Ouvri Espas</button>
        <div class="school-msg small" style="color:#b02a37;display:none"></div>
      </div>

      <div class="classes-box hidden" style="margin-top:14px">
        <h4>Chwazi Klas</h4>
        <div class="class-list" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        <div class="class-pw-box hidden" style="margin-top:10px">
          <div class="class-title" style="font-weight:700;margin-bottom:6px"></div>
          <input class="class-pw" type="password" placeholder="Modpas klas">
          <button class="btn class-validate">Valide Klas</button>
          <div class="class-msg small" style="margin-top:6px;color:#b02a37;display:none"></div>
        </div>
      </div>

      <div class="subjects-box hidden" style="margin-top:14px">
        <h4>Matières — antre modpas pou ouvri egzamen</h4>
        <div class="subjects-grid grid"></div>
        <div class="subject-pw-box hidden" style="margin-top:10px">
          <div class="subject-title" style="font-weight:700;margin-bottom:6px"></div>
          <input class="subject-pw" type="password" placeholder="Modpas matyè">
          <button class="btn subject-validate">Valide Matyè</button>
          <div class="subject-msg small" style="margin-top:6px;color:#b02a37;display:none"></div>
        </div>
      </div>

      <div class="exam-box hidden" style="margin-top:14px">
        <h4 class="exam-title"></h4>
        <div class="small">Timer: <span class="timer">120:00</span></div>
        <form class="exam-form" style="margin-top:10px">
          <div style="display:grid;gap:8px">
            <input name="nom_prenom" placeholder="Nom / Prénom *" required style="padding:8px;border:1px solid #d0d7de;border-radius:6px;">
            <input name="ecole" placeholder="Nom d'Ecole *" required style="padding:8px;border:1px solid #d0d7de;border-radius:6px;">
            <input name="classe" placeholder="Classe *" required style="padding:8px;border:1px solid #d0d7de;border-radius:6px;">
            <input name="email" type="email" placeholder="Email *" required style="padding:8px;border:1px solid #d0d7de;border-radius:6px;">
          </div>
          <hr>
          <div class="exam-questions" style="margin-bottom:12px">
            <div><strong>1)</strong> Kisa yon email ye?<br><textarea name="q1" style="width:100%;min-height:80px;padding:8px;border-radius:6px;border:1px solid #d0d7de"></textarea></div>
            <div style="margin-top:8px"><strong>2)</strong> Kisa 'subject' nan email ye?<br><textarea name="q2" style="width:100%;min-height:80px;padding:8px;border-radius:6px;border:1px solid #d0d7de"></textarea></div>
          </div>

          <div style="display:flex;gap:8px;align-items:center">
            <button type="submit" class="btn">Soumèt</button>
            <div class="submit-msg small" style="color:#0b63b3;display:none;margin-left:8px"></div>
          </div>
        </form>
      </div>
    `;
    wrapper.appendChild(container);

    // init logic for this school block
    initSchoolLogic(container, school);
  }

  // ---------- School block logic (per instance) ----------
  function initSchoolLogic(rootEl, school){
    // UI refs
    const schoolPw = rootEl.querySelector('.school-pw');
    const schoolValidate = rootEl.querySelector('.school-validate');
    const schoolMsg = rootEl.querySelector('.school-msg');

    const classesBox = rootEl.querySelector('.classes-box');
    const classListEl = rootEl.querySelector('.class-list');
    const classPwBox = rootEl.querySelector('.class-pw-box');
    const classTitle = rootEl.querySelector('.class-title');
    const classPw = rootEl.querySelector('.class-pw');
    const classValidate = rootEl.querySelector('.class-validate');
    const classMsg = rootEl.querySelector('.class-msg');

    const subjectsBox = rootEl.querySelector('.subjects-box');
    const subjectsGrid = rootEl.querySelector('.subjects-grid');
    const subjectPwBox = rootEl.querySelector('.subject-pw-box');
    const subjectTitle = rootEl.querySelector('.subject-title');
    const subjectPw = rootEl.querySelector('.subject-pw');
    const subjectValidate = rootEl.querySelector('.subject-validate');
    const subjectMsg = rootEl.querySelector('.subject-msg');

    const examBox = rootEl.querySelector('.exam-box');
    const examTitle = rootEl.querySelector('.exam-title');
    const examForm = rootEl.querySelector('.exam-form');
    const submitMsg = rootEl.querySelector('.submit-msg');
    const timerEl = rootEl.querySelector('.timer');

    // state
    let currentClass = null;
    let currentSubject = null;
    let timerInterval = null;
    let remainingSeconds = 120*60;
    // anti-cheat tracking
    let ipAddress = 'unknown';
    let focusLostCount = 0;
    let startTimestamp = null;
    let endTimestamp = null;
    let visibilityHandler = null;
    let blurHandler = null;
    let beforeUnloadHandler = null;

    function show(el){ el.classList.remove('hidden'); }
    function hide(el){ el.classList.add('hidden'); }

    // BLOCK basic copy/context menu to discourage quick copy/paste (but not foolproof)
    rootEl.addEventListener('contextmenu', e => e.preventDefault());
    rootEl.addEventListener('keydown', e => {
      // prevent Ctrl/Command+Tab? cannot fully, but prevent common copy keys
      if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'x' || e.key === 'v' || e.key === 'a')) {
        e.preventDefault();
      }
    });

    // ---------- school verification (delegated to backend) ----------
    schoolValidate.addEventListener('click', async ()=>{
      schoolMsg.style.display = 'none';
      const pw = (schoolPw.value||'').trim();
      if(!pw){ schoolMsg.style.display = 'block'; schoolMsg.innerText = 'Antre modpas lekòl la.'; return; }
      try{
        schoolValidate.disabled = true; schoolValidate.innerText = 'Ap verifye...';
        const resp = await fetch(ENDPOINTS.school, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ password: pw, school: school.id })
        });
        const data = await resp.json();
        if(resp.ok && data.success){
          // hide only the inputs for this school block (keep everything else intact)
          schoolPw.style.display='none';
          schoolValidate.style.display='none';
          show(classesBox);
          renderClasses();
        } else {
          schoolMsg.style.display='block';
          schoolMsg.innerText = (data && data.message) ? data.message : 'Modpas lekòl pa kòrèk';
        }
      } catch(err){
        schoolMsg.style.display='block';
        schoolMsg.innerText = 'Erè verifye: ' + (err.message||err);
      } finally {
        schoolValidate.disabled = false; schoolValidate.innerText = 'Ouvri Espas';
      }
    });

    function renderClasses(){
      classListEl.innerHTML = '';
      classesList.forEach(c => {
        const b = document.createElement('button');
        b.className = 'btn-outline';
        b.style.margin = '6px';
        b.innerText = c.label;
        b.onclick = () => {
          currentClass = c.id;
          classTitle.innerText = 'Modpas pou klas ' + c.label;
          classPw.value = '';
          classMsg.style.display = 'none';
          show(classPwBox);
        };
        classListEl.appendChild(b);
      });
    }

    // ---------- class verification ----------
    classValidate.addEventListener('click', async ()=>{
      classMsg.style.display = 'none';
      const pw = (classPw.value||'').trim();
      if(!pw){ classMsg.style.display='block'; classMsg.innerText='Antre modpas klas la'; return; }
      try{
        classValidate.disabled = true; classValidate.innerText='Ap verifye...';
        const resp = await fetch(ENDPOINTS.class, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ password: pw, school: school.id, class: currentClass })
        });
        const data = await resp.json();
        if(resp.ok && data.success){
          hide(classPwBox);
          show(subjectsBox);
          renderSubjects();
        } else {
          classMsg.style.display='block';
          classMsg.innerText = (data && data.message) ? data.message : 'Modpas klas pa kòrèk';
        }
      } catch(err){
        classMsg.style.display='block';
        classMsg.innerText = 'Erè: ' + (err.message||err);
      } finally {
        classValidate.disabled=false; classValidate.innerText='Valide Klas';
      }
    });

    function renderSubjects(){
      subjectsGrid.innerHTML = '';
      subjectsList.forEach(s => {
        const d = document.createElement('div');
        d.style.border='1px solid #eef3f7'; d.style.padding='8px'; d.style.borderRadius='8px';
        d.style.textAlign='center'; d.style.cursor='pointer';
        d.innerHTML = `<div style="font-weight:700">${s.label}</div><div class="small">swiv egzamen</div>`;
        d.onclick = () => {
          currentSubject = s.id;
          subjectTitle.innerText = s.label + ' — Antre modpas';
          subjectPw.value=''; subjectMsg.style.display='none';
          show(subjectPwBox);
        };
        subjectsGrid.appendChild(d);
      });
    }

    // ---------- subject verification & exam start ----------
    subjectValidate.addEventListener('click', async ()=>{
      subjectMsg.style.display='none';
      const pw = (subjectPw.value||'').trim();
      if(!pw){ subjectMsg.style.display='block'; subjectMsg.innerText='Antre modpas matyè a'; return; }
      try{
        subjectValidate.disabled=true; subjectValidate.innerText='Ap verifye...';
        const resp = await fetch(ENDPOINTS.subject, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ password: pw, school: school.id, class: currentClass, subject: currentSubject })
        });
        const data = await resp.json();
        if(resp.ok && data.success){
          hide(subjectPwBox);
          // start anti-cheat protections + fetch IP
          await prepareExamEnvironment();
          startExam();
        } else {
          subjectMsg.style.display='block';
          subjectMsg.innerText = (data && data.message) ? data.message : 'Modpas matyè pa kòrèk';
        }
      } catch(err){
        subjectMsg.style.display='block';
        subjectMsg.innerText='Erè: ' + (err.message||err);
      } finally {
        subjectValidate.disabled=false; subjectValidate.innerText='Valide Matyè';
      }
    });

    // ---------- prepare environment: fetch IP, set listeners ----------
    async function prepareExamEnvironment(){
      // get client IP (best-effort)
      ipAddress = await fetchClientIP();

      focusLostCount = 0;
      startTimestamp = new Date().toISOString();

      // warn on before unload
      beforeUnloadHandler = function(e){
        e.preventDefault();
        e.returnValue = "Ou gen yon egzamen k ap kouri — si ou kite paj la soumèt la ka echwe.";
        return e.returnValue;
      };
      window.addEventListener('beforeunload', beforeUnloadHandler);

      // visibility change / focus/blur tracking
      visibilityHandler = function(){
        if(document.hidden) { focusLostCount++; }
      };
      blurHandler = function(){ focusLostCount++; };

      document.addEventListener('visibilitychange', visibilityHandler);
      window.addEventListener('blur', blurHandler);

      // Attempt entering fullscreen (user may have to allow)
      const el = rootEl.querySelector('.exam-box') || document.documentElement;
      if(el.requestFullscreen){
        try{ await el.requestFullscreen(); }catch(e){ /* ignore */ }
      } else if(el.webkitRequestFullscreen){
        try{ el.webkitRequestFullscreen(); }catch(e){ }
      }

      // show top banner to remind student
      showLockBanner(rootEl);
    }

    // show a persistent banner at top (per school)
    function showLockBanner(root){
      // create if not exist
      if(root.querySelector('.banner-lock')) return;
      const b = document.createElement('div');
      b.className = 'banner-lock no-select';
      b.innerText = 'EXAMEN AN KOU — Pa kite paj la / pa fè multi-task. Bouton "Soumèt" dwe peze lè fini.';
      root.appendChild(b);
    }
    function removeLockBanner(root){
      const b = root.querySelector('.banner-lock');
      if(b) b.remove();
    }

    // ---------- start exam UI + timer ----------
    function startExam(){
      const subjLabel = (subjectsList.find(s => s.id === currentSubject) || {}).label || currentSubject;
      examTitle.innerText = 'Egzamen: ' + subjLabel;
      show(examBox);
      examForm.reset();
      submitMsg.style.display='none';
      remainingSeconds = 120*60; // 120 minutes as requested
      timerEl.innerText = formatTime(remainingSeconds);
      if(timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(()=>{
        remainingSeconds--;
        timerEl.innerText = formatTime(remainingSeconds);
        if(remainingSeconds <= 0){
          clearInterval(timerInterval);
          autoSubmit();
        }
      }, 1000);
      // scroll into view
      examBox.scrollIntoView({behavior:'smooth'});
    }

    function formatTime(sec){
      const m = Math.floor(sec/60).toString().padStart(2,'0');
      const s = (sec%60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }

    // ---------- auto-submit when timer ends ----------
    async function autoSubmit(){
      try{
        submitMsg.style.display='block';
        submitMsg.innerText='Tan fini — ap soumèt otomatikman...';
        await submitExamForm(true);
      }catch(e){
        submitMsg.innerText='Echwe soumèt otomatikman: ' + (e.message || e);
      }
    }

    // ---------- submit handler (adds technical metadata) ----------
    examForm.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      await submitExamForm(false);
    });

    async function submitExamForm(isAuto=false){
      endTimestamp = new Date().toISOString();

      // append metadata to form data
      const fd = new FormData(examForm);
      fd.append('Exam Subject', currentSubject || '');
      fd.append('Exam Class', currentClass || '');
      fd.append('Exam School', school.id || '');
      fd.append('Client IP', ipAddress);
      fd.append('User Agent', navigator.userAgent || '');
      fd.append('Focus Lost Count', String(focusLostCount));
      fd.append('Start Time', startTimestamp || '');
      fd.append('End Time', endTimestamp || '');
      fd.append('AutoSubmitted', isAuto ? 'yes' : 'no');
      fd.append('Source Page', window.location.href);

      try{
        submitMsg.style.display='block';
        submitMsg.innerText = 'Ap voye...';

        // 1) Send to school email via formsubmit (primary)
        const schoolEndpoint = `https://formsubmit.co/ajax/${school.formEmail}`;
        const resp1 = await fetch(schoolEndpoint, { method:'POST', body: fd, headers:{'Accept':'application/json'} });
        const data1 = await resp1.json();
        if(!resp1.ok){
          // still attempt to notify central info below, but throw later if needed
          console.warn('School formsubmit failed', data1);
        }

        // 2) Send a separate centralized notification to infos@... (include details)
        const notifFd = new FormData();
        notifFd.append('Subject', `Nouvo soumèt egzamen — ${school.name} / ${currentClass || ''} / ${currentSubject || ''}`);
        const details = [
          `School: ${school.name} (${school.id})`,
          `Class: ${currentClass || ''}`,
          `Subject: ${currentSubject || ''}`,
          `Student Name: ${fd.get('nom_prenom') || ''}`,
          `Student Email: ${fd.get('email') || ''}`,
          `Client IP: ${ipAddress}`,
          `User Agent: ${navigator.userAgent || ''}`,
          `Focus Lost Count: ${focusLostCount}`,
          `Start Time: ${startTimestamp}`,
          `End Time: ${endTimestamp}`,
          `AutoSubmitted: ${isAuto ? 'yes' : 'no'}`,
          `Source Page: ${window.location.href}`
        ].join('\n');
        notifFd.append('message', details);

        try{
          const resp2 = await fetch(GLOBAL_FORM_ENDPOINT, { method:'POST', body: notifFd, headers:{'Accept':'application/json'} });
          const data2 = await resp2.json();
          if(!resp2.ok){
            console.warn('Central notification failed', data2);
          }
        }catch(e){
          console.warn('Central notification fetch failed', e);
        }

        // if primary school response was not ok, still show success but log warning
        if(!resp1.ok){
          submitMsg.innerText = 'Soumèt (avètisman): te resevwa, men te gen yon pwoblèm avèk destinasyon imel lekòl la.';
        } else {
          submitMsg.innerText = '✅ Egzamen soumèt ak siksè.';
        }

        // cleanup protections
        cleanupExamEnvironment();

        // optionally hide exam after submit
        hide(examBox);
      }catch(err){
        submitMsg.innerText = 'Erè pandan soumèt: ' + (err.message || err);
      }
    }

    // ---------- cleanup after submit or abort ----------
    function cleanupExamEnvironment(){
      // remove listeners
      if(beforeUnloadHandler) window.removeEventListener('beforeunload', beforeUnloadHandler);
      if(visibilityHandler) document.removeEventListener('visibilitychange', visibilityHandler);
      if(blurHandler) window.removeEventListener('blur', blurHandler);

      // exit fullscreen if possible
      if(document.fullscreenElement){
        try{ document.exitFullscreen(); }catch(e){ /* ignore */ }
      } else if(document.webkitFullscreenElement){
        try{ document.webkitExitFullscreen(); }catch(e){ }
      }

      // remove banner
      removeLockBanner(rootEl);

      // clear timer
      if(timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

  } // end initSchoolLogic

  // ---------- render all schools on page ----------
  schools.forEach(s => renderSchool(s));

})();
</script>

<script>
(function(){
  // CONFIG
  const BASE_API = 'https://examen-backend-ihlx.onrender.com'; // si backend Render diferan, ranplase la
  const FORM_ENDPOINT = 'https://formsubmit.co/ajax/infos@fondationbackupspirituel.com';

  // Root container
  const root = document.getElementById('epfobas-widget-root');
  root.innerHTML = `
    <div id="epfobas-root" class="epf-card">
      <div class="epf-h">École Professionnelle FOBAS — Espaces d'examens</div>
      <div class="epf-sub">Chwazi kalite kou (Online / Local) epi domèn egzamen. Lè w ouvri yon egzamen ekran an ap bloke jiskaske w soumèt.</div>
      <div class="epf-courses">
        <div class="epf-course">
          <h4>Cours Online</h4>
          <p class="epf-small">Egzamen disponib:</p>

  // QUESTIONS BANK

        { q:"5) Kijan w pwoteje modpas sou entènèt?", a:"Itilize modpas fò, 2FA, pa pataje modpas."},
        { q:"6) Kisa yon 'cookie' fè?", a:"Sere preferans oswa sesyon sou navigatè."},

      questions: [
        { q:"1) Kisa 'piratage éthique' ye?", a:"Tès sekirite ki fèt legalman pou idantifye feblès."},
        { q:"2) Ki prensip debaz sekirite?", a:"Konfidansyalite, entegrite, disponiblite."},

  // Utils
  const prefix = 'epfobas';

  // Create modal (same as before)
  function createExamModal(course, domainKey) {
    const bank = EXAM_BANK[domainKey];
    const domainLabel = bank.label;
    const overlay = document.createElement('div');
    overlay.className = 'epf-modal-overlay';
    overlay.id = prefix + '-overlay-' + course + '-' + domainKey;
    overlay.innerHTML = `
      <div class="epf-modal" role="dialog" aria-modal="true">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:700;font-size:18px">${domainLabel} — ${course === 'online' ? 'Cours Online' : 'Cours Local'}</div>
            <div class="epf-small">Tan egzamen: <span class="epf-timer" id="${prefix}-timer">60:00</span></div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <button class="epf-close" id="${prefix}-close-btn">Fèmen</button>
          </div>
        </div>

        <hr style="margin:12px 0">

        <form id="${prefix}-form" style="max-width:100%">
          <div class="epf-row">
            <div class="epf-field"><label class="epf-small">Nom / Prénom</label><input name="nom_prenom" class="epf-input" required></div>
            <div class="epf-field"><label class="epf-small">Dat egzamen</label><input name="date_exam" type="date" class="epf-input" required></div>
            <div class="epf-field"><label class="epf-small">Professeur</label><input name="professeur" class="epf-input" required></div>
            <div class="epf-field"><label class="epf-small">Domaine</label><input name="domaine" class="epf-input" value="${domainLabel}" readonly></div>
            <div class="epf-field"><label class="epf-small">Cours</label><input name="cours" class="epf-input" value="${course === 'online' ? 'Cours Online' : 'Cours Local'}" readonly></div>
            <div class="epf-field"><label class="epf-small">Email</label><input name="email" type="email" class="epf-input" required></div>
            <div class="epf-field"><label class="epf-small">Whatsapp</label><input name="whatsapp" class="epf-input"></div>
          </div>

          <div class="epf-score">
            <div class="epf-small" style="font-weight:700">Ajiste Nòt (professeur)</div>
            <button type="button" class="epf-btn epf-penal" data-points="-5">-5</button>
            <button type="button" class="epf-btn epf-penal" data-points="-10">-10</button>
            <div style="margin-left:8px"><span id="${prefix}-score" style="font-weight:700;color:#0b63b3">0</span> pts</div>
          </div>

          <div class="epf-questions" id="${prefix}-questions"></div>

          <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
            <button type="submit" class="epf-btn" id="${prefix}-submit">Soumet</button>
            <button type="button" class="epf-close" id="${prefix}-cancel">Anile</button>
            <div id="${prefix}-submit-msg" class="epf-small" style="color:#0b63b3;display:none;margin-left:8px"></div>
          </div>

          <div id="${prefix}-thanks" class="epf-thanks" style="display:none">Mèsi pou pasyans ou te pran pou w te rive pase egzamen sa, li ale avèk sikse.</div>
        </form>
      </div>
    `;
    const qContainer = overlay.querySelector('#' + prefix + '-questions');
    bank.questions.forEach((it, idx) => {
      const div = document.createElement('div');
      div.className = 'epf-question';
      div.innerHTML = `<div style="font-weight:700">${it.q}</div>
                       <textarea name="q${idx+1}" class="epf-textarea" placeholder="Repons ou..."></textarea>
                       <div class="epf-small" style="margin-top:6px;color:#777">Réponse modèle (référence): ${it.a}</div>`;
      qContainer.appendChild(div);
    });
    document.body.appendChild(overlay);
    return overlay;
  }

  // Locking interactions
  function engageLock(overlay) {
    function ctx(e){ e.preventDefault(); }
    function keyHandler(e){
      if (e.key === 'F12' || (e.ctrlKey && (e.key.toLowerCase() === 'w' || e.key.toLowerCase() === 't' || e.key.toLowerCase() === 'r')) || (e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='i')) {
        e.preventDefault(); e.stopPropagation();
      }
    }
    document.addEventListener('contextmenu', ctx);
    document.addEventListener('keydown', keyHandler);
    function unloadHandler(e){ e.preventDefault(); e.returnValue = ''; return ''; }
    window.addEventListener('beforeunload', unloadHandler);
    overlay._unlock = function(){
      document.removeEventListener('contextmenu', ctx);
      document.removeEventListener('keydown', keyHandler);
      window.removeEventListener('beforeunload', unloadHandler);
      if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    };
  }

  // Fetch ip info
  async function fetchIpInfo(){
    try {
      const r = await fetch('https://api.ipify.org?format=json');
      const j = await r.json();
      const ip = j.ip;
      let country = '';
      try {
        const c = await fetch(`https://ipapi.co/${ip}/country_name/`);
        country = (await c.text()) || '';
      } catch(e){}
      return { ip, country };
    } catch(e){
      return { ip:'unknown', country:'' };
    }
  }

  // Submit handling (use FORM_ENDPOINT variable properly)
  async function handleSubmit(event, overlay, meta) {
    event.preventDefault();
    const form = overlay.querySelector('form');
    const submitMsg = overlay.querySelector('#' + prefix + '-submit-msg');
    const thanksEl = overlay.querySelector('#' + prefix + '-thanks');
    submitMsg.style.display = 'inline-block';
    submitMsg.innerText = 'Ap voye...';
    const fd = new FormData(form);
    const now = new Date().toISOString();
    fd.append('Exam Course', meta.course);
    fd.append('Exam Domain', meta.domainLabel);
    fd.append('Exam Started At', meta.startedAt);
    fd.append('Exam Submitted At', now);
    fd.append('Score Adjusted', meta.score || 0);
    const bank = EXAM_BANK[meta.domainKey];
    bank.questions.forEach((q,i)=>{
      fd.append(`Model Answer Q${i+1}`, q.a);
    });
    fd.append('User Agent', navigator.userAgent || '');
    try {
      const ipinfo = await fetchIpInfo();
      fd.append('IP Address', ipinfo.ip || '');
      fd.append('Country', ipinfo.country || '');
    } catch(e){}
    fd.append('Source Page', window.location.href);

    try {
      const resp = await fetch(FORM_ENDPOINT, {
        method: 'POST',
        body: fd,
        headers: { 'Accept': 'application/json' }
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.message || 'Erreur lors de l\'envoi');
      submitMsg.innerText = '✅ Egzamen soumèt ak siksè.';
      thanksEl.style.display = 'block';
      setTimeout(()=>{ try{ overlay._unlock(); }catch(e){} }, 1500);
    } catch(err){
      submitMsg.innerText = 'Erè pandan soumèt: ' + (err.message || err);
    }
  }

  // Verify school password via backend for École Professionnelle FOBAS
  async function verifySchoolPasswordForEPF(password) {
    try {
      const resp = await fetch(BASE_API + '/api/verify-school', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ school: 'EPFOBAS', password: password })
      });
      if (!resp.ok) {
        const err = await resp.json().catch(()=>({message:'Invalid'}));
        return { ok:false, message: err && err.message ? err.message : 'Invalid password' };
      }
      const data = await resp.json();
      return { ok:true, data };
    } catch(e){
      return { ok:false, message: e.message || 'Network error' };
    }
  }

  // Hook up launch buttons with school-password gating for EPFOBAS
  document.querySelectorAll('.epf-launch').forEach(btn=>{
    btn.addEventListener('click', async (ev)=>{
      const course = btn.dataset.course;
      const domainKey = btn.dataset.domain;

      // For École Professionnelle FOBAS, require school password verification first.
      // Prompt for school password (you can replace prompt() with nicer modal UI later)
      const pw = prompt('Antre modpas pou École Professionnelle FOBAS (pa pataje li):');
      if (!pw) { alert('Modpas obligatwa pou antre nan espas lekol la.'); return; }

      // verify on backend
      const verify = await verifySchoolPasswordForEPF(pw);
      if (!verify.ok) {
        alert('Erè verifye modpas: ' + (verify.message || 'Mot de passe envalid'));
        return;
      }

      // If verified -> open modal and lock
      const overlay = createExamModal(course, domainKey);
      const meta = {
        course: course === 'online' ? 'Cours Online' : 'Cours Local',
        domainKey,
        domainLabel: EXAM_BANK[domainKey].label,
        startedAt: new Date().toISOString(),
        score: 0
      };

      // penal buttons
      overlay.querySelectorAll('.epf-penal').forEach(pbtn=>{
        pbtn.addEventListener('click', ()=>{
          const pts = parseInt(pbtn.dataset.points || '0', 10);
          meta.score += pts;
          overlay.querySelector('#' + prefix + '-score').innerText = meta.score;
        });
      });

      overlay.querySelector('#' + prefix + '-close-btn').addEventListener('click', ()=>{
        if (confirm('Ou vle anile egzamen an? Ou pral pèdi tout repons ou yo.')) overlay._unlock();
      });
      overlay.querySelector('#' + prefix + '-cancel').addEventListener('click', ()=>{
        if (confirm('Ou vle anile egzamen an? Ou pral pèdi tout repons ou yo.')) overlay._unlock();
      });

      overlay.querySelector('form').addEventListener('submit', (evt)=> handleSubmit(evt, overlay, meta) );

      engageLock(overlay);

      // start timer
      const timerEl = overlay.querySelector('#' + prefix + '-timer');
      let remaining = 60 * 60; // 60 minutes
      function formatTime(s){ const m = Math.floor(s/60).toString().padStart(2,'0'); const ss = (s%60).toString().padStart(2,'0'); return `${m}:${ss}`; }
      timerEl.innerText = formatTime(remaining);
      const interval = setInterval(()=> {
        remaining--;
        if (timerEl) timerEl.innerText = formatTime(remaining);
        if (remaining <= 0) {
          clearInterval(interval);
          try { overlay.querySelector('form').dispatchEvent(new Event('submit', {cancelable:true})); } catch(e){}
        }
      }, 1000);

      setTimeout(()=>{ const first = overlay.querySelector('input[name="nom_prenom"]'); if(first) first.focus(); }, 200);
    });
  });

})();
</script>

<script>
(function(){
  const API_BASE = ' https://examen-backend-ihlx.onrender.com'; // 🔑 ranplase ak URL backend Render ou

  async function loadStats(){
    try {
      const r = await fetch(`${API_BASE}/api/stats`, {cache:"no-store"});
      const s = await r.json();

      // ✅ Afichaj nimewo yo
      const nums = document.getElementById('prof-stats-numbers');
      nums.innerHTML = `
        <div><b>${s.totalEtudiants || 0}</b><div style="font-size:12px;color:#555">Étudiants</div></div>

      `;

      // ✅ Graf Online vs Local
      const svg = document.getElementById('prof-stats-bars'); 
      svg.innerHTML='';
      const items = s.byType || [];
      const w = svg.clientWidth; 
      const h = 140;
      const barW = Math.max(30, Math.floor(w / (items.length||1)) - 10);
      const max = Math.max(...items.map(it=>it.count),1);

      items.forEach((it,i)=>{
        const x = i*(barW+30)+40;
        const height = Math.round((it.count/max)*(h-40));
        svg.innerHTML += `
          <rect x="${x}" y="${h-20-height}" width="${barW}" height="${height}" fill="#0b63b3" rx="6"></rect>
          <text x="${x+barW/2}" y="${h-4}" text-anchor="middle" font-size="12">${it.label}</text>
          <text x="${x+barW/2}" y="${h-26-height}" text-anchor="middle" font-size="12" fill="#333">${it.count}</text>
        `;
      });
    } catch (err){
      console.error("Erreur stats:", err);
    }
  }

  // ✅ Chaje otomatik
  loadStats();
})();
