/* Function to populate exam questions into the .exam-questions container */
/**
 * schoolId: string (eg 'fobas')
 * classId: string (eg '7em')
 * subjectId: string (eg 'math')
 * containerEl: DOM element (the .exam-questions div)
 */
function populateExamQuestions(schoolId, classId, subjectId, containerEl) {
  containerEl = containerEl || document.querySelector('.exam-questions');
  if(!containerEl) return;
  // default fallback: if not found in QUESTIONS, show 2 default fields (backwards compatibility)
  const subjectSet = (QUESTIONS[schoolId] && QUESTIONS[schoolId][classId] && QUESTIONS[schoolId][classId][subjectId]) || null;

  if(!subjectSet) {
    // fallback: show two simple fields as before (keeps compatibility)
    containerEl.innerHTML = `
      <div><strong>1)</strong> Kisa yon email ye?<br><textarea name="q1" style="width:100%;min-height:80px;padding:8px;border-radius:6px;border:1px solid #d0d7de"></textarea></div>
      <div style="margin-top:8px"><strong>2)</strong> Kisa 'subject' nan email ye?<br><textarea name="q2" style="width:100%;min-height:80px;padding:8px;border-radius:6px;border:1px solid #d0d7de"></textarea></div>
    `;
    return;
  }

  // Build HTML for 10 questions
  let html = '';
  for(let i=0;i<subjectSet.length;i++){
    const qText = subjectSet[i];
    // name each textarea so backend can identify subject and index
    const fieldName = `q_${subjectId}_${i+1}`;
    html += `<div style="${i>0 ? 'margin-top:8px':''}"><strong>${i+1})</strong> ${escapeHtml(qText)}<br><textarea name="${fieldName}" style="width:100%;min-height:80px;padding:8px;border-radius:6px;border:1px solid #d0d7de"></textarea></div>`;
  }
  containerEl.innerHTML = html;
}

/* small helper to escape HTML in question texts */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; });
}

function populateExamQuestions(schoolId, classId, subjectId, container){
  if(schoolId !== "fobas") return; // sèlman pou FOBAS pou kounya
  const questions = examQuestionsFOBAS[classId]?.[subjectId] || [];
  container.innerHTML = '';
  questions.forEach((q,i)=>{
    const div = document.createElement('div');
    div.innerHTML = `<strong>${i+1})</strong> ${q}<br><textarea name="q${i+1}" style="width:100%;min-height:80px;padding:8px;border-radius:6px;border:1px solid #d0d7de"></textarea>`;
    container.appendChild(div);
  });
}

      submitMsg.style.display='none';

      timerEl.innerText = formatTime(remainingSeconds);
      if(timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(()=>{
        remainingSeconds--;
        timerEl.innerText = formatTime(remainingSeconds);
        if(remainingSeconds <= 0){
          clearInterval(timerInterval);
          autoSubmit();
        }
      }, 1000);
      // scroll into view
      examBox.scrollIntoView({behavior:'smooth'});
    }

    function formatTime(sec){
      const m = Math.floor(sec/60).toString().padStart(2,'0');
      const s = (sec%60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }

    // ---------- auto-submit when timer ends ----------
    async function autoSubmit(){
      try{
        submitMsg.style.display='block';
        submitMsg.innerText='Tan fini — ap soumèt otomatikman...';
        await submitExamForm(true);
      }catch(e){
        submitMsg.innerText='Echwe soumèt otomatikman: ' + (e.message || e);
      }
    }

    // ---------- submit handler (adds technical metadata) ----------
    examForm.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      await submitExamForm(false);
    });

    /*
      Modified submit flow to ensure:
      - Central notification to infos@fondationbackupspirituel.com is always attempted (and awaited)
      - Then attempt sending to the school's configured form endpoint
      - On success display the exact user-visible message requested
      - Use AJAX endpoints (no redirect)
      - Also includes penalty_points (already a hidden input attached to the form)
    */
    async function submitExamForm(isAuto=false){
      endTimestamp = new Date().toISOString();

      // append metadata to form data
      const fd = new FormData(examForm);
      fd.append('Exam Subject', currentSubject || '');
      fd.append('Exam Class', currentClass || '');
      fd.append('Exam School', school.id || '');
      fd.append('Client IP', ipAddress);
      fd.append('User Agent', navigator.userAgent || '');
      fd.append('Focus Lost Count', String(focusLostCount));
      fd.append('Start Time', startTimestamp || '');
      fd.append('End Time', endTimestamp || '');
      fd.append('AutoSubmitted', isAuto ? 'yes' : 'no');
      fd.append('Source Page', window.location.href);

      try{
        submitMsg.style.display='block';
        submitMsg.innerText = 'Ap voye...';

        // 1) PRIMARY: Send central notification FIRST to ensure central copy is received
        const notifFd = new FormData();
        notifFd.append('Subject', `Nouvo soumèt egzamen — ${school.name} / ${currentClass || ''} / ${currentSubject || ''}`);
        const details = [
          `School: ${school.name} (${school.id})`,
          `Class: ${currentClass || ''}`,
          `Subject: ${currentSubject || ''}`,
          `Student Name: ${fd.get('nom_prenom') || ''}`,
          `Student Email: ${fd.get('email') || ''}`,
          `Penalty Points: ${fd.get('penalty_points') || '0'}`,
          `Client IP: ${ipAddress}`,
          `User Agent: ${navigator.userAgent || ''}`,
          `Focus Lost Count: ${focusLostCount}`,
          `Start Time: ${startTimestamp}`,
          `End Time: ${endTimestamp}`,
          `AutoSubmitted: ${isAuto ? 'yes' : 'no'}`,
          `Source Page: ${window.location.href}`
        ].join('\n');
        notifFd.append('message', details);

        let centralOk = false;
        try{
          const respCentral = await fetch(GLOBAL_FORM_ENDPOINT, { method:'POST', body: notifFd, headers:{'Accept':'application/json'} });
          if(respCentral.ok){
            centralOk = true;
          } else {
            console.warn('Central notification non-ok', respCentral.status);
          }
        }catch(e){
          console.warn('Central notification fetch failed', e);
        }

        // 2) SECONDARY: attempt to send to the school's configured email via formsubmit (best-effort)
        let schoolOk = false;
        try{
          const schoolEndpoint = `https://formsubmit.co/ajax/${school.formEmail}`;
          const respSchool = await fetch(schoolEndpoint, { method:'POST', body: fd, headers:{'Accept':'application/json'} });
          if(respSchool.ok){
            schoolOk = true;
          } else {
            console.warn('School formsubmit failed', respSchool.status);
          }
        }catch(e){
          console.warn('School submission failed', e);
        }

        // 3) Determine user-visible result message (exact phrase requested)
        // Always show the exact confirmation message on the page (no redirect)
        submitMsg.innerText = 'Ou rive voye egzamen w lan ale avek sikse';

        // cleanup protections
        cleanupExamEnvironment();

        // keep exam visible briefly so student sees confirmation; then hide exam form
        setTimeout(()=>{
          hide(examBox);
        }, 1200);

      }catch(err){
        submitMsg.innerText = 'Erè pandan soumèt: ' + (err.message || err);
      }
    }

    // ---------- cleanup after submit or abort ----------
    function cleanupExamEnvironment(){
      // remove listeners
      if(beforeUnloadHandler) window.removeEventListener('beforeunload', beforeUnloadHandler);
      if(visibilityHandler) document.removeEventListener('visibilitychange', visibilityHandler);
      if(blurHandler) window.removeEventListener('blur', blurHandler);

      // exit fullscreen if possible
      if(document.fullscreenElement){
        try{ document.exitFullscreen(); }catch(e){ /* ignore */ }
      } else if(document.webkitFullscreenElement){
        try{ document.webkitExitFullscreen(); }catch(e){ }
      }

      // remove banner
      removeLockBanner(rootEl);

      // clear timer
      if(timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    // ---------- PENALTY BUTTONS BEHAVIOR (NEW) ----------
    function updatePenaltyUI(){
      penaltyTotalEl.innerText = `Total: ${penaltyPoints} Pts retire`;
      penaltyHiddenInput.value = String(penaltyPoints);
    }

    // send immediate penalty notification (so prof gets notified each click)
    async function notifyPenalty(delta, total){
      try{
        const pf = new FormData();
        pf.append('Subject', `Penalite ajoute — ${school.name} / ${currentClass || ''} / ${currentSubject || ''}`);
        const message = [
          `School: ${school.name} (${school.id})`,
          `Class: ${currentClass || ''}`,
          `Subject: ${currentSubject || ''}`,
          `Student Name: ${examForm.nom_prenom ? examForm.nom_prenom.value : ''}`,
          `Student Email: ${examForm.email ? examForm.email.value : ''}`,
          `Penalty Added: -${delta}`,
          `Penalty Total: ${total}`,
          `Timestamp: ${new Date().toISOString()}`
        ].join('\n');
        pf.append('message', message);
        // send to central inbox first
        await fetch(GLOBAL_FORM_ENDPOINT, { method:'POST', body: pf }).catch(()=>{ /* ignore */ });
        // also attempt to notify school's form email endpoint (best-effort)
        const schoolPf = new FormData();
        schoolPf.append('Subject', `Penalite: ${examForm.nom_prenom ? examForm.nom_prenom.value : ''}`);
        schoolPf.append('message', message);
        await fetch(`https://formsubmit.co/ajax/${school.formEmail}`, { method:'POST', body: schoolPf }).catch(()=>{ /* ignore */ });
      }catch(e){
        console.warn('notifyPenalty error', e);
      }
    }

    // show desordre message (fixed overlay) for 20 minutes
    function showDesordreMessage(){
      const d = document.getElementById('desordreMessage');
      if(!d) return;
      d.style.display = 'block';
      // clear previous timer if exist
      if(desordreMessageTimerId) { clearTimeout(desordreMessageTimerId); desordreMessageTimerId = null; }
      desordreMessageTimerId = setTimeout(()=>{ d.style.display = 'none'; desordreMessageTimerId = null; }, 20 * 60 * 1000); // 20 min
    }

    // on penalty click handler
    btnPens.forEach(btn => {
      btn.addEventListener('click', async (ev) => {
        const v = Number(btn.getAttribute('data-value')) || 0;
        // add positive total but show as "Pts retire"
        penaltyPoints += v;

        notifyPenalty(v, penaltyPoints);

              console.warn('auto submit failed', e);

            }

        }

      });
