<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Wallet FOBAS</title>
<link rel="stylesheet" href="dashboardwalletfobas.css">
</head>
<body>
<div class="dashboard-container">
   <header>
    <h1>Wallet FOBAS Dashboard</h1>
    <button id="logoutBtn">Déconnexion</button>
</header>

<!-- Nouvo tit Balance Actuel anwo dwat -->
<div id="balanceActuelContainer" style="position:absolute; top:20px; right:20px; font-size:16px; font-weight:bold;">
    Balance Actuel: <span id="balanceActuel">0</span> Gourdes
</div>

<section class="user-info">
    <h2>Bienvenue, <span id="userName"></span></h2>
    <p>Email : <span id="userEmail"></span></p>
    <p>Statut : <span id="userStatus">Active</span></p>
    <!-- Nouvo Balance Actuel -->
    <p>
        Balance Actuel: <strong><span id="balanceActuel">0</span> Gourdes</strong>
    </p>
</section>
<section class="actions">
    <button id="depositBtn">Déposer</button>
    <button id="withdrawBtn">Retirer</button>
    <button id="transferBtn">Transférer</button>
    <button id="bonusBtn">Bonus</button> <!-- <-- nouvo bouton Bonus -->
    <button id="changePasswordBtn">Changer le mot de passe</button>
</section>

<section id="actionArea">
    <!-- Rezilta aksyon yo ap parèt la -->
</section>

<section class="bonus-info" style="margin-top:15px;">
    <p>Bonus actuel : <strong><span id="walletBonus">0.00 Gourdes</span></strong></p>
</section>
</div>
<script src="dashboardwalletfobas.js"></script>

<!-- Socket.io pou Balance Actuel -->
<script src="/socket.io/socket.io.js"></script>
<script>
  // Konekte ak Socket.io
  const socket = io();

  // Koute event 'walletBalanceUpdate' soti nan backend
  socket.on('walletBalanceUpdate', (data) => {
    // Asire se dokiman itilizate ki konekte a
    const userEmail = document.getElementById('userEmail').textContent;

    if(data.email === userEmail && data.status === 'active') {
      // Mete ajou Balance Actuel an tan reyèl
      const balanceSpan = document.getElementById('walletBalance');
      balanceSpan.textContent = parseFloat(data.balance).toFixed(2) + " Gourdes";
    }
  });
</script>







<!-- STYLE KONTEUR -->
<style>
  #fbs-counter {
    position: absolute; 
    top: 10px; 
    left: 10px; 
    display: flex; 
    align-items: center; 
    gap: 8px;
    background: #ffffffdd; 
    padding: 3px 8px; 
    border-radius: 12px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
    color: #222;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
    z-index: 9999;
  }
  #fbs-counter iframe, 
  #fbs-counter div {
    display: inline-block;
    vertical-align: middle;
  }
</style>


<!-- STYLE POU POZISYON KONTEUR -->
<style>
  #wau-counter {
    position: fixed;   /* Toujou vizib */
    top: 10px;         /* Anlè */
    left: 10px;        /* Agoch */
    z-index: 9999;
    pointer-events: none; /* Bloke klik, anpeche redireksyon */
  }

  #wau-counter iframe,
  #wau-counter canvas {
    pointer-events: none !important; /* Asire pa gen klik ditou */
  }
</style>

<!-- KONTEUR (afiche anlè a goch) -->

    _wau.push(["dynamic", "45b8ju9ecv", "xwz", "c4302bffffff", "small"]);
  </script>
  <script async src="//waust.at/d.js"></script>
</div>

</body>
</html>
