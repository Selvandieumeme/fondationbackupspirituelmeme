<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible"
          content="IE=edge">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Microsoft Office Word 2007 Simulator
    </title>

    <link rel="stylesheet"
          href="campusword2007simulateur.css">

</head>

<body>

    <!-- ====================================================== -->
    <!-- ROOT APPLICATION -->
    <!-- ====================================================== -->

    <div id="campusword2007simulateur">

        <!-- ====================================================== -->
        <!-- LOADING SCREEN -->
        <!-- ====================================================== -->

        <div id="word-loading-screen">

            <div id="loading-logo"></div>

            <div id="loading-title">
                Microsoft Office Word 2007
            </div>

            <div id="loading-message">
                Loading simulator...
            </div>

            <div id="loading-progress-container">

                <div id="loading-progress-bar"></div>

            </div>

        </div>

        <!-- ====================================================== -->
        <!-- WORD APPLICATION -->
        <!-- ====================================================== -->

        <div id="word-app">

            <!-- ====================================================== -->
            <!-- TITLE BAR -->
            <!-- ====================================================== -->

            <div id="title-bar">

                <div id="title-left-section">

                    <div id="window-icon"></div>

                    <div id="document-title">
                        Document1 - Microsoft Office Word 2007
                    </div>

                </div>

                <div id="title-right-section">

                    <button id="window-minimize"></button>

                    <button id="window-maximize"></button>

                    <button id="window-close"></button>

                </div>

            </div>

            <!-- ====================================================== -->
            <!-- TOP APPLICATION AREA -->
            <!-- ====================================================== -->

            <div id="top-application-area">

                <div id="office-button-area">

                    <button id="office-button">
    Office
</button>

<div id="office-menu">

    <button class="office-menu-item">New</button>

    <button class="office-menu-item">Open</button>

    <button class="office-menu-item">Save</button>

    <button class="office-menu-item">Save As</button>

    <button class="office-menu-item">Print</button>

    <button class="office-menu-item">Prepare</button>

    <button class="office-menu-item">Send</button>

    <button class="office-menu-item">Publish</button>

    <button class="office-menu-item">Close</button>

    <hr>

    <button class="office-menu-item">Word Options</button>

    <button class="office-menu-item">Exit Word</button>

</div>

</div>

            <div id="quick-access-toolbar">

        <div id="quick-access-toolbar-buttons">

        <button id="qat-save"></button>

        <button id="qat-undo"></button>

        <button id="qat-redo"></button>

        <button id="qat-customize"></button>

    </div>

</div>
</div>
              
            <!-- ====================================================== -->
            <!-- RIBBON TABS -->
            <!-- ====================================================== -->

            <div id="ribbon-tabs">

                <button class="ribbon-tab active-tab"
                        id="tab-home">
                    Home
                </button>

                <button class="ribbon-tab"
                        id="tab-insert">
                    Insert
                </button>

                <button class="ribbon-tab"
                        id="tab-format">
                    Format
                </button>

                <button class="ribbon-tab"
                        id="tab-page-layout">
                    Page Layout
                </button>

                <button class="ribbon-tab"
                        id="tab-references">
                    References
                </button>

                <button class="ribbon-tab"
                        id="tab-mailings">
                    Mailings
                </button>

                <button class="ribbon-tab"
                        id="tab-review">
                    Review
                </button>

                <button class="ribbon-tab"
                        id="tab-view">
                    View
                </button>

            </div>

            <!-- ====================================================== -->
            <!-- RIBBON -->
            <!-- ====================================================== -->
<div id="ribbon-container">

    <div id="home-tab">

        <!-- CLIPBOARD -->
        <div class="ribbon-group">

            <div class="group-title">Clipboard</div>

            <button class="ribbon-btn" id="btn-paste">Paste</button>
            <button class="ribbon-btn" id="btn-cut">Cut</button>
            <button class="ribbon-btn" id="btn-copy">Copy</button>
            <button class="ribbon-btn" id="btn-format-painter">Format Painter</button>

        </div>

        <!-- FONT -->
        <div class="ribbon-group">

            <div class="group-title">Font</div>

            <select class="ribbon-select" id="font-family">

                <option>Calibri</option>
                <option>Times New Roman</option>
                <option>Arial</option>
                <option>Verdana</option>
                <option>Tahoma</option>
                <option>Courier New</option>

            </select>

            <select class="ribbon-select" id="font-size">

                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option selected>11</option>
                <option>12</option>
                <option>14</option>
                <option>16</option>
                <option>18</option>
                <option>20</option>
                <option>24</option>
                <option>28</option>
                <option>36</option>

            </select>

            <button class="ribbon-btn"><b>B</b></button>
            <button class="ribbon-btn"><i>I</i></button>
            <button class="ribbon-btn"><u>U</u></button>

            <button class="ribbon-btn">abc</button>
            <button class="ribbon-btn">x₂</button>
            <button class="ribbon-btn">x²</button>

            <button class="ribbon-btn">A🖍</button>
            <button class="ribbon-btn">A🎨</button>

        </div>

        <!-- PARAGRAPH -->
        <div class="ribbon-group">

            <div class="group-title">Paragraph</div>

            <button class="ribbon-btn">• List</button>
            <button class="ribbon-btn">1. List</button>
            <button class="ribbon-btn">Multi</button>

            <button class="ribbon-btn">← Indent</button>
            <button class="ribbon-btn">Indent →</button>

            <button class="ribbon-btn">Left</button>
            <button class="ribbon-btn">Center</button>
            <button class="ribbon-btn">Right</button>
            <button class="ribbon-btn">Justify</button>

            <button class="ribbon-btn">Spacing</button>
            <button class="ribbon-btn">Borders</button>

        </div>

        <!-- STYLES -->
        <div class="ribbon-group">

            <div class="group-title">Styles</div>

            <button class="ribbon-btn">Normal</button>
            <button class="ribbon-btn">No Spacing</button>
            <button class="ribbon-btn">Heading 1</button>
            <button class="ribbon-btn">Heading 2</button>
            <button class="ribbon-btn">Title</button>
            <button class="ribbon-btn">Subtitle</button>

        </div>

        <!-- EDITING -->
        <div class="ribbon-group">

            <div class="group-title">Editing</div>

            <button class="ribbon-btn">Find</button>
            <button class="ribbon-btn">Replace</button>
            <button class="ribbon-btn">Select</button>

        </div>

    </div>

</div>
            
            <!-- ====================================================== -->
            <!-- WORKSPACE -->
            <!-- ====================================================== -->

            <div id="workspace">

                <!-- VERTICAL RULER -->

                <div id="vertical-ruler">

                    <div id="vertical-ruler-scale"></div>

                    <div id="vertical-margin-top"></div>

                    <div id="vertical-margin-bottom"></div>

                </div>

        <!-- DOCUMENT VIEWPORT -->

<div id="document-viewport">

    <div id="document-workspace-background"></div>

    <!-- HORIZONTAL RULER -->

    <div id="horizontal-ruler">

        <div id="horizontal-ruler-scale"></div>

        <div id="horizontal-margin-left"></div>

        <div id="horizontal-margin-right"></div>

    </div>

    <!-- DOCUMENT SCROLL AREA -->

    <div id="document-scroll-area">

        <div id="document-canvas">

            <div id="document-pages-container">

                <!--
                    Pages generated dynamically.

                    Page 1
                    Page 2
                    Page 3
                    ...
                -->

            </div>

        </div>

    </div>

    <!-- DOCUMENT PAGE TEMPLATE -->

    <template id="document-page-template">

        <div class="document-page"
             data-page-number="1">

            <div class="page-shadow"></div>

            <div class="page-content">

                <div class="page-text-layer"></div>

                <div class="page-object-layer"></div>

                <div class="page-selection-layer"></div>

                <div class="page-caret-layer"></div>

                <div class="page-overlay-layer"></div>

            </div>

        </div>

    </template>

</div>


                <!-- SCROLLBARS -->

                <div id="workspace-scrollbars">

                    <div id="vertical-scrollbar">

                        <div id="vertical-scroll-thumb"></div>

                    </div>

                    <div id="horizontal-scrollbar">

                        <div id="horizontal-scroll-thumb"></div>

                    </div>

                </div>

            </div>

            <!-- ====================================================== -->
            <!-- STATUS BAR -->
            <!-- ====================================================== -->

           <div id="status-bar">

    <div id="status-left">

        <div id="status-page-number">
            Page 1 of 1
        </div>

        <div id="status-word-count">
            0 words
        </div>

        <div id="status-language">
            English
        </div>

        <div id="status-proofing">
            Ready
        </div>

    </div>

    <div id="status-right">

        <div id="status-view-mode">

            <button id="print-layout-view"></button>

            <button id="web-layout-view"></button>

            <button id="reading-layout-view"></button>

        </div>

        <div id="status-zoom-percentage">
            100%
        </div>

    </div>

</div>

            <!-- ====================================================== -->
            <!-- ZOOM CONTROL -->
            <!-- ====================================================== -->

            <div id="zoom-control">

                <button id="zoom-out">
                    -
                </button>

                <div id="zoom-slider-container">

                    <div id="zoom-slider-track">

                        <div id="zoom-slider-thumb"></div>

                    </div>

                </div>

                <button id="zoom-in">
                    +
                </button>

            </div>

        </div>

        <!-- ====================================================== -->
        <!-- SYSTEM LAYERS -->
        <!-- ====================================================== -->

        <div id="hidden-system-layers">

            <div id="simulation-engine-layer"></div>

            <div id="validation-layer"></div>

            <div id="format-layer"></div>

            <div id="mission-layer"></div>

            <div id="events-layer"></div>

            <div id="api-layer"></div>

            <div id="authentication-layer"></div>

            <div id="session-layer"></div>

            <div id="user-profile-layer"></div>

            <div id="permissions-layer"></div>

            <div id="autosave-layer"></div>

            <div id="analytics-layer"></div>

            <div id="notification-layer"></div>

            <div id="word-state-layer"></div>

            <div id="ribbon-state-layer"></div>

            <div id="document-state-layer"></div>

            <div id="ui-state-layer"></div>

        </div>

    </div>

    <script src="campusword2007simulateur.js"></script>

</body>
</html>
