<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription VIP - Inspecteur MEME</title>
<link rel="stylesheet" href="inscriptionvip.css">
</head>
<body>
<div class="container">
  <h2>Inscription VIP</h2>

  <form id="vip-register-form">

    <input type="text" name="nom" placeholder="Nom / Prénom" required />
    <input type="date" name="dateNaissance" required />
    <input type="text" name="ville" placeholder="Ville" required />
    <input type="text" name="pays" placeholder="Pays" required />
    <input type="text" name="whatsapp" placeholder="WhatsApp" required />
    <input type="email" name="email" placeholder="Email Gmail" required />

    <input type="password" name="password" placeholder="Mot de passe" required />
    <input type="password" name="confirmPassword" placeholder="Confirmation mot de passe" required />

    <input type="email" name="emailRecup" placeholder="E-mail de récupération" required />

    <select name="methodePaiement" required>
      <option value="">Choisissez votre abonnement</option>
      <option value="$5/mois">💳 $5 / mois</option>
      <option value="$40/ane">💰 $40 / an</option>
    </select>

    <input type="number" name="montant" placeholder="Montant versé (USD)" required />

    <!-- 🔥 Nouvo mesaj pou screenshot -->
    <p style="color:red; font-weight:bold; margin-top:10px;">
      ⚠️ Après paiement, veuillez envoyer votre screenshot / preuve directement à :
      <br>
      📧 <strong>infos@fondationbackupspirituel.com</strong>
    </p>

    <button type="submit">S'inscrire VIP</button>
  </form>

  <div id="status"></div>
</div>

<script src="inscriptionvip.js"></script>
</body>
</html>
