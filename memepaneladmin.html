<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Wallet FOBAS</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
  body { background: linear-gradient(145deg,#f7df1e,#1e90ff,#ffffff); min-height:100vh; color:#111; padding:20px;}
  h1 { text-align:center; font-size:2.5rem; margin-bottom:20px; color:#f7df1e; text-shadow:1px 1px 4px #000;}
  .container { max-width:1200px; margin:0 auto; }
  .tabs { display:flex; gap:15px; margin-bottom:20px; }
  .tab { padding:10px 20px; border-radius:8px; cursor:pointer; background:#1e90ff; color:#fff; font-weight:bold; transition:0.2s; }
  .tab.active { background:#f7df1e; color:#111; }
  #searchBox { width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; margin-bottom:20px; font-size:1rem;}
  .tx { background: rgba(255,255,255,0.1); backdrop-filter:blur(8px); border-left:6px solid #f7df1e; padding:20px; margin-bottom:15px; border-radius:12px; display:flex; flex-direction:column; transition:0.2s;}
  .tx:hover { transform:scale(1.02); box-shadow:0 4px 15px rgba(0,0,0,0.3);}
  .tx-info { display:flex; justify-content:space-between; flex-wrap:wrap; }
  .tx-info b { font-size:1.2rem; color:#1e90ff; }
  .tx-details { margin-top:10px; }
  .status { font-weight:bold; padding:4px 8px; border-radius:6px; display:inline-block; min-width:80px; text-align:center; }
  .pending { background-color:#ffdd57; color:#111; }
  .active { background-color:#1e90ff; color:#fff; }
  button.validate-btn { padding:8px 20px; cursor:pointer; border:none; border-radius:8px; font-weight:bold; font-size:1rem; margin-top:15px; background-color:#00cc66; color:#fff; transition:0.2s;}
  button.validate-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,0.2); }
  button:disabled { background-color:#999; cursor:not-allowed; }
  @media (max-width:768px){ .tx-info{flex-direction:column; gap:10px;} .tx-details{margin-top:5px;} }

.stat-card {
  flex:1;
  background: linear-gradient(135deg, #f7e600, #00bfff);
  color:#111;
  padding:15px;
  border-radius:10px;
  font-weight:bold;
  font-size:1.1rem;
  text-align:center;
  box-shadow:0 4px 8px rgba(0,0,0,0.3);
  transition: transform 0.2s;
}
.stat-card:hover {
  transform: scale(1.05);
}
</style>
</head>
<body>

<h1>🔐 Admin Wallet FOBAS</h1>
<div class="container">

<div id="stats" style="display:flex;gap:20px;margin-bottom:20px;">
  <div class="stat-card" id="totalPending">Pending: 0</div>
  <div class="stat-card" id="totalActive">Active: 0</div>
  <div class="stat-card" id="totalAmount">Total: 0 Gourdes</div>
</div>
 
  <div class="tabs">
    <div class="tab active" data-status="PENDING">PENDING</div>
    <div class="tab" data-status="ACTIVE">ACTIVE</div>
    <div class="tab" data-status="ALL">TOUS</div>
  <!-- NOUVO ONGLET -->
  <div class="tab" id="tab-surveillance-agents">
    SURVEILLANCE AGENTS
  </div>
</div>
  <input type="text" id="searchBox" placeholder="Rechercher par email ou type..." />
  <div id="transactions">Chargement des transactions...</div>
</div>




<div class="tab" onclick="window.location.href='/fobaswordadmin.html'">
  💻 FOBAS WORD
</div>




<!-- 🔐 ADMIN PASSWORD OVERLAY -->
<div id="adminLock" style="
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #0047ab, #f7e600);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
">
  <div style="
    background: white;
    padding: 30px;
    border-radius: 14px;
    width: 320px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  ">
    <h2 style="color:#0047ab">🔐 Admin Access</h2>
    <p style="color:#333">Entrez le mot de passe</p>
    <input
      type="password"
      id="adminPassword"
      placeholder="Mot de passe"
      style="
        width:100%;
        padding:12px;
        border-radius:8px;
        border:1px solid #ccc;
        margin-bottom:12px;
      "
    />
    <button
      onclick="unlockAdmin()"
      style="
        width:100%;
        padding:12px;
        background:#0047ab;
        color:white;
        border:none;
        border-radius:8px;
        font-weight:bold;
        cursor:pointer;
      "
    >
      VALIDER
    </button>
    <p id="adminError" style="color:red;display:none;margin-top:10px;">
      Mot de passe incorrect
    </p>
  </div>
</div>




 

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="memepaneladmin.js"></script>
</body>
</html>
