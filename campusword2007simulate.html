
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="app-title" data-role="title">Document1 - CampusWord2007Simulate</title>

<meta name="application-name" content="CampusWord2007Simulate">
<meta name="data-engine" content="CampusCoreEngine">
<meta name="data-version" content="1.0.0">

<link rel="stylesheet" href="campusword2007simulate.css">

</head>

<body id="cw-root"
      data-role="application"
      data-engine="bootstrap"
      data-theme="campus-default">

<!-- ================= BOOT SYSTEM ================= -->
<div id="boot-system"
     data-role="boot.system"
     data-engine="bootEngine">

    <div id="boot-loader"
         data-role="boot.loader"
         data-status="loading"></div>

</div>

<!-- ================= MAIN APPLICATION ================= -->
<div id="cw-app-shell"
     data-role="app.shell"
     data-engine="coreEngine">

    <!-- ================= TOP BAR ================= -->
    <header id="cw-topbar"
            data-role="window.topbar"
            data-engine="windowEngine">

        <div id="cw-office-menu"
             data-role="menu.officeButton"
             data-command="menu.open">
            ☰
        </div>

        <div id="cw-title-area"
             data-role="window.titleArea">

            <span id="cw-doc-title"
                  data-bind="document.title">
                Document1 - CampusWord2007Simulate
            </span>

        </div>

        <div id="cw-quick-access-toolbar"
             data-role="toolbar.quickAccess">

            <button id="qa-save"
                    data-command="file.save">Save</button>

            <button id="qa-undo"
                    data-command="edit.undo">Undo</button>

            <button id="qa-redo"
                    data-command="edit.redo">Redo</button>

        </div>

    </header>

    <!-- ================= RIBBON SYSTEM ================= -->
    <section id="cw-ribbon"
             data-role="ui.ribbon"
             data-engine="ribbonEngine">

        <nav id="cw-ribbon-tabs"
             data-role="ribbon.tabs">

            <button data-tab="home">Home</button>
            <button data-tab="insert">Insert</button>
            <button data-tab="format">Format</button>
            <button data-tab="pageLayout">Page Layout</button>
            <button data-tab="references">References</button>
            <button data-tab="mailings">Mailings</button>
            <button data-tab="review">Review</button>
            <button data-tab="view">View</button>

        </nav>

        <div id="cw-ribbon-panels"
             data-role="ribbon.panels">

            <div class="panel" data-panel="home"></div>
            <div class="panel" data-panel="insert"></div>
            <div class="panel" data-panel="format"></div>
            <div class="panel" data-panel="pageLayout"></div>
            <div class="panel" data-panel="references"></div>
            <div class="panel" data-panel="mailings"></div>
            <div class="panel" data-panel="review"></div>
            <div class="panel" data-panel="view"></div>

        </div>

    </section>

    <!-- ================= WORKSPACE ================= -->
    <main id="cw-workspace"
          data-role="workspace"
          data-engine="documentEngine">

        <!-- PAGE SYSTEM CONTAINER (MULTI PAGE ENGINE) -->
        <div id="cw-page-container"
             data-role="page.container"
             data-engine="pageEngine"
             data-multipage="true">

            <!-- JS will generate pages here -->

        </div>

    </main>

    <!-- ================= FLOATING LAYERS ================= -->
    <div id="cw-layer-system"
         data-role="layer.system">

        <div id="layer-caret"
             data-layer="caretEngine"></div>

        <div id="layer-selection"
             data-layer="selectionEngine"></div>

        <div id="layer-objects"
             data-layer="objectEngine"></div>

        <div id="layer-dialogs"
             data-layer="dialogEngine"></div>

        <div id="layer-tooltip"
             data-layer="tooltipEngine"></div>

    </div>

    <!-- ================= CONTEXT MENU ================= -->
    <div id="cw-context-menu"
         data-role="ui.contextMenu"
         hidden="true"></div>

    <!-- ================= STATUS BAR ================= -->
    <footer id="cw-statusbar"
            data-role="statusbar"
            data-engine="statusEngine">

        <div id="status-page">Page: 1</div>
        <div id="status-words">Words: 0</div>
        <div id="status-mode">Mode: Edit</div>
        <div id="status-zoom">Zoom: 100%</div>

    </footer>

</div>

<!-- ================= SCRIPT ENGINE ================= -->
<script src="campusword2007simulate.js"></script>

</body>
</html>
