<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Campus Word 2007 Simulate</title>

    <link rel="stylesheet" href="campusword2007simulate.css" />
</head>

<body>

<!-- =========================
     APPLICATION ROOT
========================= -->
<div id="app" data-name="app-root">

    <!-- =========================
         TOP BAR (RIBBON AREA)
    ========================== -->
    <header id="topBar" data-name="top-bar">

        <!-- QUICK ACCESS TOOLBAR -->
        <div id="quickAccessToolbar" data-name="quick-access-toolbar">

            <button id="btnSave" data-name="save">Save</button>
            <button id="btnUndo" data-name="undo">Undo</button>
            <button id="btnRedo" data-name="redo">Redo</button>

        </div>

        <!-- OFFICE BUTTON -->
        <div id="officeButtonContainer" data-name="office-button-container">
            <button id="officeButton" data-name="office-button">
                Office
            </button>
        </div>

        <!-- RIBBON MENU -->
        <nav id="ribbon" data-name="ribbon">

            <!-- HOME TAB -->
            <section id="tabHome" data-name="tab-home" class="ribbon-tab active">

                <div class="group" data-name="clipboard-group">
                    <button id="btnPaste" data-name="paste">Paste</button>
                    <button id="btnCut" data-name="cut">Cut</button>
                    <button id="btnCopy" data-name="copy">Copy</button>
                </div>

                <div class="group" data-name="font-group">
                    <button id="btnBold" data-name="bold">B</button>
                    <button id="btnItalic" data-name="italic">I</button>
                    <button id="btnUnderline" data-name="underline">U</button>
                </div>

                <div class="group" data-name="paragraph-group">
                    <button id="btnAlignLeft" data-name="align-left">Left</button>
                    <button id="btnAlignCenter" data-name="align-center">Center</button>
                    <button id="btnAlignRight" data-name="align-right">Right</button>
                </div>

            </section>

        </nav>

    </header>

    <!-- =========================
         MAIN WORKSPACE
    ========================== -->
    <main id="workspace" data-name="workspace">

        <!-- DOCUMENT CONTAINER (MULTI-PAGE ENGINE) -->
        <div id="documentContainer"
             data-name="document-container">

            <!-- Pages will be generated dynamically by JS -->
            
        </div>

    </main>

    <!-- =========================
         CARET LAYER (GLOBAL CARET ENGINE)
         IMPORTANT: must float above all pages
    ========================== -->
    <div id="caretLayer" data-name="caret-layer">
        <div id="globalCaret" data-name="global-caret"></div>
    </div>

    <!-- =========================
         SELECTION LAYER
    ========================== -->
    <div id="selectionLayer" data-name="selection-layer"></div>

    <!-- =========================
         CONTEXT MENU (RIGHT CLICK)
    ========================== -->
    <div id="contextMenu" data-name="context-menu" class="hidden">
        <ul>
            <li data-action="cut">Cut</li>
            <li data-action="copy">Copy</li>
            <li data-action="paste">Paste</li>
        </ul>
    </div>

    <!-- =========================
         STATUS BAR
    ========================== -->
    <footer id="statusBar" data-name="status-bar">

        <div id="statusLeft" data-name="status-left">
            Page: <span id="pageIndicator">1</span>
        </div>

        <div id="statusCenter" data-name="status-center">
            Campus Word 2007 Simulation Engine
        </div>

        <div id="statusRight" data-name="status-right">
            Zoom: <span id="zoomLevel">100%</span>
        </div>

    </footer>

</div>

<!-- =========================
     ENGINE LOADER
     (JS WILL BUILD EVERYTHING DYNAMICALLY)
========================= -->
<script src="campusword2007simulate.js"></script>

</body>
</html>
