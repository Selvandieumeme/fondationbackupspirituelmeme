<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<title>📘 Comment ça marche ? | Wallet FOBAS</title>

<style>
:root{
  --fobas-blue:#0057B7;
  --fobas-yellow:#FFD700;
  --fobas-white:#ffffff;
}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#f5f7fa;
  color:#003366;
}

.fobas-container{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

.fobas-header{
  text-align:center;
  padding:40px 20px;
  background:linear-gradient(90deg,var(--fobas-blue),var(--fobas-yellow));
  color:white;
  border-radius:16px;
}

.fobas-header h1{
  margin:0;
  font-size:32px;
}

.fobas-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  margin-top:40px;
}

.fobas-card{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
  transition:transform .2s;
}

.fobas-card:hover{
  transform:translateY(-4px);
}

.fobas-card h3{
  margin-top:0;
  color:var(--fobas-blue);
  font-size:18px;
}

.fobas-card p{
  font-size:14px;
  line-height:1.6;
}

.footer-note{
  margin-top:50px;
  padding:25px;
  background:var(--fobas-blue);
  color:white;
  border-radius:14px;
  text-align:center;
}
</style>
</head>

<body>

<div class="fobas-container">

  <div class="fobas-header">
    <h1>📘 Comment ça marche ?</h1>
    <p>Tout sa ou dwe konnen pou itilize Wallet FOBAS san risk</p>
  </div>

  <div class="fobas-grid" id="fobasContent"></div>

  <div class="footer-note">
    Wallet FOBAS — Lajan ou. Kontwòl ou. Avni dijital ou.
  </div>

</div>

<script src="commentcamarchefobas.js"></script>
</body>
</html>
