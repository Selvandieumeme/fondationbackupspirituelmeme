<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <title>Surveillance Agent | Wallet FOBAS</title>
  <link rel="stylesheet" href="surveillanceagentdashboard.css">
</head>
<body>

<h1>Dashboard Surveillance Agent – Wallet FOBAS</h1>

<table>
  <thead>
    <tr>
      <th>Email Agent</th>
      <th>Status</th>
      <th>Balance</th>
      <th>Bonus</th>
      <th>Dènye Aktivite</th>
      <th>Aksyon</th>
      <th>Freeze / Unfreeze</th>
    </tr>
  </thead>
  <tbody id="agentsTable">
    <!-- Egzanp agent 1 -->
    <tr>
      <td>agent1@example.com</td>
      <td>ACTIF</td>
      <td>5000 G</td>
      <td>100 G</td>
      <td>2026-01-19 10:30</td>
      <td>
        <button class="btn-block" onclick="bloquerAgent('agent1@example.com')">Bloque</button>
      </td>
      <td>
        <button class="btn-freeze" onclick="freezeBalance('agent1@example.com')">Freeze</button>
      </td>
    </tr>

    <!-- Egzanp agent 2 -->
    <tr>
      <td>agent2@example.com</td>
      <td>INACTIF</td>
      <td>3000 G</td>
      <td>50 G</td>
      <td>2026-01-18 16:20</td>
      <td>
        <button class="btn-active" onclick="activerAgent('agent2@example.com')">Aktive</button>
      </td>
      <td>
        <button class="btn-unfreeze" onclick="unfreezeBalance('agent2@example.com')">Unfreeze</button>
      </td>
    </tr>
  </tbody>
</table>

<script>
  // Egzanp fonksyon admin deja egziste (rele backend ou deja genyen)
  function bloquerAgent(agentEmail) {
    alert("Bloque agent: " + agentEmail);
    // API admin ou a ka rele la
  }

  function activerAgent(agentEmail) {
    alert("Aktive agent: " + agentEmail);
  }

  function freezeBalance(agentEmail) {
    alert("Freeze balance: " + agentEmail);
  }

  function unfreezeBalance(agentEmail) {
    alert("Unfreeze balance: " + agentEmail);
  }
</script>

</body>
</html>
