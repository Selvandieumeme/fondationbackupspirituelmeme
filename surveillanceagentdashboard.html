<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>FOBAS – Surveillance Agents</title>
  <link rel="stylesheet" href="surveillanceagentdashboard.css">
</head>
<body>

<h2>Surveillance Agents Autorisés</h2>

<label>Choisissez Agent :</label>
<select id="agentSelect"></select>

<div class="info">
  <p>Email : <span id="email">—</span></p>
  <p>Statut : <span id="status">—</span></p>
  <p>Balance : <span id="balance">0</span></p>
  <p>Bonus : <span id="bonus">0</span></p>
  <p>Dernière action : <span id="lastAction">—</span></p>
</div>

<div class="actions">
  <button onclick="sendAction('BLOCK_ACCOUNT')">Bloquer Compte</button>
  <button onclick="sendAction('UNBLOCK_ACCOUNT')">Débloquer Compte</button>
  <button onclick="sendAction('FREEZE_BALANCE')">Freeze Balance</button>
  <button onclick="sendAction('UNFREEZE_BALANCE')">Unfreeze Balance</button>
  <button onclick="sendAction('BLOCK_BONUS')">Bloquer Bonus</button>
  <button onclick="sendAction('UNBLOCK_BONUS')">Débloquer Bonus</button>
  <!-- ✅ NOUVO BOUTON TRANSFERER -->
  <button onclick="transferer()">Transferer</button>
  <button onclick="retirer()">Retrait</button>
  <button onclick="adminNote()">Note Admin</button>
  </div>

<!-- 🔹 Nouvo Bouton Chat Admin pou tout itilizatè -->
<div class="admin-chat" style="margin-top:15px;">
  <button id="btnAdminChat">📝 Chat Admin</button>
  <div id="adminMessagesBox" style="display:none; border:1px solid #ccc; padding:10px; margin-top:10px; max-height:300px; overflow-y:auto;">
    <!-- Lis mesaj itilizatè ak admin ap parèt la -->
    <div style="margin-top:5px;">
      <input type="text" id="adminMessageText" placeholder="Écrire un message..." style="width:70%;" />
      <button id="sendAdminMessage">Envoyer</button>
    </div>
  </div>
</div>

  
<script src="surveillanceagentdashboard.js"></script>
</body>
</html>
