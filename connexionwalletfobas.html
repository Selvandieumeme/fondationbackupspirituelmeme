<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion FOBAS</title>
  <link rel="stylesheet" href="connexionwalletfobas.css">
</head>
<body>
  <div class="login-container">
  <h2>Connexion FOBAS</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Mot de passe">

  <div class="btn-row">
    <button id="loginBtn">Se connecter</button>
  </div>

  <div class="secondary-actions">
  <div class="top-buttons">
    <!-- 2 premye bouton yo sou menm ranje -->
    <a href="creation-cartevirtuelle-assistance.html"
       class="btn-inscription">
      Inscrivez-vous maintenant
    </a>

    <a href="privacypolicyfobas.html"
       class="btn-inscription">
      Politique de Confidentialité
    </a>
  </div>

  <!-- 3èm bouton tonbe anba 2 premye -->
  <a href="conditiondutilisationfobas.html"
     class="btn-conditions">
    Nos Conditions d'Utilisation
  </a>
</div>

  <p id="errorMsg"></p>
</div>




  <style>
  .secondary-actions {
    margin-top: 8px;
    display: flex;
    flex-direction: column; /* Pou pèmèt 3èm bouton tonbe anba */
    align-items: flex-start; /* a goch */
  }

  .secondary-actions .top-buttons {
    display: flex;           /* 2 premye bouton yo sou menm ranje */
    gap: 10px;               /* ti espas ant yo */
    margin-bottom: 8px;      /* ti espas anba 2 premye bouton yo pou 3èm bouton */
  }

  .btn-inscription {
    background-color: #1fa64b; /* vert */
    color: #ffffff;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 4px;
    text-decoration: none;
    cursor: pointer;
    opacity: 0.85;
    display: inline-block;
  }

  .btn-inscription:hover {
    opacity: 1;
  }

  /* Nouvo stil pou 3èm bouton (Nos Conditions d'Utilisation) */
  .btn-conditions {
    background-color: #1fa64b; /* menm koulè vert */
    color: #ffffff;
    padding: 4px 10px;    /* menm padding */
    font-size: 12px;      /* menm font */
    border-radius: 4px;   /* menm radius */
    text-decoration: none;
    cursor: pointer;
    opacity: 0.85;
    display: inline-block;
  }

  .btn-conditions:hover {
    opacity: 1;
  }
</style>


  <script src="connexionwalletfobas.js"></script>
</body>
</html>
