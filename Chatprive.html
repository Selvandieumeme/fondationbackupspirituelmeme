<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat Privé - Fondation Backup Spirituel</title>

<link rel="stylesheet" href="ChatPrivate.css">
<script src="/socket.io/socket.io.js"></script>
<script src="ChatPrive.js" defer></script>

<style>
  /* ====== Couleurs Fondation ====== */
  :root {
    --fond-jaune: #FFD700;
    --fond-bleu: #0052D4;
    --fond-blanc: #ffffff;
    --text-principal: #111827;
    --text-secondaire: #444;
    --msg-incoming-bg: #fefefe;
    --msg-outgoing-bg: linear-gradient(90deg,#4f46e5,#06b6d4);
    --panel-bg: #f7f8fb;
    --btn-bg: var(--fond-bleu);
    --btn-hover: #4364f7;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--fond-blanc);
  }

  .chat-container {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Panel Utilisateur - bo dwat */
  .user-list-panel {
    position: fixed;
    right: 0;
    top: 0;
    width: 220px;
    height: 100vh;
    background: var(--fond-jaune);
    padding: 10px;
    box-shadow: -2px 0 10px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .user-list-panel h3 {
    margin: 0 0 10px 0;
    color: var(--fond-blanc);
    font-size: 18px;
  }

  .user-list-panel button.user-btn {
    width: 100%;
    padding: 8px 10px;
    background: var(--fond-blanc);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
    font-weight: 500;
    color: var(--text-principal);
    transition: background 0.2s;
  }

  .user-list-panel button.user-btn:hover {
    background: var(--btn-hover);
    color: var(--fond-blanc);
  }

  .user-list-panel button.has-new-message::after {
    content: '●';
    color: red;
    float: right;
  }

  /* Fenèt Chat Privé */
  .private-chat-window {
    margin: auto;
    width: 450px;
    max-width: 95%;
    height: 600px;
    display: flex;
    flex-direction: column;
    background: var(--fond-blanc);
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    overflow: hidden;
    position: relative;
  }

  .pc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    background: var(--fond-bleu);
    color: var(--fond-blanc);
    font-weight: 600;
    font-size: 18px;
  }

  .pc-header .controls button {
    background: transparent;
    border: none;
    color: var(--fond-blanc);
    font-size: 18px;
    cursor: pointer;
  }

  .pc-messages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    background: var(--panel-bg);
  }

  .pc-messages div.me {
    background: var(--msg-outgoing-bg);
    color: white;
    align-self: flex-end;
    padding: 8px 12px;
    margin: 6px 0;
    border-radius: 12px;
    max-width: 80%;
    word-wrap: break-word;
  }

  .pc-messages div.other {
    background: var(--msg-incoming-bg);
    color: var(--text-principal);
    align-self: flex-start;
    padding: 8px 12px;
    margin: 6px 0;
    border-radius: 12px;
    max-width: 80%;
    word-wrap: break-word;
  }

  .typing-indicator {
    font-size: 13px;
    color: #6b7280;
    padding: 6px 12px;
  }

  .pc-input {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid rgba(0,0,0,0.1);
    background: var(--fond-blanc);
  }

  .pc-input textarea {
    flex: 1 1 auto;
    border-radius: 8px;
    padding: 8px 10px;
    border: 1px solid rgba(0,0,0,0.15);
    resize: none;
    height: 40px;
    font-size: 14px;
  }

  .pc-input button {
    padding: 8px 10px;
    border: none;
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--fond-blanc);
    cursor: pointer;
    transition: background 0.2s;
  }

  .pc-input button:hover {
    background: var(--btn-hover);
  }

</style>
<body>
  <div class="chat-container">
    <!-- Panel Utilisateur -->
    <div id="userList" class="user-list-panel">
      <h3>Utilisateurs Connectés</h3>
    </div>

    <!-- Chat Prive -->
    <div class="private-chat-window">
      <div class="pc-header">
        <span id="chatTitle">Chat Privé</span>
        <div class="controls">
          <button id="closeChat" title="Fermer">X</button>
        </div>
      </div>

      <div id="privateMessages" class="pc-messages"></div>
      <div id="typingIndicator" class="typing-indicator"></div>

      <div class="pc-input">
        <textarea id="privateMsg" placeholder="Écrire un message..."></textarea>
        <button id="sendPrivate" title="Envoyer">Voye</button>
        <button id="clearLocal" title="Effacer local">Efase</button>
        <button id="attachBtn" title="Joindre image">📎</button>
        <button id="voiceBtn" title="Enregistrer voix">🎤</button>
        <button id="blockBtn" title="Bloquer utilisateur">🚫</button>
        <button id="seenBtn" title="Marquer vu">✔️</button>
        <button id="callBtn" title="Appel vocal">📞</button>
        <button id="videoCallBtn" title="Appel vidéo">🎥</button>
      </div>
    </div>
  </div>

  <div id="callContainer"></div>


     
     
     
<script>
/*
  Chatprive.html - Script final korije
  Fully compatible with PrivateChatManager.js features
  Supports Attach Image, Voice, Block User, Seen, Voice/Video Call
*/

(function(){
  // Current user from window var or URL param
  const CURRENT_USER = window.CURRENT_USER || new URLSearchParams(window.location.search).get('from') || null;
  if(!CURRENT_USER) console.warn('CURRENT_USER not set. URL fallback only.');

  // Socket reuse
  const socket = window.__fbsp_shared_socket || io('https://examen-backend-ihlx.onrender.com');
  window.__fbsp_shared_socket = socket;

  // DOM Elements
  const messagesDiv = document.getElementById('privateMessages');
  const msgInput = document.getElementById('privateMsg');
  const sendBtn = document.getElementById('sendPrivate');
  const clearBtn = document.getElementById('clearLocal');
  const closeBtn = document.getElementById('closeChat');
  const userListDiv = document.getElementById('userList');
  const attachBtn = document.getElementById('attachBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const blockBtn = document.getElementById('blockBtn');
  const seenBtn = document.getElementById('seenBtn');
  const callBtn = document.getElementById('callBtn');
  const videoCallBtn = document.getElementById('videoCallBtn');

  // State
  let targetUser = new URLSearchParams(window.location.search).get('to') || null;
  let currentRoom = null;
  let conversationId = null;
  let typingTimeout = null;
  let localStream = null;
  let peerConnection = null;
  const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  // Helpers
  const safeText = t => (t==null ? '' : String(t));
  const formatTime = ts => { try { return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); } catch(e){ return ''; } };

  // Append message to DOM
  function appendMessageToDOM(msgDoc, isMe){
    const from = msgDoc.from || msgDoc.sender || 'unknown';
    const text = msgDoc.text || msgDoc.message || '';
    const createdAt = msgDoc.createdAt || msgDoc.date || Date.now();

    const div = document.createElement('div');
    div.classList.add(isMe ? 'me' : 'other');
    div.innerHTML = `<strong>${isMe ? 'Moi' : from}</strong> <span style="font-size:11px;color:#444;margin-left:6px">[${formatTime(createdAt)}]</span>
      <div>${safeText(text)}</div>
      ${msgDoc.attachments && msgDoc.attachments.length ? msgDoc.attachments.map(a=>`<div class="attachment"><img src="${a.url}" /></div>`).join('') : ''}
    `;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function clearMessagesDOM(){ messagesDiv.innerHTML=''; }

  function openPrivateChatWith(userId){
    if(!userId) return;
    targetUser = userId;
    socket.emit('request_private_chat',{ targetUser });
  }

  function sendMessage(){
    const text = msgInput.value.trim();
    if(!text || !CURRENT_USER || !targetUser) return alert('Utilisateur courant ou destinataire manquant.');
    const payload = { to: targetUser, text, conversationId, room: currentRoom };
    socket.emit('private_message', payload);
    appendMessageToDOM({ from: CURRENT_USER, text, createdAt: Date.now() }, true);
    msgInput.value=''; msgInput.focus();
  }

  function markConversationRead(){
    if(conversationId){
      socket.emit('mark_conversation_read', { conversationId });
      const btn = userListDiv.querySelector(`button[data-user="${targetUser}"]`);
      if(btn) btn.classList.remove('has-new-message');
    }
  }

  // Event listeners
  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keypress', e=>{ if(e.key==='Enter'){ e.preventDefault(); sendMessage(); } });
  clearBtn.addEventListener('click', clearMessagesDOM);
  closeBtn.addEventListener('click', ()=> window.location.href='Chat-Spirituel.html');

  // Attach image
  attachBtn?.addEventListener('click', ()=>{
    const fileInput=document.createElement('input'); fileInput.type='file'; fileInput.accept='image/*';
    fileInput.onchange=e=>{
      const file=e.target.files[0];
      if(file){
        const reader=new FileReader();
        reader.onload=evt=>{
          const imgData=evt.target.result;
          const msg={ text:'', attachments:[{url:imgData}], from:CURRENT_USER, createdAt:new Date() };
          socket.emit('private_message',{ to: targetUser, text:'', attachments:[{url:imgData}], conversationId, room:currentRoom });
          appendMessageToDOM(msg,true);
        }; reader.readAsDataURL(file);
      }
    }; fileInput.click();
  });

  // Voice button (placeholder)
  voiceBtn?.addEventListener('click', async ()=>{
    if(!navigator.mediaDevices) return alert('Voice recording not supported');
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    alert('Voice recording ready (implémentation needed)');
  });

  // Block user
  blockBtn?.addEventListener('click', ()=>{
    if(!targetUser) return;
    socket.emit('block_user',{ targetUser });
    alert(`User ${targetUser} blocked`);
  });

  // Seen
  seenBtn?.addEventListener('click', markConversationRead);

  // WebRTC call
  async function startCall(video=false){
    if(!targetUser) return;
    localStream = await navigator.mediaDevices.getUserMedia({audio:true, video});
    const callWindow = document.createElement('div'); callWindow.className='call-window';
    const localVideo=document.createElement('video'); localVideo.autoplay=true; localVideo.muted=true; localVideo.srcObject=localStream;
    const remoteVideo=document.createElement('video'); remoteVideo.autoplay=true;
    callWindow.appendChild(localVideo); callWindow.appendChild(remoteVideo); document.body.appendChild(callWindow);

    peerConnection = new RTCPeerConnection(config);
    localStream.getTracks().forEach(track=>peerConnection.addTrack(track, localStream));
    peerConnection.ontrack = e => remoteVideo.srcObject = e.streams[0];
    peerConnection.onicecandidate = e => { if(e.candidate) socket.emit('webrtc_candidate',{ candidate:e.candidate, to: targetUser }); };

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    socket.emit('webrtc_offer',{ offer, to: targetUser });
  }

  callBtn?.addEventListener('click', ()=> startCall(false));
  videoCallBtn?.addEventListener('click', ()=> startCall(true));

  socket.on('webrtc_offer', async ({ offer, from })=>{
    if(from!==targetUser) return;
    peerConnection=new RTCPeerConnection(config);
    localStream=await navigator.mediaDevices.getUserMedia({audio:true, video:true});
    localStream.getTracks().forEach(track=>peerConnection.addTrack(track, localStream));

    const callWindow=document.createElement('div'); callWindow.className='call-window';
    const localVideo=document.createElement('video'); localVideo.autoplay=true; localVideo.muted=true; localVideo.srcObject=localStream;
    const remoteVideo=document.createElement('video'); remoteVideo.autoplay=true;
    callWindow.appendChild(localVideo); callWindow.appendChild(remoteVideo);
    document.body.appendChild(callWindow);

    peerConnection.ontrack=e=>remoteVideo.srcObject=e.streams[0];
    peerConnection.onicecandidate=e=>{ if(e.candidate) socket.emit('webrtc_candidate',{ candidate:e.candidate, to: from }); };

    await peerConnection.setRemoteDescription(offer);
    const answer=await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit('webrtc_answer',{ answer, to: from });
  });

  socket.on('webrtc_answer', async ({ answer })=>{ await peerConnection.setRemoteDescription(answer); });
  socket.on('webrtc_candidate', async ({ candidate })=>{ try{ await peerConnection.addIceCandidate(candidate); }catch(e){console.error(e);} });

  // Handle private history
  socket.on('private_history', ({ conversationId: convId, room, messages })=>{
    conversationId=convId||conversationId;
    currentRoom=room||currentRoom;
    clearMessagesDOM();
    if(Array.isArray(messages)){
      messages.forEach(m=>appendMessageToDOM(m, String(m.from)===String(CURRENT_USER)));
    }
    markConversationRead();
  });

  // Handle received private messages
  socket.on('receive_private_message', msgDoc=>{

</body>
</html>
