<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Privé - Fondation Backup Spirituel</title>

<!-- Styles Chat Prive (pa chanje) -->
<style>
  /* Fond ak koulè fondation */
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #ffffff; /* blan */
    color: #333;
  }

  header {
    background-color: #FFD700; /* jaune */
    color: #fff;
    padding: 15px;
    text-align: center;
    font-size: 1.5rem;
    font-weight: bold;
    position: relative;
  }

  header button#closeChat {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    background-color: #0d6efd; /* ble */
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  header button#closeChat:hover {
    background-color: #0056b3;
  }

  main {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 70px);
    padding: 10px;
  }

  /* Espas mesaj */
  #privateMessages {
    flex: 1;
    overflow-y: auto;
    border: 1px solid #0d6efd;
    border-radius: 8px;
    padding: 10px;
    background-color: #f0f8ff; /* ble clair */
    margin-bottom: 10px;
  }

  #privateMessages div {
    padding: 5px 8px;
    margin-bottom: 5px;
    border-radius: 6px;
    max-width: 80%;
    word-wrap: break-word;
    display: inline-block;
  }

  .me {
    background-color: #FFD700; /* jaune */
    align-self: flex-end;
    float: right;
    color: #000;
  }

  .other {
    background-color: #0d6efd; /* ble */
    color: #fff;
    align-self: flex-start;
    float: left;
  }

  /* Input container */
  #inputContainer {
    display: flex;
    gap: 5px;
  }

  #privateMsg {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }

  #sendPrivate, #clearLocal {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s ease;
  }

  #sendPrivate {
    background-color: #0d6efd; /* ble */
    color: #fff;
  }

  #sendPrivate:hover {
    background-color: #0056b3;
  }

  #clearLocal {
    background-color: #FFD700; /* jaune */
  }

  #clearLocal:hover {
    background-color: #e6c200;
  }

  /* Clear floats after messages */
  #privateMessages::after {
    content: "";
    display: block;
    clear: both;
  }

</style>
</head>
<body>

<header>
  Chat Privé
  <button id="closeChat">Close</button>
</header>

<main>
  <div id="privateMessages" aria-live="polite" aria-atomic="false"></div>
  <div id="inputContainer">
    <input type="text" id="privateMsg" placeholder="Écrire votre message..." autocomplete="off">
    <button id="sendPrivate">Envoyer</button>
    <button id="clearLocal">Effacer</button>
  </div>
</main>

<!-- Socket.io -->
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

<script>
  // --- Paramèt soti nan URL (from, to)
  const params = new URLSearchParams(window.location.search);
  const currentUser = params.get('from') || params.get('user') || 'Anonyme';
  const targetUser = params.get('to') || params.get('toUser') || '';

  // --- Reutilize menm socket global si li egziste, sinon kreye nouvo koneksyon
  const socket = window.__fbsp_shared_socket || io('https://examen-backend-ihlx.onrender.com');
  window.__fbsp_shared_socket = socket;

  // --- DOM
  const messagesDiv = document.getElementById('privateMessages');
  const msgInput = document.getElementById('privateMsg');
  const sendBtn = document.getElementById('sendPrivate');
  const clearBtn = document.getElementById('clearLocal');
  const closeBtn = document.getElementById('closeChat');

  // --- Fè atansyon: nou SÒTI lokalStorage, nou SOVE nan MongoDB atravè server la.
  // --- Fonksyon pou ajoute mesaj nan DOM
  function appendMessageToDOM(data, isMe) {
    const div = document.createElement('div');
    // fòma dat la klè
    const time = new Date(data.date || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    div.textContent = `[${time}] ${data.sender || data.from || 'Anonyme'}: ${data.message}`;
    div.classList.add(isMe ? 'me' : 'other');
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // --- Chaje tout mesaj prive ki deja egziste ant currentUser ak targetUser depi server (MongoDB)
  function loadPrivateMessages() {
    if (!currentUser || !targetUser) return;
    socket.emit('loadPrivateMessages', { user1: currentUser, user2: targetUser });
  }

  // --- Resevwa repons k ap retounen avek lis mesaj yo
  socket.on('loadPrivateMessages', (messages) => {
    // Asire nou nan konvèsasyon kòrèk
    messagesDiv.innerHTML = '';
    if (!Array.isArray(messages)) return;
    messages.forEach(m => {
      // server voye { sender, receiver, message, date }
      appendMessageToDOM({ sender: m.sender, message: m.message, date: m.date }, m.sender === currentUser);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });

  // --- Voye mesaj prive al server (server ap sove nan MongoDB epi re-emèt bay tout sockets releve)
  function sendMessage() {
    const message = msgInput.value.trim();
    if (!message) return;
    if (!currentUser || !targetUser) {
      alert('Utilisateur ou destinataire manquant.');
      return;
    }

    const payload = {
      from: currentUser,
      to: targetUser,
      message: message
    };

    // 1) Emèt pou server (server ap sove nan MongoDB epi emèt tounen bay reseptè ak sender)
    socket.emit('privateMessage', payload);

    // 2) Mete message imedyatman nan DOM pou ogmante reaktivite (server ap re-emit menm mesaj la)
    appendMessageToDOM({ sender: currentUser, message, date: new Date() }, true);

    msgInput.value = '';
    msgInput.focus();
  }

  // --- Resevwa mesaj prive an tan reyèl (server ap emèt li apre li sove)
  socket.on('privateMessage', (data) => {
    // Atansyon: server ap voye { from, to, message, date } oswa { sender, receiver, ... } depann sou implémentation
    const sender = data.sender || data.from;
    const receiver = data.receiver || data.to;
    // Si mesaj la se pou konvèsasyon an (ant currentUser ak targetUser), montre li
    if (!sender || !receiver) return;
    const isRelevant =
      (sender === currentUser && receiver === targetUser) ||
      (sender === targetUser && receiver === currentUser) ||
      (data.from === currentUser && data.to === targetUser) ||
      (data.from === targetUser && data.to === currentUser);

    if (!isRelevant) return;

    // Evite double-append si nou deja ajoute imedyatman lè te voye (men sèten servers re-émèt tou)
    // Sa se yon chemen senp: si mesaj deja egziste san deduplikasyon id, nou aksepte yon kopi; sa pa degrade DB.
    appendMessageToDOM({
      sender: sender,
      message: data.message,
      date: data.date || new Date()
    }, sender === currentUser);
  });

  // --- Klike bouton voye
  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

  // --- Efase sèlman DOM (pa efase nan DB). Sa itil jan w te mande.
  clearBtn.addEventListener('click', () => {
    messagesDiv.innerHTML = '';
  });

  // --- Close: retounen sou Chat-Spirituel (asire ranplase URL egzak ou itilize)
  closeBtn.addEventListener('click', () => {
    window.location.href = 'https://www.fondationbackupspirituel.com/Chat-Spirituel.html';
  });

  // --- Lè socket konekte, mande mesaj (si nou deja gen paramèt yo)
  socket.on('connect', () => {
    loadPrivateMessages();
  });

  // --- Load inisyal lè paj chaje
  loadPrivateMessages();

  // Accessibility: mete focus sou input
  msgInput.focus();

</script>

</body>
</html>
