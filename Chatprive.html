<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Privé - Fondation Backup Spirituel</title>

<!-- Styles Chat Prive (pa chanje) -->
<style>
  /* Fond ak koulè fondation */
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #ffffff; /* blan */
    color: #333;
  }

  header {
    background-color: #FFD700; /* jaune */
    color: #fff;
    padding: 15px;
    text-align: center;
    font-size: 1.5rem;
    font-weight: bold;
    position: relative;
  }

  header button#closeChat {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    background-color: #0d6efd; /* ble */
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  header button#closeChat:hover {
    background-color: #0056b3;
  }

  main {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 70px);
    padding: 10px;
  }

  /* Espas mesaj */
  #privateMessages {
    flex: 1;
    overflow-y: auto;
    border: 1px solid #0d6efd;
    border-radius: 8px;
    padding: 10px;
    background-color: #f0f8ff; /* ble clair */
    margin-bottom: 10px;
  }

  #privateMessages div {
    padding: 5px 8px;
    margin-bottom: 5px;
    border-radius: 6px;
    max-width: 80%;
    word-wrap: break-word;
    display: inline-block;
  }

  .me {
    background-color: #FFD700; /* jaune */
    align-self: flex-end;
    float: right;
    color: #000;
  }

  .other {
    background-color: #0d6efd; /* ble */
    color: #fff;
    align-self: flex-start;
    float: left;
  }

  /* Input container */
  #inputContainer {
    display: flex;
    gap: 5px;
  }

  #privateMsg {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }

  #sendPrivate, #clearLocal {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s ease;
  }

  #sendPrivate {
    background-color: #0d6efd; /* ble */
    color: #fff;
  }

  #sendPrivate:hover {
    background-color: #0056b3;
  }

  #clearLocal {
    background-color: #FFD700; /* jaune */
  }

  #clearLocal:hover {
    background-color: #e6c200;
  }

  /* Clear floats after messages */
  #privateMessages::after {
    content: "";
    display: block;
    clear: both;
  }

</style>
</head>
<body>

<header>
  Chat Privé
  <button id="closeChat">Close</button>
</header>

<main>
  <div id="privateMessages" aria-live="polite" aria-atomic="false"></div>
  <div id="inputContainer">
    <input type="text" id="privateMsg" placeholder="Écrire votre message..." autocomplete="off">
    <button id="sendPrivate">Envoyer</button>
    <button id="clearLocal">Effacer</button>
  </div>
</main>

<!-- Socket.io -->
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

<script>
  // --- Paramèt soti nan URL (from, to)
  const params = new URLSearchParams(window.location.search);
  const currentUser = params.get('from') || params.get('user') || 'Anonyme';
  let targetUser = params.get('to') || params.get('toUser') || '';

  // --- Reutilize menm socket global si li egziste, sinon kreye nouvo koneksyon
  const socket = window.__fbsp_shared_socket || io('https://examen-backend-ihlx.onrender.com');
  window.__fbsp_shared_socket = socket;

  // --- DOM
  const messagesDiv = document.getElementById('privateMessages');
  const msgInput = document.getElementById('privateMsg');
  const sendBtn = document.getElementById('sendPrivate');
  const clearBtn = document.getElementById('clearLocal');
  const closeBtn = document.getElementById('closeChat');

  // --- Fonksyon pou ajoute mesaj nan DOM
  function appendMessageToDOM(data, isMe) {
    const div = document.createElement('div');
    const time = new Date(data.date || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    // Affiche "from" (non ki soti nan DB: from) pou evite konfizyon ak 'user' fields
    const senderName = data.from || data.sender || 'Anonyme';
    div.textContent = `[${time}] ${senderName}: ${data.message}`;
    div.classList.add(isMe ? 'me' : 'other');
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // --- Chaje tout mesaj prive ki deja egziste ant currentUser ak targetUser (mande server)
  function loadPrivateMessages() {
    if (!currentUser || !targetUser) return;
    // Nou voye from/to ke server.js ap itilize pou fè query sou MongoDB
    socket.emit('loadPrivateMessages', { from: currentUser, to: targetUser });
  }

  // --- Resevwa lis mesaj prive depi server epi montre yo (server ta dwe retounen sèlman konvèsasyon sa)
  socket.on('loadPrivateMessages', (messages) => {
    messagesDiv.innerHTML = '';
    if (!Array.isArray(messages)) return;

    // Filtre anplis nan client pou asire sèlman konvèsasyon aktyèl parèt (siplemantè sekirite)
    messages
      .filter(m =>
        (m.from === currentUser && m.to === targetUser) ||
        (m.from === targetUser && m.to === currentUser)
      )
      .forEach(m => {
        appendMessageToDOM(m, m.from === currentUser);
      });

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });

  // --- Voye mesaj prive al server (server ap sove nan MongoDB epi emèt bay reseptè ak sender)
  function sendMessage() {
    const message = msgInput.value.trim();
    if (!message) return;
    if (!currentUser || !targetUser) {
      alert('Utilisateur ou destinataire manquant.');
      return;
    }

    const payload = { from: currentUser, to: targetUser, message };

    // 1) Emèt pou server (server ap sove epi ap re-émèt 'privateMessage' bay toude pati)
    socket.emit('privateMessage', payload);

    // 2) Mete mesaj imedyatman nan DOM pou repons rapid (server pral re-emit menm mesaj la)
    appendMessageToDOM({ from: currentUser, message, date: new Date() }, true);

    msgInput.value = '';
    msgInput.focus();
  }

  // --- Resevwa mesaj prive an tan reyèl epi filtre sèlman konvèsasyon aktyèl la
  socket.on('privateMessage', (data) => {
    // Server ka voye { from, to, message, date } oswa { sender, receiver, ... }
    const sender = data.from || data.sender;
    const receiver = data.to || data.receiver;
    if (!sender || !receiver) return;

    // Montre sèlman si mesaj la konsène konvèsasyon nou an
    const isRelevant =
      (sender === currentUser && receiver === targetUser) ||
      (sender === targetUser && receiver === currentUser);

    if (!isRelevant) return;

    // Ajoute nan DOM
    appendMessageToDOM({
      from: sender,
      message: data.message,
      date: data.date || new Date()
    }, sender === currentUser);
  });

  // --- Bouton voye mesaj
  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

  // --- Efase sèlman DOM (pa efase nan DB) — konsistan ak demann ou
  clearBtn.addEventListener('click', () => { messagesDiv.innerHTML = ''; });

  // --- Close: retounen sou Chat-Spirituel (ou te di vèsyon "Chat-Spirituel.html" egzak)
  closeBtn.addEventListener('click', () => {
    window.location.href = 'https://www.fondationbackupspirituel.com/Chat-Spirituel.html';
  });

  // --- Lè socket konekte, asire server konnen non itilizatè a epi chaje mesaj prive
  socket.on('connect', () => {
    if (currentUser && currentUser !== 'Anonyme') {
      socket.emit('setUser', currentUser);
    }
    // Mande tou lis mesaj prive aktyèl la si targetUser defini
    loadPrivateMessages();
    // Mande lis itilizatè online pou panel lateral (si ou vle mete li)
    socket.emit('requestUserList');
  });

  // --- Load inisyal lè paj chaje (si deja connected)
  if (socket.connected) {
    if (currentUser && currentUser !== 'Anonyme') {
      socket.emit('setUser', currentUser);
    }
    loadPrivateMessages();
    socket.emit('requestUserList');
  }

  // Accessibility: mete focus sou input
  try { msgInput.focus(); } catch (e) { /* ignore si pa jwenn */ }

  // -----------------------------
  // --- Lis itilizatè aktif pou chwazi targetUser (panel sou bò dwat)
  //    Si ou deja genyen yon panel nan Chat-Spirituel.html, pa double-mete li.
  //    Sa a se fallback: li kreye yon ti panel si li pa egziste.
  (function ensureUserListPanel() {
    // Si paj deja gen yon elem ak id 'userList' nou pa fè anyen
    if (document.getElementById('userList')) return;

    const userListDiv = document.createElement('div');
    userListDiv.id = 'userList';
    userListDiv.style.position = 'fixed';
    userListDiv.style.right = '10px';
    userListDiv.style.top = '70px';
    userListDiv.style.width = '180px';
    userListDiv.style.height = '80vh';
    userListDiv.style.overflowY = 'auto';
    userListDiv.style.border = '1px solid #0d6efd';
    userListDiv.style.borderRadius = '8px';
    userListDiv.style.backgroundColor = '#f0f8ff';
    userListDiv.style.padding = '5px';
    userListDiv.style.zIndex = '9999';
    document.body.appendChild(userListDiv);

    function renderUserList(users) {
      userListDiv.innerHTML = '';
      users.forEach(u => {
        if (u && u !== currentUser) {
          const btn = document.createElement('button');
          btn.textContent = u;
          btn.style.display = 'block';
          btn.style.width = '100%';
          btn.style.marginBottom = '3px';
          btn.style.cursor = 'pointer';
          btn.addEventListener('click', () => {
            // chanje targetUser epi chaje konvèsasyon
            targetUser = u;
            // update URL san reload pou vizibilite (optional)
            try {
              const newUrl = new URL(window.location.href);
              newUrl.searchParams.set('to', u);
              history.replaceState(null, '', newUrl.toString());
            } catch (e) { /* ignore si URL API pa sipòte */ }
            loadPrivateMessages();
          });
          userListDiv.appendChild(btn);
        }
      });
    }

    // resevwa lis itilizatè (server ap emèt 'online-users' menm jan ak Chat-Spirituel)
    socket.on('online-users', (usersArr) => {
      // normalizasyon si server voye obj {id,name,connected}
      const names = Array.isArray(usersArr) ? usersArr.map(item => {
        if (typeof item === 'string') return item;
        if (item && typeof item === 'object') return item.name || item.user || item.id;
        return String(item);
      }).filter(Boolean) : [];
      renderUserList(names);
    });
  })();
</script>

</body>
</html>
