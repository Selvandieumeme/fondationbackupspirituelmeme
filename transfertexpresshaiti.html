<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Transfert Express Haiti – FOBAS</title>
  <link rel="stylesheet" href="walletfobasdashboard.css">
</head>
<body>

<!-- Container Fòm Transfert Express -->
<div id="transfertExpressContainer">
  <h2>Transfert Express Haiti</h2>
  <p>Agent Autorisé FOBAS</p>

  <form id="formTransfert">

    <!-- 🔹 Agent (auto-filled) -->
    <label for="agentName">Nom & Prénom Agent</label>
    <input type="text" id="agentName" name="agentName" readonly>

    <label for="agentEmail">Email Agent Autorisé</label>
    <input type="email" id="agentEmail" name="agentEmail" readonly>

    <!-- 🔹 Expéditeur -->
    <h3>Expéditeur</h3>
    <label for="senderName">Nom et Prénom</label>
    <input type="text" id="senderName" name="senderName" required>

    <label for="senderCIN">No. CIN / NIF / Passport</label>
    <input type="text" id="senderCIN" name="senderCIN" required>

    <label for="senderCountry">Pays d'origine</label>
    <input type="text" id="senderCountry" name="senderCountry" required>

    <label for="senderAddress">Adresse complète</label>
    <input type="text" id="senderAddress" name="senderAddress" required>

    <label for="senderWhatsapp">WhatsApp / Téléphone</label>
    <input type="text" id="senderWhatsapp" name="senderWhatsapp" required>

    <!-- 🔹 Bénéficiaire -->
    <h3>Bénéficiaire</h3>
    <label for="receiverName">Nom et Prénom</label>
    <input type="text" id="receiverName" name="receiverName" required>

    <label for="receiverCountry">Pays de destination</label>
    <input type="text" id="receiverCountry" name="receiverCountry" required>

    <label for="receiverAddress">Adresse complète</label>
    <input type="text" id="receiverAddress" name="receiverAddress" required>

    <label for="receiverWhatsapp">WhatsApp / Téléphone</label>
    <input type="text" id="receiverWhatsapp" name="receiverWhatsapp" required>

    <!-- 🔹 Détails du Transfert -->
    <h3>Détails du Transfert</h3>
    <label for="transferAmount">Montant à transférer</label>
    <input type="number" id="transferAmount" name="transferAmount" min="1" required>

    <label for="transferCurrency">Devise</label>
    <select id="transferCurrency" name="transferCurrency" required>
      <option value="HTG">Gourdes</option>
      <option value="USD">USD</option>
    </select>

    <label for="transferCode">Code unique</label>
    <input type="text" id="transferCode" name="transferCode" readonly>

    <label for="transferStatus">Status</label>
    <input type="text" id="transferStatus" name="transferStatus" value="PENDING" readonly>

    <label for="transferExpiration">Expiration : 7 jours</label>
    <input type="text" id="transferExpiration" name="transferExpiration" readonly>

    <br><br>
    <button type="submit" id="btnTransferer">TRANSFERER</button>
    <p id="transfertMessage"></p>

    <p>Agent autorisé confirmé ✅</p>
  </form>
</div>

</body>
</html>
