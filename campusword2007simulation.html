<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Word 2007 Simulation</title>

    <link rel="stylesheet" href="campusword2007simulation.css">
</head>

<body>

<!-- =========================================================
    MAIN WINDOW
========================================================= -->
<div id="cwWindow" data-app="campusword2007simulation">

    <!-- =====================================================
        TITLE BAR
    ====================================================== -->
    <div id="cwTitleBar">

        <div id="cwOfficeButton" data-role="office-button">
            Office
        </div>

        <div id="cwTitle">
            Campus Word 2007 Simulation
        </div>

        <div id="cwWindowControls">
            <button class="cwControlBtn" id="minBtn">_</button>
            <button class="cwControlBtn" id="maxBtn">□</button>
            <button class="cwControlBtn" id="closeBtn">X</button>
        </div>

    </div>






<!-- =====================================================
    QUICK ACCESS TOOLBAR (WITH SVG ICONS)
===================================================== -->
<div id="cwQuickAccess">

    <!-- SAVE -->
    <button class="cwQBtn" data-action="save">
        <span class="cwIcon">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"/>
            </svg>
        </span>
        <span class="cwLabel">Save</span>
    </button>

    <!-- UNDO -->
    <button class="cwQBtn" data-action="undo">
        <span class="cwIcon">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M12 5V2L7 7l5 5V8c3.31 0 6 2.69 6 6a6 6 0 0 1-6 6H7v2h5a8 8 0 0 0 0-16z"/>
            </svg>
        </span>
        <span class="cwLabel">Undo</span>
    </button>

    <!-- REDO -->
    <button class="cwQBtn" data-action="redo">
        <span class="cwIcon">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M12 5a8 8 0 0 0 0 16h5v-2h-5a6 6 0 1 1 6-6c0 3.31-2.69 6-6 6v3l5-5-5-5v3z"/>
            </svg>
        </span>
        <span class="cwLabel">Redo</span>
    </button>

</div>




<!-- =====================================================
    RIBBON TABS (ID ONLY VERSION)
===================================================== -->
<div id="cwRibbonTabs">

    <!-- HOME -->
    <div class="cwRibbonTab" id="tab-home">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- INSERT -->
    <div class="cwRibbonTab" id="tab-insert">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- PAGE LAYOUT -->
    <div class="cwRibbonTab" id="tab-page-layout">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- REFERENCES -->
    <div class="cwRibbonTab" id="tab-references">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- MAILINGS -->
    <div class="cwRibbonTab" id="tab-mailings">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- REVIEW -->
    <div class="cwRibbonTab" id="tab-review">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- VIEW -->
    <div class="cwRibbonTab" id="tab-view">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- FORMAT -->
    <div class="cwRibbonTab" id="tab-format">
        <div class="cwRibbonGroups"></div>
    </div>

</div>





<!-- =====================================================
    TAB BAR (ID COMPATIBLE VERSION)
===================================================== -->
<div id="cwRibbonTabBar">

    <button class="cwTabBtn" data-target="tab-home">Home</button>
    <button class="cwTabBtn" data-target="tab-insert">Insert</button>
    <button class="cwTabBtn" data-target="tab-page-layout">Page Layout</button>
    <button class="cwTabBtn" data-target="tab-references">References</button>
    <button class="cwTabBtn" data-target="tab-mailings">Mailings</button>
    <button class="cwTabBtn" data-target="tab-review">Review</button>
    <button class="cwTabBtn" data-target="tab-view">View</button>
    <button class="cwTabBtn" data-target="tab-format">Format</button>

</div>









<!-- =====================================================
    HOME TAB CONTENT (STRUCTURE ONLY - RIBBON READY)
===================================================== -->
<div class="cwRibbonPanel active" id="tab-home">

    <!-- ===================== CLIPBOARD ===================== -->
    <div class="cwRibbonGroup">
        <div class="cwGroupTitle">Clipboard</div>

        <button class="cwRibbonBtn" data-action="paste">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M19 21H5V3h4l1-1h4l1 1h4zM8 7h8v2H8zm0 4h8v2H8z"/>
            </svg>
            Paste
        </button>

        <button class="cwRibbonBtn" data-action="cut">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M3 6h7l2 2-2 2H3V6zm0 6h7l2 2-2 2H3v-4zm12-6h6v12h-6l-2-2 2-2h4V8h-4l-2-2z"/>
            </svg>
            Cut
        </button>

        <button class="cwRibbonBtn" data-action="copy">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M16 1H4v14h2V3h10zM20 5H8v18h12z"/>
            </svg>
            Copy
        </button>

        <button class="cwRibbonBtn" data-action="format-painter">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M7 2h10v4H7zM6 7h12v3H6zM9 10h6v12H9z"/>
            </svg>
            Format Painter
        </button>

    </div>

    <!-- ===================== FONT ===================== -->
    <div class="cwRibbonGroup">
        <div class="cwGroupTitle">Font</div>
<select data-action="font-family">
    <option>Calibri</option>
    <option>Arial</option>
    <option>Times New Roman</option>
    <option>Verdana</option>
    <option>Georgia</option>
    <option>Tahoma</option>
    <option>Trebuchet MS</option>
    <option>Segoe UI</option>
    <option>Helvetica</option>
    <option>Cambria</option>
    <option>Garamond</option>
    <option>Book Antiqua</option>
    <option>Palatino Linotype</option>
    <option>Lucida Sans Unicode</option>
    <option>Century Gothic</option>
    <option>Consolas</option>
    <option>Courier New</option>
    <option>Impact</option>
    <option>Franklin Gothic Medium</option>
    <option>Roboto</option>
</select>



        <input type="number" value="11" data-action="font-size">

        <button class="cwRibbonBtn" data-action="grow-font">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M12 4l4 8h-3v8h-2v-8H8z"/>
            </svg>
            A+
        </button>

        <button class="cwRibbonBtn" data-action="shrink-font">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M12 20l-4-8h3V4h2v8h3z"/>
            </svg>
            A-
        </button>

        <button class="cwRibbonBtn" data-action="bold">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M7 4h6a4 4 0 010 8H7zm0 8h7a4 4 0 010 8H7z"/>
            </svg>
            B
        </button>

        <button class="cwRibbonBtn" data-action="italic">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M10 4h10v2h-4l-4 12h4v2H6v-2h4l4-12h-4z"/>
            </svg>
            I
        </button>

        <button class="cwRibbonBtn" data-action="underline">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M6 3v7a6 6 0 0012 0V3h-2v7a4 4 0 11-8 0V3zM4 21h16v-2H4z"/>
            </svg>
            U
        </button>

        <button class="cwRibbonBtn" data-action="strike">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M3 12h18v2H3zM7 7c0-2 2-3 5-3s5 1 5 3h-2c0-1-1-1-3-1s-3 0-3 1 1 1 3 2c4 1 5 2 5 5s-2 4-5 4-5-1-5-4h2c0 1 1 2 3 2s3-1 3-2-1-2-4-3c-3-1-5-2-5-4z"/>
            </svg>
            S
        </button>




<!-- ===================== COLOR ===================== -->
<button class="cwRibbonBtn cwDropdownBtn" data-action="color">

    <svg viewBox="0 0 24 24" width="16" height="16">
        <path d="M12 3l4 18h-2l-1-4H9l-1 4H6l4-18z"/>
    </svg>

    Color ▾

    <span class="cwDropdownMenu cwColorMenu">

        <span class="cwColorDot" data-color="#000000" title="Black"></span>
        <span class="cwColorDot" data-color="#333333" title="Dark Gray"></span>
        <span class="cwColorDot" data-color="#ff0000" title="Red"></span>
        <span class="cwColorDot" data-color="#ff9900" title="Orange"></span>
        <span class="cwColorDot" data-color="#ffff00" title="Yellow"></span>
        <span class="cwColorDot" data-color="#00ff00" title="Green"></span>
        <span class="cwColorDot" data-color="#00ccff" title="Sky Blue"></span>
        <span class="cwColorDot" data-color="#0000ff" title="Blue"></span>
        <span class="cwColorDot" data-color="#9900ff" title="Purple"></span>
        <span class="cwColorDot" data-color="#ffffff" title="White"></span>

    </span>
</button>


<!-- ===================== HIGHLIGHT ===================== -->
<button class="cwRibbonBtn cwDropdownBtn" data-action="highlight">

    Highlight ▾

    <span class="cwDropdownMenu cwHighlightMenu">

        <span class="cwColorDot highlight" data-color="yellow" title="Yellow"></span>
        <span class="cwColorDot highlight" data-color="lightgreen" title="Green"></span>
        <span class="cwColorDot highlight" data-color="orange" title="Orange"></span>
        <span class="cwColorDot highlight" data-color="pink" title="Pink"></span>
        <span class="cwColorDot highlight" data-color="lightblue" title="Blue"></span>
        <span class="cwColorDot highlight" data-color="none" title="None"></span>

    </span>

</button>







    <!-- ===================== PARAGRAPH ===================== -->
    <div class="cwRibbonGroup">
        <div class="cwGroupTitle">Paragraph</div>

        <button class="cwRibbonBtn" data-action="align-left">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 6h18v2H3zm0 5h12v2H3zm0 5h18v2H3z"/></svg>
            Left
        </button>

        <button class="cwRibbonBtn" data-action="align-center">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6h12v2H6zm-3 5h18v2H3zm3 5h12v2H6z"/></svg>
            Center
        </button>

        <button class="cwRibbonBtn" data-action="align-right">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 6h18v2H3zm6 5h12v2H9zm-6 5h18v2H3z"/></svg>
            Right
        </button>

        <button class="cwRibbonBtn" data-action="justify">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
            Justify
        </button>

        <button class="cwRibbonBtn" data-action="bullet">
            <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="5" cy="7" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="5" cy="17" r="2"/></svg>
            Bullets
        </button>

        <button class="cwRibbonBtn" data-action="numbering">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 6h12v2H7zm0 5h12v2H7zm0 5h12v2H7z"/></svg>
            Numbering
        </button>

        <button class="cwRibbonBtn" data-action="indent-increase">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 4h2v16H3zm5 4h13l-4 4 4 4H8z"/></svg>
            Indent +
        </button>

        <button class="cwRibbonBtn" data-action="indent-decrease">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 4h2v16H3zm5 4h13l-4 4 4 4H8z"/></svg>
            Indent -
        </button>

    </div>

    <!-- ===================== STYLES ===================== -->
    <div class="cwRibbonGroup">
        <div class="cwGroupTitle">Styles</div>

        <button class="cwRibbonBtn" data-action="style-normal">Normal</button>
        <button class="cwRibbonBtn" data-action="style-h1">H1</button>
        <button class="cwRibbonBtn" data-action="style-h2">H2</button>
        <button class="cwRibbonBtn" data-action="style-title">Title</button>
        <button class="cwRibbonBtn" data-action="style-subtitle">Subtitle</button>

    </div>

    <!-- ===================== EDITING ===================== -->
    <div class="cwRibbonGroup">
        <div class="cwGroupTitle">Editing</div>

        <button class="cwRibbonBtn" data-action="find">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path d="M10 2a8 8 0 105.3 14.3l4.7 4.7 1.4-1.4-4.7-4.7A8 8 0 0010 2z"/>
            </svg>
            Find
        </button>

        <button class="cwRibbonBtn" data-action="replace">Replace</button>

        <button class="cwRibbonBtn" data-action="select">Select</button>

        <button class="cwRibbonBtn" data-action="select-all">Select All</button>

    </div>

</div>















    <!-- INSERT -->
    <div class="cwRibbonPanel" id="tab-insert"></div>

    <!-- PAGE LAYOUT -->
    <div class="cwRibbonPanel" id="tab-page-layout"></div>

    <!-- REFERENCES -->
    <div class="cwRibbonPanel" id="tab-references"></div>

    <!-- MAILINGS -->
    <div class="cwRibbonPanel" id="tab-mailings"></div>

    <!-- REVIEW -->
    <div class="cwRibbonPanel" id="tab-review"></div>

    <!-- VIEW -->
    <div class="cwRibbonPanel" id="tab-view"></div>

    <!-- FORMAT -->
    <div class="cwRibbonPanel" id="tab-format"></div>
















    <!-- =====================================================
        WORKSPACE (WORD EDITING AREA)
    ====================================================== -->
    <div id="cwWorkspace">

        <div id="cwWorkspaceShell">

            <!-- RULERS (EMPTY STRUCTURE - JS/CSS WILL RENDER VISUALS) -->
            <div id="cwRulerTop"></div>
            <div id="cwRulerLeft"></div>

            <!-- SCROLL AREA -->
            <div id="cwWorkspaceScroll">

                <!-- DOCUMENT CONTAINER (JS WILL CREATE PAGES HERE) -->
                <div id="cwDocumentContainer"></div>

            </div>

            <!-- FLOATING UI LAYER -->
            <div id="cwFloatingLayer">

                <div id="cwSelectionBox"></div>
                <div id="cwTooltip"></div>

            </div>

        </div>

    </div>

</div>




<!-- =========================================================
    STATUS BAR
========================================================= -->
<div id="cwStatusBar">

    <!-- LEFT -->
    <div id="cwStatusLeft">

        <span id="cwStatusReady">Ready</span>

        <span class="cwStatusSeparator">|</span>

        <span id="cwWordCount">
            Words:
            <span id="cwWordCountValue">0</span>
        </span>

        <span class="cwStatusSeparator">|</span>

        <span id="cwLanguage">
            English
        </span>

    </div>


    <!-- CENTER -->
    <div id="cwStatusCenter">

        <span id="cwCurrentPageLabel">Page</span>

        <span id="cwCurrentPage">1</span>

        <span id="cwPageSeparator">of</span>

        <span id="cwTotalPages">1</span>

    </div>


    <!-- RIGHT -->
    <div id="cwStatusRight">

        <!-- VIEW MODES -->
        <div id="cwViewModes">

            <button
                id="cwPrintLayoutBtn"
                class="cwViewBtn"
                title="Print Layout">
                📄
            </button>

            <button
                id="cwWebLayoutBtn"
                class="cwViewBtn"
                title="Web Layout">
                🌐
            </button>

            <button
                id="cwDraftViewBtn"
                class="cwViewBtn"
                title="Draft View">
                📝
            </button>

        </div>

        <span class="cwStatusSeparator">|</span>

        <!-- ZOOM -->
        <div id="cwZoomControls">

            <button
                id="cwZoomOut"
                class="cwZoomBtn"
                title="Zoom Out">
                −
            </button>

            <div id="cwZoomSlider">

                <div id="cwZoomTrack">

                    <div id="cwZoomProgress"></div>

                    <div id="cwZoomThumb"></div>

                </div>

            </div>

            <button
                id="cwZoomIn"
                class="cwZoomBtn"
                title="Zoom In">
                +
            </button>

            <span id="cwZoomValue">
                100%
            </span>

        </div>

    </div>

</div>









<!-- =========================================================
    SYSTEM OVERLAYS (JS CONTROLLED LATER)
========================================================= -->
<div id="cwDialogLayer"></div>

<div id="cwContextMenu" class="hidden"></div>

<div id="cwSystemLayer" style="display:none;">
    <div id="cwClipboardBuffer"></div>
    <div id="cwSelectionState"></div>
    <div id="cwRuntimeCache"></div>
</div>

<!-- JS (EMPTY FOR NOW, YOU SAID YOU START FROM SCRATCH) -->
<script src="campusword2007simulation.js"></script>

</body>
</html>
