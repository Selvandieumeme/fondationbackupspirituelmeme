<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- =========================================================
        CAMPUS WORD 2007 SIMULATION
        PART 1 - FOUNDATION UI SHELL
        CORE ARCHITECTURE
    ========================================================= -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Word 2007 Simulation</title>

    <!-- CSS FILE -->
    <link rel="stylesheet" href="campusword2007simulation.css">
</head>

<body>

<!-- =========================================================
     WINDOW SHELL (ROOT CONTAINER)
========================================================= -->
<div id="cwWindow">

    <!-- =====================================================
         TITLE BAR
    ====================================================== -->
    <div id="cwTitleBar">

        <!-- OFFICE BUTTON -->
        <div id="cwOfficeButton">
            <span>Office</span>
        </div>

        <!-- WINDOW TITLE -->
        <div id="cwTitle">
            Campus Word 2007 Simulation
        </div>

        <!-- WINDOW CONTROLS -->
        <div id="cwWindowControls">
            <button class="cwControlBtn" id="minBtn">_</button>
            <button class="cwControlBtn" id="maxBtn">□</button>
            <button class="cwControlBtn" id="closeBtn">X</button>
        </div>

    </div>

    <!-- =====================================================
         QUICK ACCESS TOOLBAR
    ====================================================== -->
    <div id="cwQuickAccess">

        <button class="cwQBtn" id="saveBtn">Save</button>
        <button class="cwQBtn" id="undoBtn">Undo</button>
        <button class="cwQBtn" id="redoBtn">Redo</button>

    </div>

    <!-- =====================================================
         RIBBON HEADER
    ====================================================== -->
    <div id="cwRibbon">

        <div class="cwRibbonGroup">
            <div class="cwGroupTitle">File</div>
            <button class="cwRibbonBtn">New</button>
            <button class="cwRibbonBtn">Open</button>
        </div>

        <div class="cwRibbonGroup">
            <div class="cwGroupTitle">Edit</div>
            <button class="cwRibbonBtn">Cut</button>
            <button class="cwRibbonBtn">Copy</button>
            <button class="cwRibbonBtn">Paste</button>
        </div>

        <div class="cwRibbonGroup">
            <div class="cwGroupTitle">Format</div>
            <button class="cwRibbonBtn">Bold</button>
            <button class="cwRibbonBtn">Italic</button>
            <button class="cwRibbonBtn">Underline</button>
        </div>

    </div>

    <!-- =====================================================
         WORKSPACE (DOCUMENT AREA)
    ====================================================== -->
    <div id="cwWorkspace">

        <!-- DocumentEngine ap konekte isit la -->
        <div id="cwPageContainer"></div>

    </div>

</div>

<!-- =========================================================
     JS FILE
========================================================= -->
<script src="campusword2007simulation.js"></script>

</body>
</html>
