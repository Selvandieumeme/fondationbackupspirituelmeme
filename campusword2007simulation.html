<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Word 2007 Simulation</title>

    <link rel="stylesheet" href="campusword2007simulation.css">
</head>

<body>

<!-- =========================================================
    MAIN WINDOW
========================================================= -->
<div id="cwWindow" data-app="campusword2007simulation">

    <!-- =====================================================
        TITLE BAR
    ====================================================== -->
    <div id="cwTitleBar">

        <div id="cwOfficeButton" data-role="office-button">
            Office
        </div>

        <div id="cwTitle">
            Campus Word 2007 Simulation
        </div>

        <div id="cwWindowControls">
            <button class="cwControlBtn" id="minBtn">_</button>
            <button class="cwControlBtn" id="maxBtn">□</button>
            <button class="cwControlBtn" id="closeBtn">X</button>
        </div>

    </div>






<!-- =====================================================
    QUICK ACCESS TOOLBAR (WITH SVG ICONS)
===================================================== -->
<div id="cwQuickAccess">

    <!-- SAVE -->
    <button class="cwQBtn" data-action="save">
        <span class="cwIcon">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"/>
            </svg>
        </span>
        <span class="cwLabel">Save</span>
    </button>

    <!-- UNDO -->
    <button class="cwQBtn" data-action="undo">
        <span class="cwIcon">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M12 5V2L7 7l5 5V8c3.31 0 6 2.69 6 6a6 6 0 0 1-6 6H7v2h5a8 8 0 0 0 0-16z"/>
            </svg>
        </span>
        <span class="cwLabel">Undo</span>
    </button>

    <!-- REDO -->
    <button class="cwQBtn" data-action="redo">
        <span class="cwIcon">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M12 5a8 8 0 0 0 0 16h5v-2h-5a6 6 0 1 1 6-6c0 3.31-2.69 6-6 6v3l5-5-5-5v3z"/>
            </svg>
        </span>
        <span class="cwLabel">Redo</span>
    </button>

</div>


<!-- =====================================================
    RIBBON TABS (FULL WORD 2007 STRUCTURE + FORMAT)
===================================================== -->
<div id="cwRibbonTabs">

    <!-- FILE -->
    <div class="cwRibbonTab active" data-tab="file">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- HOME -->
    <div class="cwRibbonTab" data-tab="home">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- INSERT -->
    <div class="cwRibbonTab" data-tab="insert">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- PAGE LAYOUT -->
    <div class="cwRibbonTab" data-tab="page-layout">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- REFERENCES -->
    <div class="cwRibbonTab" data-tab="references">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- MAILINGS -->
    <div class="cwRibbonTab" data-tab="mailings">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- REVIEW -->
    <div class="cwRibbonTab" data-tab="review">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- VIEW -->
    <div class="cwRibbonTab" data-tab="view">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- FORMAT (CUSTOM TAB LIKE WORD EXTENSIONS) -->
    <div class="cwRibbonTab" data-tab="format">
        <div class="cwRibbonGroups"></div>
    </div>

</div>

<!-- =====================================================
    TAB BAR
===================================================== -->
<div id="cwRibbonTabBar">

    <button class="cwTabBtn active" data-target="file">File</button>
    <button class="cwTabBtn" data-target="home">Home</button>
    <button class="cwTabBtn" data-target="insert">Insert</button>
    <button class="cwTabBtn" data-target="page-layout">Page Layout</button>
    <button class="cwTabBtn" data-target="references">References</button>
    <button class="cwTabBtn" data-target="mailings">Mailings</button>
    <button class="cwTabBtn" data-target="review">Review</button>
    <button class="cwTabBtn" data-target="view">View</button>
    <button class="cwTabBtn" data-target="format">Format</button>

</div>









<!-- =========================================================
    RIBBON CONTENT VIEWPORT (DYNAMIC AREA)
========================================================= -->
<div id="cwRibbonContentArea">
<div class="cwRibbonPanel active" data-panel="file"></div>

<div class="cwRibbonPanel active" data-panel="home">

<!-- ================= CLIPBOARD ================= -->
<div class="cwRibbonGroup">
    <div class="cwGroupTitle">Clipboard</div>

    <div class="cwRibbonGroupContent">

        <!-- Paste -->
        <button class="cwRibbonIconBtn" title="Paste" data-command="paste">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M16 2h-2.2A2.8 2.8 0 0 0 11 0a2.8 2.8 0 0 0-2.8 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-5-1a1 1 0 0 1 1 1h-2a1 1 0 0 1 1-1zm7 19H6V4h2v2h6V4h2zM8 9h8v2H8zm0 4h6v2H8z"/>
            </svg>
        </button>

        <!-- Cut -->
        <button class="cwRibbonIconBtn" title="Cut" data-command="cut">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M9.5 3A2.5 2.5 0 1 0 12 5.5 2.5 2.5 0 0 0 9.5 3Zm5 0A2.5 2.5 0 1 0 17 5.5 2.5 2.5 0 0 0 14.5 3ZM8.6 8.8l3.4 3.4-3.4 3.4A2.5 2.5 0 1 0 10 17.5l3.4-3.4 3.4 3.4A2.5 2.5 0 1 0 18.5 16l-3.4-3.4 3.4-3.4A2.5 2.5 0 1 0 17 6.5L13.6 9.9 10.2 6.5A2.5 2.5 0 1 0 8.6 8.8Z"/>
            </svg>
        </button>

        <!-- Copy -->
        <button class="cwRibbonIconBtn" title="Copy" data-command="copy">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M8 2a2 2 0 0 0-2 2v11h2V4h10V2zm4 4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 2h8v12h-8z"/>
            </svg>
        </button>

        <!-- Format Painter -->
        <button class="cwRibbonIconBtn" title="Format Painter" data-command="formatPainter">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M3 5h13v3h2a2 2 0 0 1 2 2v2h-2v7a2 2 0 0 1-2 2h-2v-9H8V8H3zm2 1v1h9V6z"/>
            </svg>
        </button>

        <!-- Clipboard History -->
        <button class="cwRibbonIconBtn" title="Clipboard History" data-command="clipboardHistory">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M9 2h6v2h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3zm0 4H6v14h12V6h-3v2H9zm1 5h4v2h-4zm0 4h6v2h-6z"/>
            </svg>
        </button>

        <!-- Paste Special -->
        <button class="cwRibbonIconBtn" title="Paste Special" data-command="pasteSpecial">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M16 2h-2.2A2.8 2.8 0 0 0 11 0a2.8 2.8 0 0 0-2.8 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-5-1a1 1 0 0 1 1 1h-2a1 1 0 0 1 1-1zm7 19H6V4h2v2h6V4h2zM10 10h2v2h2v2h-2v2h-2v-2H8v-2h2z"/>
            </svg>
        </button>

    </div>
</div>



<!-- ================= FONT ================= -->
<div class="cwRibbonGroup">
    <div class="cwGroupTitle">Font</div>

    <div class="cwRibbonGroupContent">

        <!-- Font Name -->
        <select class="cwRibbonSelect" title="Font Name" data-command="fontName">
            <option selected>Calibri</option>
            <option>Arial</option>
            <option>Arial Black</option>
            <option>Bahnschrift</option>
            <option>Book Antiqua</option>
            <option>Bookman Old Style</option>
            <option>Cambria</option>
            <option>Candara</option>
            <option>Century</option>
            <option>Century Gothic</option>
            <option>Comic Sans MS</option>
            <option>Consolas</option>
            <option>Constantia</option>
            <option>Corbel</option>
            <option>Courier New</option>
            <option>Franklin Gothic Medium</option>
            <option>Garamond</option>
            <option>Georgia</option>
            <option>Impact</option>
            <option>Lucida Console</option>
            <option>Lucida Sans Unicode</option>
            <option>Palatino Linotype</option>
            <option>Segoe UI</option>
            <option>Tahoma</option>
            <option>Times New Roman</option>
            <option>Trebuchet MS</option>
            <option>Verdana</option>
        </select>

        <!-- Font Size -->
        <select class="cwRibbonSelect" title="Font Size" data-command="fontSize">
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option selected>12</option>
            <option>14</option>
            <option>16</option>
            <option>18</option>
            <option>20</option>
            <option>22</option>
            <option>24</option>
            <option>26</option>
            <option>28</option>
            <option>36</option>
            <option>48</option>
            <option>72</option>
        </select>

        <!-- Grow Font -->
        <button class="cwRibbonIconBtn" title="Increase Font Size" data-command="growFont">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M11 3l5 8h-3v5H9v-5H6zm8 14v2h-2v2h-2v-2h-2v-2h2v-2h2v2z"/>
            </svg>
        </button>

        <!-- Shrink Font -->
        <button class="cwRibbonIconBtn" title="Decrease Font Size" data-command="shrinkFont">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M11 3l5 8h-3v5H9v-5H6zm4 14h6v2h-6z"/>
            </svg>
        </button>

        <!-- Change Case -->
        <button class="cwRibbonIconBtn" title="Change Case" data-command="changeCase">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M5 18l3.8-10h2.4L15 18h-2.2l-.8-2H8l-.8 2zm3.6-4h2.8L10 9.8zM17 8h2v8h-2zm-1 7h4v2h-4z"/>
            </svg>
        </button>

        <!-- Clear Formatting -->
        <button class="cwRibbonIconBtn" title="Clear Formatting" data-command="clearFormatting">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M5 4h10v2h-3l-2.2 6H8l2.2-6H5zm11.3 8.3L21 17l-1.4 1.4-4.7-4.7-2.5 2.5V13l1.1-1.1-2.7-2.7L12.2 8z"/>
            </svg>
        </button>

    

        <!-- ================= FONT : TEXT STYLE ================= -->

        <!-- Bold -->
        <button class="cwRibbonIconBtn" title="Bold" data-command="bold">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M7 4h6.4c2.5 0 4.1 1.5 4.1 3.8 0 1.5-.8 2.6-2.1 3.2 1.8.5 2.9 1.9 2.9 3.9 0 2.9-2.1 5.1-5.6 5.1H7V4zm2.4 2v4h3.6c1.3 0 2.1-.8 2.1-2s-.8-2-2.2-2H9.4zm0 6v5h4c1.7 0 2.7-.9 2.7-2.4s-1-2.6-2.8-2.6H9.4z"/>
            </svg>
        </button>

        <!-- Italic -->
        <button class="cwRibbonIconBtn" title="Italic" data-command="italic">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M9 4v2h2.7l-3.4 12H6v2h9v-2h-2.7l3.4-12H18V4z"/>
            </svg>
        </button>

        <!-- Underline -->
        <button class="cwRibbonIconBtn" title="Underline" data-command="underline">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M7 3v7a5 5 0 0 0 10 0V3h-2v7a3 3 0 0 1-6 0V3zM5 19h14v2H5z"/>
            </svg>
        </button>

        <!-- Strikethrough -->
        <button class="cwRibbonIconBtn" title="Strikethrough" data-command="strikeThrough">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M5 11h14v2H5zm3-6h8a3 3 0 0 1 3 3h-2a1 1 0 0 0-1-1H8a1 1 0 0 0 0 2h5a4 4 0 1 1 0 8H6v-2h7a2 2 0 0 0 0-4H8a3 3 0 1 1 0-6z"/>
            </svg>
        </button>

        <!-- Subscript -->
        <button class="cwRibbonIconBtn" title="Subscript" data-command="subscript">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M5 6h2.5L11 10l3.5-4H17l-4.6 5.3L17 17h-2.6L11 13l-3.4 4H5l4.6-5.7zm13 8h4v1.5l-2.2 2H22V19h-4v-1.3l2.3-2H18z"/>
            </svg>
        </button>

        <!-- Superscript -->
        <button class="cwRibbonIconBtn" title="Superscript" data-command="superscript">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M5 17h2.5L11 13l3.5 4H17l-4.6-5.3L17 6h-2.6L11 10 7.6 6H5l4.6 5.7zm13-13h4v1.5l-2.2 2H22V9h-4V7.7l2.3-2H18z"/>
            </svg>
        </button>

        <!-- Font Color -->
        <label class="cwRibbonColorPicker" title="Font Color">
            <input type="color"
                   value="#000000"
                   data-command="fontColor">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M12 3l5 13h-2l-1.2-3H10.2L9 16H7l5-13zm-.8 8h2.6L12.5 7z"/>
                <rect x="4" y="19" width="16" height="3" rx="1"/>
            </svg>
        </label>

        <!-- Highlight Color -->
        <label class="cwRibbonColorPicker" title="Text Highlight Color">
            <input type="color"
                   value="#ffff00"
                   data-command="highlightColor">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M6 4h12v8H6z"/>
                <rect x="4" y="15" width="16" height="5" rx="1"/>
            </svg>
        </label>

        <!-- Text Effects -->
        <button class="cwRibbonIconBtn" title="Text Effects" data-command="textEffects">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M12 3l6 18h-2.3l-1.4-4H9.7l-1.4 4H6L12 3zm-1.6 10h3.2L12 8.3z"/>
                <circle cx="19" cy="6" r="2"/>
            </svg>
        </button>

        <!-- Text Shadow -->
        <button class="cwRibbonIconBtn" title="Text Shadow" data-command="textShadow">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M6 5h12v2h-5v10h-2V7H6z"/>
                <path fill="currentColor" opacity=".35"
                    d="M9 19h9v2H9z"/>
            </svg>
        </button>



        <!-- ================= FONT : ADVANCED ================= -->

        <!-- Small Caps -->
        <button class="cwRibbonIconBtn" title="Small Caps" data-command="smallCaps">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor"
                    d="M4 17l2.2-6h1.6L10 17H8.4l-.5-1.4H6.1L5.6 17zm2.5-2.8h1L7 12.8zm6.2-5.2h6v2h-2v6h-2v-6h-2zm-2.5 2H12v6h-1.8z"/>
            </svg>
        </button>

        <!-- All Caps -->
        <button class="cwRibbonIconBtn" title="All Caps" data-command="allCaps">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <path fill="currentColor"
                    d="M3 18L7 6h2l4 12h-2l-.8-2H5.8L5 18zm3.5-4h3L8 9.4zm8.5 4V6h6v2h-4v2h3v2h-3v4z"/>
            </svg>
        </button>

        <!-- Hidden Text -->
        <button class="cwRibbonIconBtn" title="Hidden Text" data-command="hiddenText">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <path fill="currentColor"
                    d="M12 5c5 0 8.7 4.3 9.7 6-1 1.7-4.7 6-9.7 6S3.3 12.7 2.3 11C3.3 9.3 7 5 12 5zm0 2.2A3.8 3.8 0 1 0 15.8 11 3.8 3.8 0 0 0 12 7.2zm0 2A1.8 1.8 0 1 1 10.2 11 1.8 1.8 0 0 1 12 9.2z"/>
                <path fill="currentColor" d="M3 20l18-18 1.4 1.4-18 18z"/>
            </svg>
        </button>

        <!-- Character Spacing -->
        <button class="cwRibbonIconBtn" title="Character Spacing" data-command="characterSpacing">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <path fill="currentColor"
                    d="M7 5h2l3 14h-2l-.6-3H6.6L6 19H4zm0 9h2L8 9zm8-9h2v14h-2zm4 4l2 2-2 2v-1h-2v-2h2zM3 11l2-2v1h2v2H5v1z"/>
            </svg>
        </button>

        <!-- Text Transform -->
        <button class="cwRibbonIconBtn" title="Text Transform" data-command="textTransform">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <path fill="currentColor"
                    d="M5 6h9v2H11v10H8V8H5zm10 1l4 4h-3v7h-2v-7h-3z"/>
            </svg>
        </button>

        <!-- Remove Text Effects -->
        <button class="cwRibbonIconBtn" title="Remove Text Effects" data-command="clearTextEffects">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <path fill="currentColor"
                    d="M12 3l6 17h-2.2l-1.2-3.5H9.4L8.2 20H6zm-1.8 9h3.6L12 7.2z"/>
                <path fill="currentColor"
                    d="M4 4l16 16-1.5 1.5L2.5 5.5z"/>
            </svg>
        </button>

        <!-- Format Brush -->
        <button class="cwRibbonIconBtn" title="Copy Formatting" data-command="copyFormatting">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <path fill="currentColor"
                    d="M4 6h10v3h3a2 2 0 0 1 2 2v2h-2v6a2 2 0 0 1-2 2h-2v-8H8V9H4z"/>
            </svg>
        </button>

        <!-- Font Dialog -->
        <button class="cwRibbonIconBtn" title="Font Settings" data-command="fontDialog">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <path fill="currentColor"
                    d="M12 4l5 14h-2l-1.1-3H10l-1.1 3H7zm-1.2 8h2.4L12 8.6z"/>
                <path fill="currentColor"
                    d="M18 18h4v2h-4zM20 16v6"/>
            </svg>
        </button>

</div>
</div>




<!-- ================= PARAGRAPH ================= -->
<div class="cwRibbonGroup">
    <div class="cwGroupTitle">Paragraph</div>

    <div class="cwRibbonGroupContent">

        <!-- Bullets -->
        <button class="cwRibbonIconBtn"
                title="Bullets"
                data-command="insertUnorderedList">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <circle cx="5" cy="6" r="1.6" fill="currentColor"/>
                <circle cx="5" cy="12" r="1.6" fill="currentColor"/>
                <circle cx="5" cy="18" r="1.6" fill="currentColor"/>
                <rect x="9" y="5" width="11" height="2" rx="1" fill="currentColor"/>
                <rect x="9" y="11" width="11" height="2" rx="1" fill="currentColor"/>
                <rect x="9" y="17" width="11" height="2" rx="1" fill="currentColor"/>
            </svg>
        </button>

        <!-- Numbering -->
        <button class="cwRibbonIconBtn"
                title="Numbering"
                data-command="insertOrderedList">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <text x="2.3" y="8" font-size="5" fill="currentColor">1.</text>
                <text x="2.3" y="14" font-size="5" fill="currentColor">2.</text>
                <text x="2.3" y="20" font-size="5" fill="currentColor">3.</text>
                <rect x="10" y="5" width="10" height="2" rx="1" fill="currentColor"/>
                <rect x="10" y="11" width="10" height="2" rx="1" fill="currentColor"/>
                <rect x="10" y="17" width="10" height="2" rx="1" fill="currentColor"/>
            </svg>
        </button>

        <!-- Multilevel List -->
        <button class="cwRibbonIconBtn"
                title="Multilevel List"
                data-command="multilevelList">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <circle cx="4.5" cy="5.5" r="1.2" fill="currentColor"/>
                <circle cx="8" cy="11.5" r="1.2" fill="currentColor"/>
                <circle cx="11.5" cy="17.5" r="1.2" fill="currentColor"/>
                <rect x="8" y="5" width="12" height="2" rx="1" fill="currentColor"/>
                <rect x="11" y="11" width="9" height="2" rx="1" fill="currentColor"/>
                <rect x="14" y="17" width="6" height="2" rx="1" fill="currentColor"/>
            </svg>
        </button>

        <!-- Decrease Indent -->
        <button class="cwRibbonIconBtn"
                title="Decrease Indent"
                data-command="outdent">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <rect x="8" y="5" width="12" height="2" rx="1" fill="currentColor"/>
                <rect x="8" y="11" width="12" height="2" rx="1" fill="currentColor"/>
                <rect x="8" y="17" width="12" height="2" rx="1" fill="currentColor"/>
