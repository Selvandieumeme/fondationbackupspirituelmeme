<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Word 2007 Simulation</title>

    <link rel="stylesheet" href="campusword2007simulation.css">
</head>

<body>

<!-- =========================================================
    MAIN WINDOW
========================================================= -->
<div id="cwWindow" data-app="campusword2007simulation">

    <!-- =====================================================
        TITLE BAR
    ====================================================== -->
    <div id="cwTitleBar">

        <div id="cwOfficeButton" data-role="office-button">
            Office
        </div>

        <div id="cwTitle">
            Campus Word 2007 Simulation
        </div>

        <div id="cwWindowControls">
            <button class="cwControlBtn" id="minBtn">_</button>
            <button class="cwControlBtn" id="maxBtn">□</button>
            <button class="cwControlBtn" id="closeBtn">X</button>
        </div>

    </div>






<!-- =====================================================
    QUICK ACCESS TOOLBAR (WITH SVG ICONS)
===================================================== -->
<div id="cwQuickAccess">

    <!-- SAVE -->
    <button class="cwQBtn" data-action="save">
        <span class="cwIcon">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"/>
            </svg>
        </span>
        <span class="cwLabel">Save</span>
    </button>

    <!-- UNDO -->
    <button class="cwQBtn" data-action="undo">
        <span class="cwIcon">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M12 5V2L7 7l5 5V8c3.31 0 6 2.69 6 6a6 6 0 0 1-6 6H7v2h5a8 8 0 0 0 0-16z"/>
            </svg>
        </span>
        <span class="cwLabel">Undo</span>
    </button>

    <!-- REDO -->
    <button class="cwQBtn" data-action="redo">
        <span class="cwIcon">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M12 5a8 8 0 0 0 0 16h5v-2h-5a6 6 0 1 1 6-6c0 3.31-2.69 6-6 6v3l5-5-5-5v3z"/>
            </svg>
        </span>
        <span class="cwLabel">Redo</span>
    </button>

</div>


<!-- =====================================================
    RIBBON TABS (FULL WORD 2007 STRUCTURE + FORMAT)
===================================================== -->
<div id="cwRibbonTabs">

    <!-- FILE -->
    <div class="cwRibbonTab active" data-tab="file">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- HOME -->
    <div class="cwRibbonTab" data-tab="home">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- INSERT -->
    <div class="cwRibbonTab" data-tab="insert">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- PAGE LAYOUT -->
    <div class="cwRibbonTab" data-tab="page-layout">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- REFERENCES -->
    <div class="cwRibbonTab" data-tab="references">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- MAILINGS -->
    <div class="cwRibbonTab" data-tab="mailings">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- REVIEW -->
    <div class="cwRibbonTab" data-tab="review">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- VIEW -->
    <div class="cwRibbonTab" data-tab="view">
        <div class="cwRibbonGroups"></div>
    </div>

    <!-- FORMAT (CUSTOM TAB LIKE WORD EXTENSIONS) -->
    <div class="cwRibbonTab" data-tab="format">
        <div class="cwRibbonGroups"></div>
    </div>

</div>

<!-- =====================================================
    TAB BAR
===================================================== -->
<div id="cwRibbonTabBar">

    <button class="cwTabBtn active" data-target="file">File</button>
    <button class="cwTabBtn" data-target="home">Home</button>
    <button class="cwTabBtn" data-target="insert">Insert</button>
    <button class="cwTabBtn" data-target="page-layout">Page Layout</button>
    <button class="cwTabBtn" data-target="references">References</button>
    <button class="cwTabBtn" data-target="mailings">Mailings</button>
    <button class="cwTabBtn" data-target="review">Review</button>
    <button class="cwTabBtn" data-target="view">View</button>
    <button class="cwTabBtn" data-target="format">Format</button>

</div>









<!-- =========================================================
    RIBBON CONTENT VIEWPORT (DYNAMIC AREA)
========================================================= -->
<div id="cwRibbonContentArea">

    <div class="cwRibbonPanel active" data-panel="file"></div>

<div class="cwRibbonPanel active" data-panel="home">

    <!-- ================= CLIPBOARD ================= -->
    <div class="cwRibbonGroup">
        <div class="cwGroupTitle">Clipboard</div>
        <div class="cwRibbonGroupContent">

            <button class="cwRibbonIconBtn" title="Paste">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 2h-4V1a1 1 0 0 0-1-1H10a1 1 0 0 0-1 1v1H5a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
            </button>

            <button class="cwRibbonIconBtn" title="Cut">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm6 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM3 21l8-8 4 4-8 8H3z"/></svg>
            </button>

            <button class="cwRibbonIconBtn" title="Copy">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 1H4a2 2 0 0 0-2 2v12h2V3h12V1zm4 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/></svg>
            </button>

        </div>
    </div>

    <!-- ================= FONT ================= -->
    <div class="cwRibbonGroup">
        <div class="cwGroupTitle">Font</div>

        <div class="cwRibbonGroupContent">

            <!-- Font Name -->
            <select class="cwRibbonSelect" title="Font Name">
                <option>Calibri</option>
                <option>Arial</option>
                <option>Times New Roman</option>
                <option>Verdana</option>
            </select>

            <!-- Font Size -->
            <select class="cwRibbonSelect" title="Font Size">
                <option>8</option><option>9</option><option>10</option>
                <option>11</option><option>12</option><option>14</option>
                <option>16</option><option>18</option><option>20</option>
            </select>

            <button class="cwRibbonIconBtn" title="Grow Font">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 4l4 4h-3v6h-2V8H8l4-4z"/></svg>
            </button>

            <button class="cwRibbonIconBtn" title="Shrink Font">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 20l-4-4h3v-6h2v6h3l-4 4z"/></svg>
            </button>

            <button class="cwRibbonIconBtn" title="Change Case">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 7h6v2H9v8H7V9H5V7zm8 0h6v2h-2v10h-2V9h-2V7z"/></svg>
            </button>

            <button class="cwRibbonIconBtn" title="Clear Formatting">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 3l18 18-1.4 1.4L12 13.8 8.6 20H6l4.6-7L2 4.4 3 3z"/></svg>
            </button>

            <button class="cwRibbonIconBtn" title="Bold"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4h7a4 4 0 0 1 0 8H7V4zm0 10h8a4 4 0 0 1 0 8H7v-8z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Italic"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 4h8l-1 2h-2l-3 12h2l-1 2H6l1-2h2l3-12H9l1-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Underline"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 2v10a6 6 0 0 0 12 0V2h-2v10a4 4 0 0 1-8 0V2H6zm-2 20h16v2H4v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Strikethrough"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 12h18v2H3v-2zm3-6h12v2H6V6zm2 12h8v2H8v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Subscript"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h2l3 4 3-4h2l-4 6 4 6h-2l-3-4-3 4H4l4-6-4-6zm14 12h4v2h-2v2h2v2h-4v-2h2v-2h-2v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Superscript"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 16h2l3-4 3 4h2l-4-6 4-6h-2l-3 4-3-4H4l4 6-4 6zm14-12h4v2h-2v2h2v2h-4v-2h2V6h-2V4z"/></svg></button>

        </div>
    </div>

    <!-- ================= PARAGRAPH ================= -->
    <div class="cwRibbonGroup">
        <div class="cwGroupTitle">Paragraph</div>
        <div class="cwRibbonGroupContent">

            <button class="cwRibbonIconBtn" title="Bullets"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 6h2v2H4V6zm4 0h12v2H8V6zM4 11h2v2H4v-2zm4 0h12v2H8v-2zM4 16h2v2H4v-2zm4 0h12v2H8v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Numbering"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 6h2v2H4V6zm4 0h12v2H8V6zM4 11h2v2H4v-2zm4 0h12v2H8v-2zM4 16h2v2H4v-2zm4 0h12v2H8v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Decrease Indent"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 4h18v2H3V4zm6 6h12v2H9v-2zm-6 6h18v2H3v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Increase Indent"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 4h18v2H3V4zm3 6h15v2H6v-2zm3 6h12v2H9v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Line Spacing"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Align Left"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 4h18v2H3V4zm0 6h12v2H3v-2zm0 6h18v2H3v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Center"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 4h12v2H6V4zm-3 6h18v2H3v-2zm6 6h6v2H9v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Align Right"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 4h18v2H3V4zm6 6h12v2H9v-2zm-6 6h18v2H3v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Justify"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 4h18v2H3V4zm0 6h18v2H3v-2zm0 6h18v2H3v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Borders"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16v16H4V4zm2 2v12h12V6H6z"/></svg></button>

        </div>
    </div>

    <!-- ================= STYLES ================= -->
    <div class="cwRibbonGroup">
        <div class="cwGroupTitle">Styles</div>
        <div class="cwRibbonGroupContent">

            <button class="cwRibbonIconBtn" title="Normal"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16v4H4V4zm0 6h10v10H4V10z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Heading"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16v4H4V4zm0 8h16v8H4v-8z"/></svg></button>

        </div>
    </div>

    <!-- ================= EDITING ================= -->
    <div class="cwRibbonGroup">
        <div class="cwGroupTitle">Editing</div>
        <div class="cwRibbonGroupContent">

            <button class="cwRibbonIconBtn" title="Find"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l4.39 4.39-1.41 1.41-4.39-4.39A8 8 0 1 1 10 2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Replace"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 7h10v2H7V7zm0 4h10v2H7v-2zm0 4h10v2H7v-2z"/></svg></button>

            <button class="cwRibbonIconBtn" title="Select"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16v16H4V4zm4 4h8v8H8V8z"/></svg></button>

        </div>
    </div>

</div>













    <div class="cwRibbonPanel" data-panel="insert"></div>
    <div class="cwRibbonPanel" data-panel="page-layout"></div>
    <div class="cwRibbonPanel" data-panel="references"></div>
    <div class="cwRibbonPanel" data-panel="mailings"></div>
    <div class="cwRibbonPanel" data-panel="review"></div>
    <div class="cwRibbonPanel" data-panel="view"></div>
    <div class="cwRibbonPanel" data-panel="format"></div>

</div>






    <!-- =====================================================
        WORKSPACE (WORD EDITING AREA)
    ====================================================== -->
    <div id="cwWorkspace">

        <div id="cwWorkspaceShell">

            <!-- RULERS (EMPTY STRUCTURE - JS/CSS WILL RENDER VISUALS) -->
            <div id="cwRulerTop"></div>
            <div id="cwRulerLeft"></div>

            <!-- SCROLL AREA -->
            <div id="cwWorkspaceScroll">

                <!-- DOCUMENT CONTAINER (JS WILL CREATE PAGES HERE) -->
                <div id="cwDocumentContainer"></div>

            </div>

            <!-- FLOATING UI LAYER -->
            <div id="cwFloatingLayer">

                <div id="cwSelectionBox"></div>
                <div id="cwTooltip"></div>

            </div>

        </div>

    </div>

</div>




<!-- =========================================================
    STATUS BAR
========================================================= -->
<div id="cwStatusBar">

    <!-- LEFT -->
    <div id="cwStatusLeft">

        <span id="cwStatusReady">Ready</span>

        <span class="cwStatusSeparator">|</span>

        <span id="cwWordCount">
            Words:
            <span id="cwWordCountValue">0</span>
        </span>

        <span class="cwStatusSeparator">|</span>

        <span id="cwLanguage">
            English
        </span>

    </div>


    <!-- CENTER -->
    <div id="cwStatusCenter">

        <span id="cwCurrentPageLabel">Page</span>

        <span id="cwCurrentPage">1</span>

        <span id="cwPageSeparator">of</span>

        <span id="cwTotalPages">1</span>

    </div>


    <!-- RIGHT -->
    <div id="cwStatusRight">

        <!-- VIEW MODES -->
        <div id="cwViewModes">

            <button
                id="cwPrintLayoutBtn"
                class="cwViewBtn"
                title="Print Layout">
                📄
            </button>

            <button
                id="cwWebLayoutBtn"
                class="cwViewBtn"
                title="Web Layout">
                🌐
            </button>

            <button
                id="cwDraftViewBtn"
                class="cwViewBtn"
                title="Draft View">
                📝
            </button>

        </div>

        <span class="cwStatusSeparator">|</span>

        <!-- ZOOM -->
        <div id="cwZoomControls">

            <button
                id="cwZoomOut"
                class="cwZoomBtn"
                title="Zoom Out">
                −
            </button>

            <div id="cwZoomSlider">

                <div id="cwZoomTrack">

                    <div id="cwZoomProgress"></div>

                    <div id="cwZoomThumb"></div>

                </div>

            </div>

            <button
                id="cwZoomIn"
                class="cwZoomBtn"
                title="Zoom In">
                +
            </button>

            <span id="cwZoomValue">
                100%
            </span>

        </div>

    </div>

</div>









<!-- =========================================================
    SYSTEM OVERLAYS (JS CONTROLLED LATER)
========================================================= -->
<div id="cwDialogLayer"></div>

<div id="cwContextMenu" class="hidden"></div>

<div id="cwSystemLayer" style="display:none;">
    <div id="cwClipboardBuffer"></div>
    <div id="cwSelectionState"></div>
    <div id="cwRuntimeCache"></div>
</div>

<!-- JS (EMPTY FOR NOW, YOU SAID YOU START FROM SCRATCH) -->
<script src="campusword2007simulation.js"></script>

</body>
</html>
