
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ExpressFOBAS</title>

<link rel="stylesheet" href="expressfobas.css">

</head>

<body>

<div class="container">

<h1 class="title">ExpressFOBAS Transfer</h1>

<form id="expressForm">

<!-- ==================== AGENT ==================== -->

<div class="card">

<h2>Agent Autorisé FOBAS</h2>

<div class="form-group">
<label>Nom & Prenom</label>
<input id="agentName" type="text" required>
</div>

<div class="form-group">
<label>Email</label>
<input id="agentEmail" type="email" required>
</div>

</div>

<!-- ==================== EXPEDITEUR ==================== -->

<div class="card">

<h2>Expéditeur</h2>

<div class="form-group">
<label>Nom & Prenom</label>
<input id="senderName" type="text" required>
</div>

<div class="form-group">
<label>CIN / NIF / Passport</label>
<input id="senderId" type="text" required>
</div>

<div class="form-group">
<label>Pays d'origine</label>
<input id="senderCountry" type="text" required>
</div>

<div class="form-group">
<label>Ville / Departement</label>
<input id="senderCity" type="text" required>
</div>

<div class="form-group">
<label>Adresse complète</label>
<input id="senderAddress" type="text" required>
</div>

<div class="form-group">
<label>Whatsapp</label>
<input id="senderWhatsapp" type="text" required>
</div>

</div>

<!-- ==================== BENEFICIAIRE ==================== -->

<div class="card">

<h2>Bénéficiaire</h2>

<div class="form-group">
<label>Nom & Prenom</label>
<input id="receiverName" type="text" required>
</div>

<div class="form-group">
<label>Pays</label>
<input id="receiverCountry" type="text" value="Haiti" required>
</div>

<div class="form-group">
<label>Ville</label>
<input id="receiverCity" type="text" required>
</div>

<div class="form-group">
<label>Adresse complète</label>
<input id="receiverAddress" type="text" required>
</div>

<div class="form-group">
<label>Whatsapp</label>
<input id="receiverWhatsapp" type="text" required>
</div>

</div>

<!-- ==================== DETAILS EXPRESSFOBAS ==================== -->

<div class="card">

<h2>Détails ExpressFOBAS</h2>

<div class="form-group">
<label>Montant Express (HTG)</label>
<input id="amountHTG" type="number" required>
</div>

<div class="form-group">
<label>Code unique</label>
<input id="transferCode" type="text" readonly placeholder="Généré automatiquement">
</div>

<div class="form-group">
<label>Statut</label>
<input id="status" type="text" value="Pending" readonly>
</div>

<div class="form-group">
<label>Date du jour</label>
<input id="createdDate" type="text" readonly>
</div>

<div class="form-group">
<label>Date d'expiration</label>
<input id="expirationDate" type="text" readonly>
</div>

</div>

<!-- ==================== RESULTAT ==================== -->

<div class="result-box" id="transferResult"></div>


<input id="transferCode">


<!-- ==================== BOUTONS ==================== -->

<div class="button-group">

<!-- Bouton Back -->
<a href="https://www.fondationbackupspirituel.com/walletfobasdashboard.html">
  <button type="button" id="backBtn" class="btn-back">
    Back
  </button>
</a>

<button type="submit" id="expressBtn" class="btn-express">
ExpressFOBAS
</button>

<button type="button" id="retraitBtn" class="btn-retrait">
ExpressRetrait
</button>

</div>

</form>

</div>

<script src="expressfobas.js"></script>

</body>

</html>
