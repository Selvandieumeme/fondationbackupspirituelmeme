<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💬 Chat Spirituel Mondyal</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0057b7, #f7d600, #ffffff);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 95%;
      max-width: 500px;
      height: 85vh;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    header {
      background: #0057b7;
      color: #fff;
      text-align: center;
      padding: 18px;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #messages {
      flex: 1;
      padding: 12px;
      margin: 0;
      list-style: none;
      overflow-y: auto;
      background: #f4f6f9;
      scroll-behavior: smooth;
    }

    #messages li {
      display: inline-block;
      clear: both;
      background: #f7d600;
      color: #000;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 80%;
      word-wrap: break-word;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #messages li.me {
      background: #0057b7;
      color: #fff;
      align-self: flex-end;
      float: right;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      border-top: 2px solid #0057b7;
      padding: 10px;
      background: #fff;
    }

    .input-top {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .input-top input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-top input:focus {
      border-color: #0057b7;
    }

    .input-bottom {
      display: flex;
      gap: 8px;
    }

    #msg {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    #send {
      background: #0057b7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #send:hover {
      background: #f7d600;
      color: #000;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      header { font-size: 1.1rem; }
      #send { padding: 10px 15px; }
      .chat-wrapper { height: 90vh; }
    }

    @media (max-width: 400px) {
      .chat-wrapper { width: 98%; height: 95vh; }
      #msg, #user { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <header>💬 Chat Spirituel Mondyal</header>
    <ul id="messages"></ul>
    <div class="input-area">
      <div class="input-top">
        <input id="user" placeholder="Antre non ou (opsyonèl)..." />
      </div>
      <div class="input-bottom">
        <input id="msg" placeholder="Ekri mesaj ou..." />
        <button id="send">📨 Voye</button>
      </div>
    </div>
  </div>





<script>
const socket = io('https://examen-backend-ihlx.onrender.com');
const sendBtn = document.getElementById('send');
const msgInput = document.getElementById('msg');
const userInput = document.getElementById('user');
const messages = document.getElementById('messages');

// Fè server konnen non itilizatè a pou panel endepandan
function registerUser() {
  const user = userInput.value.trim() || 'Anonyme';
  socket.emit('setUsername', user); // voye non itilizatè a
  socket.emit('userConnected', user); // evènman imedyat pou tout panel
}

// Fonkksyon pou ajoute mesaj nan lis la ak dat
function addMessage(data, isMe = false) {
  if (!data || !data.message) return;
  const li = document.createElement('li');
  const user = data.user || 'Anonyme';
  const message = data.message || '';
  const dateObj = new Date(data.date || Date.now());
  const hours = dateObj.getHours().toString().padStart(2,'0');
  const minutes = dateObj.getMinutes().toString().padStart(2,'0');
  const day = dateObj.getDate().toString().padStart(2,'0');
  const month = (dateObj.getMonth()+1).toString().padStart(2,'0');
  const year = dateObj.getFullYear();
  li.textContent = `${user} [${day}/${month}/${year} ${hours}:${minutes}]: ${message}`;
  if (isMe) li.classList.add('me');
  messages.appendChild(li);
  messages.scrollTop = messages.scrollHeight;
  li.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

// Voye mesaj lè itilizatè klike oswa tape Enter
sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

function sendMessage() {
  const user = userInput.value.trim() || 'Anonyme';
  const message = msgInput.value.trim();
  if (!message) return;

  // Enregistre itilizatè a si li poko fè sa
  registerUser();

  const data = { user, message, date: new Date() };
  socket.emit('chatMessage', data);
  addMessage(data, true);
  msgInput.value = '';
}

// Resevwa nouvo mesaj nan mond lan
socket.on('chatMessage', (data) => {
  const currentUser = userInput.value.trim() || 'Anonyme';
  if (data.user === currentUser && new Date(data.date).getTime() === new Date().getTime()) return;
  addMessage(data);
});

// Chaje mesaj ki deja nan DB lè nouvo itilizatè konekte
socket.on('loadMessages', (messagesArray) => {
  if (!Array.isArray(messagesArray)) return;
  messagesArray.forEach(msg => {
    const currentUser = userInput.value.trim() || 'Anonyme';
    const isMe = msg.user === currentUser;
    addMessage(msg, isMe);
  });
});
</script>

<script>
(function(){
  const ID = 'fbsp-user-panel-realtime';
  if (document.getElementById(ID)) return;

  // kreye panel
  const panel = document.createElement('aside');
  panel.id = ID;
  panel.style.position = 'fixed';
  panel.style.right = '14px';
  panel.style.top = '14px';
  panel.style.width = '260px';
  panel.style.maxHeight = '72vh';
  panel.style.background = '#fff';
  panel.style.border = '1px solid #ccc';
  panel.style.borderRadius = '8px';
  panel.style.padding = '10px';
  panel.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
  panel.style.fontFamily = 'Arial, sans-serif';
  panel.style.zIndex = '999999';
  panel.innerHTML = `
    <div style="font-weight:600; margin-bottom:6px;">👥 Itilizatè</div>
    <ul id="fbsp-users-list" style="list-style:none; padding:0; margin:0; max-height:60vh; overflow:auto;"></ul>
  `;
  document.body.appendChild(panel);

  const usersEl = document.getElementById('fbsp-users-list');
  let users = new Map(); // user -> online state

  // konekte socket
  let sock;
  try { sock = (typeof io === 'function') ? io() : null; } catch(e){ sock = null; }
  if(!sock) try { sock = io(window.location.origin); } catch(e){ usersEl.innerHTML = '<li>Socket.io pa disponib</li>'; return; }

  // fonksyon pou mete ajou lis la
  function renderUsers() {
    usersEl.innerHTML = '';
    users.forEach((online, user) => {
      const li = document.createElement('li');
      li.textContent = user;
      li.style.color = online ? '#24c36a' : '#ff4757'; // vèt = konekte, wouj = dekonekte
      li.style.padding = '4px 6px';
      li.style.borderBottom = '1px solid #eee';
      li.style.borderRadius = '4px';
      li.style.marginBottom = '2px';
      usersEl.appendChild(li);
    });
  }

  // evènman lè yon itilizatè konekte
  sock.on('userConnected', (user) => {
    if(!user) return;
    users.set(user, true);
    renderUsers();
  });

  // evènman lè yon itilizatè dekonekte
  sock.on('userDisconnected', (user) => {
    if(!user) return;
    if(users.has(user)) users.set(user, false);
    renderUsers();
  });

  // chak fwa itilizatè voye mesaj premye fwa, voye li tounen kòm konekte
  const sendBtn = document.getElementById('send');
  const msgInput = document.getElementById('msg');
  const userInput = document.getElementById('user');

  function notifyUser() {
    const user = userInput.value.trim() || 'Anonyme';
    sock.emit('setUser', user); // evènman pou fè server konnen itilizatè konekte
    users.set(user, true);
    renderUsers();
  }

  sendBtn.addEventListener('click', notifyUser);
  msgInput.addEventListener('keypress', e => {
    if(e.key === 'Enter') notifyUser();
  });

})();
</script>
<!-- ===========================
     END REAL-TIME USER LIST PANEL
     =========================== -->


  
  
</body>
</html>
