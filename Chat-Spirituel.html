<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💬 Chat Spirituel Mondyal</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0057b7, #f7d600, #ffffff);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 95%;
      max-width: 500px;
      height: 85vh;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    header {
      background: #0057b7;
      color: #fff;
      text-align: center;
      padding: 18px;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #messages {
      flex: 1;
      padding: 12px;
      margin: 0;
      list-style: none;
      overflow-y: auto;
      background: #f4f6f9;
      scroll-behavior: smooth;
    }

    #messages li {
      display: inline-block;
      clear: both;
      background: #f7d600;
      color: #000;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 80%;
      word-wrap: break-word;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #messages li.me {
      background: #0057b7;
      color: #fff;
      align-self: flex-end;
      float: right;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      border-top: 2px solid #0057b7;
      padding: 10px;
      background: #fff;
    }

    .input-top {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .input-top input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-top input:focus {
      border-color: #0057b7;
    }

    .input-bottom {
      display: flex;
      gap: 8px;
    }

    #msg {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    #send {
      background: #0057b7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #send:hover {
      background: #f7d600;
      color: #000;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      header { font-size: 1.1rem; }
      #send { padding: 10px 15px; }
      .chat-wrapper { height: 90vh; }
    }

    @media (max-width: 400px) {
      .chat-wrapper { width: 98%; height: 95vh; }
      #msg, #user { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <header>💬 Chat Spirituel Mondyal</header>
    <ul id="messages"></ul>
    <div class="input-area">
      <div class="input-top">
        <input id="user" placeholder="Antre non ou (opsyonèl)..." />
      </div>
      <div class="input-bottom">
        <input id="msg" placeholder="Ekri mesaj ou..." />
        <button id="send">📨 Voye</button>
      </div>
    </div>
  </div>


  <div id="userListPanel">
  <h3>Itilizatè konekte yo</h3>
  <ul id="userList"></ul>
</div>






  
<script>
/* Chat script (korije) */
const socket = io('https://examen-backend-ihlx.onrender.com');
// expose shared socket pou panèl endepandan (rekipere olye kreye nouvo koneksyon)
window.__fbsp_shared_socket = socket;

const sendBtn = document.getElementById('send');
const msgInput = document.getElementById('msg');
const userInput = document.getElementById('user');
const messages = document.getElementById('messages');

// Fè server konnen non itilizatè a pou panel endepandan
function registerUser() {
  const user = userInput.value.trim() || 'Anonyme';
  // Voye non itilizatè a bay server pou panel lis itilizatè (se sèl evènman sa a nou emèt)
  socket.emit('setUser', user);
}

// Fonkksyon pou ajoute mesaj nan lis la ak dat
function addMessage(data, isMe = false) {
  if (!data || !data.message) return;
  const li = document.createElement('li');
  const user = data.user || 'Anonyme';
  const message = data.message || '';
  const dateObj = new Date(data.date || Date.now());
  const hours = dateObj.getHours().toString().padStart(2,'0');
  const minutes = dateObj.getMinutes().toString().padStart(2,'0');
  const day = dateObj.getDate().toString().padStart(2,'0');
  const month = (dateObj.getMonth()+1).toString().padStart(2,'0');
  const year = dateObj.getFullYear();
  li.textContent = `${user} [${day}/${month}/${year} ${hours}:${minutes}]: ${message}`;
  if (isMe) li.classList.add('me');
  messages.appendChild(li);
  messages.scrollTop = messages.scrollHeight;
  li.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

// --- REGISTER GLOBAL HANDLERS ONCE ---
// resevwa nouvo mesaj soti nan server (do not attach inside click)
socket.on('chatMessage', (data) => {
  // pa teste new Date(...).getTime() === new Date().getTime() paske sa p ap matche atravè machin
  // nou baze sou serve a pou pa double emisyon; men si lokal nou deja ajoute (isMe true) moun ap wè li tou.
  addMessage(data);
});

// chaje mesaj ki deja nan DB lè nouvo itilizatè konekte
socket.on('loadMessages', (messagesArray) => {
  if (!Array.isArray(messagesArray)) return;
  messagesArray.forEach(msg => {
    const currentUser = (userInput && userInput.value) ? userInput.value.trim() : 'Anonyme';
    const isMe = msg.user === currentUser;
    addMessage(msg, isMe);
  });
});

// --- SEND MESSAGE LOGIC ---
sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

function sendMessage() {
  const user = userInput.value.trim() || 'Anonyme';
  const message = msgInput.value.trim();
  if (!message) return;

  // Anrejistre itilizatè a (voye setUser) pou asire server gen non li
  registerUser();

  const data = { user, message, date: new Date() };
  socket.emit('chatMessage', data);
  // Afichaj lokal la rapid (server ap re-emit tou pou tout lòt kliyan)
  addMessage(data, true);
  msgInput.value = '';
}
</script>







<!-- REAL-TIME USER LIST PANEL (FINAL STABLE) -->
<script>
(function(){
  const ID = 'fbsp-user-panel-realtime';
  if (document.getElementById(ID)) return;

  // --- Panel UI ---
  const panel = document.createElement('aside');
  panel.id = ID;
  panel.style.position = 'fixed';
  panel.style.right = '14px';
  panel.style.top = '14px';
  panel.style.width = '260px';
  panel.style.maxHeight = '72vh';
  panel.style.background = '#fff';
  panel.style.border = '1px solid #ccc';
  panel.style.borderRadius = '8px';
  panel.style.padding = '10px';
  panel.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
  panel.style.fontFamily = 'Arial, sans-serif';
  panel.style.zIndex = '999999';
  panel.style.overflow = 'auto';
  panel.innerHTML = `
    <div style="font-weight:600; margin-bottom:6px;">👥 Itilizatè konekte</div>
    <div style="font-size:12px;margin-bottom:8px;">Vèt = sou entènèt / Wouj = dekonekte</div>
    <ul id="fbsp-users-list" style="list-style:none; padding:0; margin:0; max-height:60vh; overflow:auto;"></ul>
  `;
  document.body.appendChild(panel);

  const usersEl = document.getElementById('fbsp-users-list');
  const users = new Map();

  // --- Reuse socket prensipal la ---
  const sock = (typeof socket !== 'undefined') ? socket : io(window.location.origin);

  // --- Fonksyon afichaj ---
  function renderUsers() {
    usersEl.innerHTML = '';
    const sorted = Array.from(users.entries()).sort((a,b)=>{
      if (a[1] === b[1]) return a[0].localeCompare(b[0]);
      return a[1] ? -1 : 1;
    });
    sorted.forEach(([name, online])=>{
      const li = document.createElement('li');
      li.style.display = 'flex';
      li.style.alignItems = 'center';
      li.style.justifyContent = 'space-between';
      li.style.padding = '6px';
      li.style.borderBottom = '1px solid #eee';
      li.style.borderRadius = '4px';
      li.style.marginBottom = '2px';

      const spanName = document.createElement('span');
      spanName.textContent = name;
      spanName.style.overflow = 'hidden';
      spanName.style.textOverflow = 'ellipsis';
      spanName.style.whiteSpace = 'nowrap';

      const dot = document.createElement('span');
      dot.style.width = '10px';
      dot.style.height = '10px';
      dot.style.borderRadius = '50%';
      dot.style.display = 'inline-block';
      dot.style.marginLeft = '8px';
      dot.style.background = online ? '#24c36a' : '#ff4757';

      li.appendChild(spanName);
      li.appendChild(dot);
      usersEl.appendChild(li);
    });
  }

  // --- Fonksyon senkronizasyon ---
  function setFullList(arr) {
    users.clear();
    arr.forEach(u => users.set(u, true));
    renderUsers();
  }

  function setOnline(name, online) {
    if (!name) return;
    users.set(name, !!online);
    renderUsers();
  }

  // --- Evènman socket yo ---
  sock.on('updateUserList', (arr) => {
    if (!Array.isArray(arr)) return;
    setFullList(arr);
  });

  sock.on('userConnected', (name) => {
    setOnline(name, true);
  });

  sock.on('userDisconnected', (name) => {
    setOnline(name, false);
  });

  sock.on('connect', () => {
    sock.emit('requestUserList'); // mande lis aktyèl la imedyatman
  });

})();
</script>
<!-- END REAL-TIME USER LIST PANEL -->


  
  
</body>
</html>
