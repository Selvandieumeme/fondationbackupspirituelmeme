<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💬 Chat Spirituel Mondyal</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0057b7, #f7d600, #ffffff);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 95%;
      max-width: 500px;
      height: 85vh;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    header {
      background: #0057b7;
      color: #fff;
      text-align: center;
      padding: 18px;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #messages {
      flex: 1;
      padding: 12px;
      margin: 0;
      list-style: none;
      overflow-y: auto;
      background: #f4f6f9;
      scroll-behavior: smooth;
    }

    #messages li {
      display: inline-block;
      clear: both;
      background: #f7d600;
      color: #000;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 80%;
      word-wrap: break-word;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #messages li.me {
      background: #0057b7;
      color: #fff;
      align-self: flex-end;
      float: right;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      border-top: 2px solid #0057b7;
      padding: 10px;
      background: #fff;
    }

    .input-top {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .input-top input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-top input:focus {
      border-color: #0057b7;
    }

    .input-bottom {
      display: flex;
      gap: 8px;
    }

    #msg {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    #send {
      background: #0057b7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #send:hover {
      background: #f7d600;
      color: #000;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      header { font-size: 1.1rem; }
      #send { padding: 10px 15px; }
      .chat-wrapper { height: 90vh; }
    }

    @media (max-width: 400px) {
      .chat-wrapper { width: 98%; height: 95vh; }
      #msg, #user { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <header>💬 Chat Spirituel Mondyal</header>
    <ul id="messages"></ul>
    <div class="input-area">
      <div class="input-top">
        <input id="user" placeholder="Antre non ou (opsyonèl)..." />
      </div>
      <div class="input-bottom">
        <input id="msg" placeholder="Ekri mesaj ou..." />
        <button id="send">📨 Voye</button>
      </div>
    </div>
  </div>





<!-- Overlay pou antre non itilizatè a -->
<div id="loginOverlay" style="
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: white;
  z-index: 1000;
">
  <h2>👋 Bienvenue dans le Chat Fondation Backup Spirituel Mondial</h2>
  <p>Antre non ou (nickname) pou kontinye:</p>
  <input type="text" id="usernameInput" placeholder="Antre non ou..." style="padding:10px; border:none; border-radius:5px; width:60%; max-width:300px;">
  <button id="enterChatBtn" style="margin-top:10px; padding:10px 20px; border:none; border-radius:5px; background:#00aaff; color:white; cursor:pointer;">
    Antre nan Chat
  </button>
</div>



  
<script>
  const loginOverlay = document.getElementById('loginOverlay');
  const enterChatBtn = document.getElementById('enterChatBtn');
  const usernameInput = document.getElementById('usernameInput');
  const userInput = document.getElementById('user'); // input chat deja egziste

  const socket = io('https://examen-backend-ihlx.onrender.com');

  // --- Set pou evite mesaj double ---
  const displayedMessages = new Set();

  // --- Bouton Antre nan chat (yon sèl listener) ---
  enterChatBtn.addEventListener('click', () => {
    const username = usernameInput.value.trim() || 'Anonyme';
    localStorage.setItem('chatUsername', username);
    userInput.value = username;
    loginOverlay.style.display = 'none';

    // Voye non itilizatè a bay sèvè a pou kadran lis itilizatè
    socket.emit('setUsername', username);
  });

  usernameInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') enterChatBtn.click();
  });

  // --- Fonksyon pou ajoute mesaj nan chat ---
  function addMessage(data, isMe = false) {
    if (!data || !data.message) return;
    const msgId = `${data.user}-${data.date}-${data.message}`;
    if (displayedMessages.has(msgId)) return;
    displayedMessages.add(msgId);

    const li = document.createElement('li');
    const user = data.user || 'Anonyme';
    const message = data.message || '';
    const dateObj = new Date(data.date || Date.now());
    const hours = dateObj.getHours().toString().padStart(2,'0');
    const minutes = dateObj.getMinutes().toString().padStart(2,'0');
    const day = dateObj.getDate().toString().padStart(2,'0');
    const month = (dateObj.getMonth()+1).toString().padStart(2,'0');
    const year = dateObj.getFullYear();
    li.textContent = `${user} [${day}/${month}/${year} ${hours}:${minutes}]: ${message}`;
    if (isMe) li.classList.add('me');
    messages.appendChild(li);
    messages.scrollTop = messages.scrollHeight;
    li.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  const sendBtn = document.getElementById('send');
  const msgInput = document.getElementById('msg');
  const messages = document.getElementById('messages');

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keypress', (e) => { if(e.key==='Enter') sendMessage(); });

  function sendMessage() {
    const user = localStorage.getItem('chatUsername') || 'Anonyme';
    const message = msgInput.value.trim();
    if (!message) return;

    const data = { user, message, date: new Date() };
    socket.emit('chatMessage', data);
    addMessage(data, true);
    msgInput.value = '';
  }

  socket.on('chatMessage', (data) => {
    addMessage(data);
  });

  socket.on('loadMessages', (messagesArray) => {
    if(!Array.isArray(messagesArray)) return;
    messagesArray.forEach(msg => {
      const currentUser = localStorage.getItem('chatUsername') || 'Anonyme';
      const isMe = msg.user === currentUser;
      addMessage(msg, isMe);
    });
  });

  // --- Lis itilizatè konekte yo ---
  const usersList = document.getElementById('usersList');
  socket.on('updateUserList', (users) => {
    if (!Array.isArray(users)) return;
    usersList.innerHTML = '';
    users.forEach(u => {
      const li = document.createElement('li');
      li.style.padding = '4px 0';
      li.style.borderBottom = '1px solid #ddd';
      li.textContent = `• ${u}`;
      usersList.appendChild(li);
    });
  });
</script>




<!-- ================== KADRAN ITILIZATÈ ================== -->
<div id="userStatusPanel" style="
  position: fixed;
  top: 10px;
  right: 10px;
  width: 220px;
  max-height: 300px;
  background: rgba(255,255,255,0.95);
  border-radius: 10px;
  padding: 10px;
  overflow-y: auto;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  font-size: 14px;
  z-index: 9999;
">
  <h4 style="margin-top:0; text-align:center;">👥 Itilizatè aktif</h4>
  <ul id="userStatusList" style="list-style:none; padding:0; margin:0;"></ul>
</div>

<script>
(function() {
  const userStatusList = document.getElementById('userStatusList');

  function updateList(users) {
    if (!Array.isArray(users)) return;
    userStatusList.innerHTML = '';
    users.forEach(u => {
      const li = document.createElement('li');
      li.textContent = '• ' + u;
      li.style.padding = '4px 0';
      li.style.borderBottom = '1px solid #ddd';
      userStatusList.appendChild(li);
    });
  }

  // --- Nouvo itilizatè konekte ---
  socket.on('userConnected', (username) => {
    const li = document.createElement('li');
    li.textContent = `👤 ${username} konekte`;
    li.style.color = 'green';
    li.style.padding = '2px 0';
    userStatusList.appendChild(li);
    userStatusList.scrollTop = userStatusList.scrollHeight;
  });

  // --- Itilizatè dekonekte ---
  socket.on('userDisconnected', (username) => {
    const li = document.createElement('li');
    li.textContent = `🔴 ${username} dekonekte`;
    li.style.color = 'red';
    li.style.padding = '2px 0';
    userStatusList.appendChild(li);
    userStatusList.scrollTop = userStatusList.scrollHeight;
  });

  // --- Rafrechi lis itilizatè konekte total ---
  socket.on('updateUserList', (users) => {
    updateList(users);
  });
})();
</script>
  
</body>
</html>
