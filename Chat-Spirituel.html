<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💬 Chat Spirituel Mondyal</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Chatprivate.css">
  <style>
    * { box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0057b7, #f7d600, #ffffff);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 95%;
      max-width: 500px;
      height: 85vh;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    header {
      background: #0057b7;
      color: #fff;
      text-align: center;
      padding: 18px;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #messages {
      flex: 1;
      padding: 12px;
      margin: 0;
      list-style: none;
      overflow-y: auto;
      background: #f4f6f9;
      scroll-behavior: smooth;
    }

    #messages li {
      display: inline-block;
      clear: both;
      background: #f7d600;
      color: #000;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 80%;
      word-wrap: break-word;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #messages li.me {
      background: #0057b7;
      color: #fff;
      align-self: flex-end;
      float: right;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      border-top: 2px solid #0057b7;
      padding: 10px;
      background: #fff;
    }

    .input-top {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .input-top input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-top input:focus {
      border-color: #0057b7;
    }

    .input-bottom {
      display: flex;
      gap: 8px;
    }

    #msg {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    #send {
      background: #0057b7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #send:hover {
      background: #f7d600;
      color: #000;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      header { font-size: 1.1rem; }
      #send { padding: 10px 15px; }
      .chat-wrapper { height: 90vh; }
    }

    @media (max-width: 400px) {
      .chat-wrapper { width: 98%; height: 95vh; }
      #msg, #user { font-size: 0.9rem; }
    }



    

   /* Ti kadran online panel la fikse sou bò dwat chat la */
#onlinePanel {
    position: absolute;      /* Fè l pa depann de layout prensipal la */
    right: 10px;             /* Kole sou bò dwat */
    top: 10px;               /* Ou ka mete 60px si gen navbar oswa header */
    width: 200px;            /* Lajè ti kadran an */
    background: #f8f9fa;
    border-radius: 12px;
    box-shadow: 0 0 8px rgba(0,0,0,0.1);
    padding: 10px;
    max-height: 400px;
    overflow-y: auto;
    z-index: 999;            /* Pou li toujou parèt devan tout lòt eleman */
}

/* Tit "Online Users" oswa h3 anndan panel la */
#onlinePanel h3 {
    margin-top: 0;
    text-align: center;
    color: #0d6efd;
}

/* Lis itilizatè yo anndan panel la */
#userList li {
    list-style: none;
    padding: 5px;
    margin: 3px 0;
    background: #e0f0ff;
    border-radius: 8px;
    text-align: center;
}
    
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <header>💬 Chat Spirituel Mondyal</header>
    <ul id="messages"></ul>
    <div class="input-area">
      <div class="input-top">
        <input id="user" placeholder="Antre non ou (opsyonèl)..." />
      </div>
      <div class="input-bottom">
        <input id="msg" placeholder="Ekri mesaj ou..." />
        <button id="send">📨 Voye</button>
      </div>
    </div>
  </div>




  <!-- ✅ Ti kadran pou lis itilizatè yo -->
  <div id="onlinePanel">
    <h3>Itilizatè konekte</h3>
    <ul id="userList"></ul>
  </div>
</div>





  
<style>
  /* ✅ Ti stil pou ti panel itilizatè yo sou bò dwat */
  #userList {
    list-style: none;
    margin: 0;
    padding: 8px;
    max-height: 250px;
    overflow-y: auto;
    background: #f8f9fa;
    border-radius: 8px;
    box-shadow: 0 0 6px rgba(0,0,0,0.1);
  }
  #userList li {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .online { background-color: #2ecc71; }  /* 🟢 */
  .offline { background-color: #e74c3c; } /* 🔴 */
</style>

<script>
/* =====================================================
   ✅ CHAT SCRIPT FINAL KOREKTE + ONLINE USERS PANEL
   ===================================================== */

// 1️⃣ — Yon sèl koneksyon socket pou tout paj la
const socket = window.__fbsp_shared_socket || io('https://examen-backend-ihlx.onrender.com');
window.__fbsp_shared_socket = socket;

// 2️⃣ — Seleksyon eleman HTML prensipal yo
const sendBtn = document.getElementById('send');
const msgInput = document.getElementById('msg');
const userInput = document.getElementById('user');
const messages = document.getElementById('messages');
const userList = document.getElementById('userList'); // <- ti panel a

// 3️⃣ — Fonksyon pou anrejistre itilizatè a
function registerUser() {
  const user = userInput?.value.trim() || 'Anonyme';
  socket.emit('setUser', user);
  return user;
}

// 4️⃣ — Fonksyon pou ajoute mesaj nan chat
function addMessage(data, isMe = false) {
  if (!data || !data.message) return;
  const li = document.createElement('li');
  const user = data.user || 'Anonyme';
  const message = data.message || '';
  const dateObj = new Date(data.date || Date.now());
  const h = dateObj.getHours().toString().padStart(2, '0');
  const m = dateObj.getMinutes().toString().padStart(2, '0');
  const d = dateObj.getDate().toString().padStart(2, '0');
  const mo = (dateObj.getMonth() + 1).toString().padStart(2, '0');
  const y = dateObj.getFullYear();

  li.textContent = `${user} [${d}/${mo}/${y} ${h}:${m}]: ${message}`;
  if (isMe) li.classList.add('me');

  messages.appendChild(li);
  li.scrollIntoView({ behavior: 'smooth', block: 'end' });
  messages.scrollTop = messages.scrollHeight;
}

// 5️⃣ — Resevwa mesaj yo
socket.on('chatMessage', (data) => {
  addMessage(data);
});

// 6️⃣ — Resevwa tout ansyen mesaj
socket.on('loadMessages', (messagesArray) => {
  if (!Array.isArray(messagesArray)) return;
  const currentUser = userInput?.value.trim() || 'Anonyme';
  messagesArray.forEach(msg => {
    const isMe = msg.user === currentUser;
    addMessage(msg, isMe);
  });
});

// 7️⃣ — Fonksyon pou voye mesaj
function sendMessage() {
  const user = registerUser();
  const message = msgInput.value.trim();
  if (!message) return;

  const data = { user, message, date: new Date() };
  socket.emit('chatMessage', data);
  addMessage(data, true);
  msgInput.value = '';
}

// 8️⃣ — Bouton & Enter
sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

// ✅✅ ✅ TI PANEL ITILIZATÈ ONLINE YO

// 🟢 Resevwa lis itilizatè yo an tan reyèl
socket.on('online-users', (arr) => {
  if (!userList) return;
  userList.innerHTML = '';

  arr.forEach(user => {
    const li = document.createElement('li');
    const dot = document.createElement('span');
    dot.classList.add('status-dot');
    dot.classList.add(user.connected ? 'online' : 'offline');
    li.appendChild(dot);
    li.appendChild(document.createTextNode(user.name));
    userList.appendChild(li);
  });
});

// 🟢 Yon moun konekte
socket.on('userConnected', (name) => {
  console.log('🟢 Konekte:', name);
});

// 🔴 Yon moun dekonekte
socket.on('userDisconnected', (name) => {
  console.log('🔴 Dekonekte:', name);
});

// 📌 Mande lis itilizatè yo lè socket konekte
socket.on('connect', () => {
  const currentUser = userInput?.value.trim();
  if (currentUser) socket.emit('setUser', currentUser);
  socket.emit('requestUserList');
});
</script>



  
  <!-- Socket.io deja la -->
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

<!-- Chat script prensipal -->
<script src="script.js"></script>

<!-- Panel itilizatè yo -->
<script src="onlineUserPanel.js"></script>


  <script src="ChatPrive.js"></script>

  
</body>
</html>
