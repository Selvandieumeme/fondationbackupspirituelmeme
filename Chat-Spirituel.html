<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💬 Chat Spirituel Mondyal</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0057b7, #f7d600, #ffffff);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 95%;
      max-width: 500px;
      height: 85vh;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    header {
      background: #0057b7;
      color: #fff;
      text-align: center;
      padding: 18px;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #messages {
      flex: 1;
      padding: 12px;
      margin: 0;
      list-style: none;
      overflow-y: auto;
      background: #f4f6f9;
      scroll-behavior: smooth;
    }

    #messages li {
      display: inline-block;
      clear: both;
      background: #f7d600;
      color: #000;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 80%;
      word-wrap: break-word;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #messages li.me {
      background: #0057b7;
      color: #fff;
      align-self: flex-end;
      float: right;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      border-top: 2px solid #0057b7;
      padding: 10px;
      background: #fff;
    }

    .input-top {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .input-top input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-top input:focus {
      border-color: #0057b7;
    }

    .input-bottom {
      display: flex;
      gap: 8px;
    }

    #msg {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    #send {
      background: #0057b7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #send:hover {
      background: #f7d600;
      color: #000;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      header { font-size: 1.1rem; }
      #send { padding: 10px 15px; }
      .chat-wrapper { height: 90vh; }
    }

    @media (max-width: 400px) {
      .chat-wrapper { width: 98%; height: 95vh; }
      #msg, #user { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <header>💬 Chat Spirituel Mondyal</header>
    <ul id="messages"></ul>
    <div class="input-area">
      <div class="input-top">
        <input id="user" placeholder="Antre non ou (opsyonèl)..." />
      </div>
      <div class="input-bottom">
        <input id="msg" placeholder="Ekri mesaj ou..." />
        <button id="send">📨 Voye</button>
      </div>
    </div>
  </div>





<script>
const socket = io('https://examen-backend-ihlx.onrender.com');
const sendBtn = document.getElementById('send');
const msgInput = document.getElementById('msg');
const userInput = document.getElementById('user');
const messages = document.getElementById('messages');

// Fonkksyon pou ajoute mesaj nan lis la ak dat
function addMessage(data, isMe = false) {
  if (!data || !data.message) return; // evite mesaj vid
  const li = document.createElement('li');
  const user = data.user || 'Anonyme';
  const message = data.message || '';
  const dateObj = new Date(data.date || Date.now());
  const hours = dateObj.getHours().toString().padStart(2, '0');
  const minutes = dateObj.getMinutes().toString().padStart(2, '0');
  const day = dateObj.getDate().toString().padStart(2, '0');
  const month = (dateObj.getMonth() + 1).toString().padStart(2, '0');
  const year = dateObj.getFullYear();
  li.textContent = `${user} [${day}/${month}/${year} ${hours}:${minutes}]: ${message}`;
  if (isMe) li.classList.add('me');
  messages.appendChild(li);
  messages.scrollTop = messages.scrollHeight;
  li.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

// Voye mesaj lè itilizatè klike oswa tape Enter
sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

function sendMessage() {
  const user = userInput.value.trim() || 'Anonyme';
  const message = msgInput.value.trim();
  if (!message) return;
  const data = { user, message, date: new Date() };
  socket.emit('chatMessage', data);
  addMessage(data, true); // montre mesaj lokal la
  msgInput.value = '';
}

// Resevwa nouvo mesaj nan mond lan
socket.on('chatMessage', (data) => {
  const currentUser = userInput.value.trim() || 'Anonyme';
  if (data.user === currentUser && new Date(data.date).getTime() === new Date().getTime()) {
    return; // evite double mesaj lokal deja afiche
  }
  addMessage(data);
});

// Chaje mesaj ki deja nan DB lè nouvo itilizatè konekte
socket.on('loadMessages', (messagesArray) => {
  if (!Array.isArray(messagesArray)) return;
  messagesArray.forEach(msg => {
    const currentUser = userInput.value.trim() || 'Anonyme';
    const isMe = msg.user === currentUser;
    addMessage(msg, isMe);
  });
});
</script>

<script>
(function() {
  const ID = 'fbsp-user-panel-v3';
  if (document.getElementById(ID)) return;

  // Create panel
  const panel = document.createElement('aside');
  panel.id = ID;
  panel.innerHTML = `
    <div class="fbsp-head">
      <div class="fbsp-title">👥 Itilizatè</div>
      <div class="fbsp-actions">
        <button class="fbsp-refresh" title="Rafrechi lis">⟳</button>
        <button class="fbsp-close" title="Fèmen">—</button>
      </div>
    </div>
    <div class="fbsp-stats">Konekte: <span class="fbsp-count">0</span></div>
    <ul class="fbsp-users"></ul>
    <div class="fbsp-log" aria-live="polite"></div>
  `;

  // Style
  const style = document.createElement('style');
  style.textContent = `
    #${ID} { position: fixed; right: 14px; top: 14px; width: 260px; max-height: 72vh; display:flex; flex-direction:column; background:#fff; border-radius:12px; box-shadow:0 12px 40px rgba(2,10,30,0.18); border:1px solid rgba(0,0,0,0.05); font-family: "Poppins", sans-serif; color:#111; z-index:999999; overflow:hidden; }
    #${ID} .fbsp-head { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:linear-gradient(90deg,#f4f7ff,#fff); border-bottom:1px solid rgba(0,0,0,0.04); }
    #${ID} .fbsp-title { font-weight:600; font-size:14px; }
    #${ID} .fbsp-actions { display:flex; gap:6px; }
    #${ID} .fbsp-actions button { background:transparent; border:none; cursor:pointer; padding:6px; border-radius:6px; font-size:13px; }
    #${ID} .fbsp-stats { padding:8px 12px; font-size:13px; border-bottom:1px solid rgba(0,0,0,0.03); color:#333; }
    #${ID} .fbsp-users { list-style:none; margin:0; padding:8px 6px; overflow:auto; flex:1; }
    #${ID} .fbsp-users li { display:flex; align-items:center; gap:8px; padding:6px; border-radius:8px; margin-bottom:6px; font-size:13px; }
    #${ID} .fbsp-dot { width:10px; height:10px; border-radius:50%; flex:0 0 10px; box-shadow:0 0 6px rgba(0,0,0,0.06); }
    #${ID} .fbsp-online { background:#24c36a; }
    #${ID} .fbsp-offline { background:#ff4757; }
    #${ID} .fbsp-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #${ID} .fbsp-log { font-size:12px; color:#666; padding:8px 12px; border-top:1px solid rgba(0,0,0,0.03); max-height:88px; overflow:auto; background:rgba(250,250,250,0.6); }
    @media (max-width:640px) { #${ID} { right:8px; top:8px; width:210px; max-height:58vh; } }
  `;
  document.head.appendChild(style);
  document.body.appendChild(panel);

  // Refs
  const usersEl = panel.querySelector('.fbsp-users');
  const countEl = panel.querySelector('.fbsp-count');
  const logEl   = panel.querySelector('.fbsp-log');
  const refreshBtn = panel.querySelector('.fbsp-refresh');
  const closeBtn = panel.querySelector('.fbsp-close');

  // Local state
  let users = [];

  // Socket
  const socket = (typeof io === 'function') ? io() : io(window.location.origin);

  // Render helpers
  function renderUsers() {
    usersEl.innerHTML = '';
    users.forEach(u => {
      const li = document.createElement('li');
      const dot = document.createElement('span');
      dot.className = `fbsp-dot ${u.online ? 'fbsp-online' : 'fbsp-offline'}`;
      const name = document.createElement('span');
      name.className = 'fbsp-name';
      name.textContent = u.user;
      li.appendChild(dot);
      li.appendChild(name);
      usersEl.appendChild(li);
    });
    countEl.textContent = users.filter(u => u.online).length;
  }

  function addLog(text) {
    const d = document.createElement('div');
    d.textContent = `${new Date().toLocaleTimeString()}: ${text}`;
    logEl.prepend(d);
    while (logEl.children.length > 50) logEl.removeChild(logEl.lastChild);
  }

  // Handle server events
  socket.on('userConnected', (userName) => {
    if (!userName) return;
    const exist = users.find(u => u.user === userName);
    if (!exist) users.push({ user: userName, online: true });
    else exist.online = true;
    renderUsers();
    addLog(`👤 ${userName} konekte`);
  });

  socket.on('userDisconnected', (userName) => {
    const exist = users.find(u => u.user === userName);
    if (exist) {
      exist.online = false;
      renderUsers();
      addLog(`🔴 ${userName} dekonekte`);
    }
  });

  // Manual refresh
  refreshBtn.addEventListener('click', () => {
    socket.emit('requestUserList');
    addLog('Mande lis itilizatè nan sèvè...');
  });

  // Close/toggle panel
  let collapsed = false;
  closeBtn.addEventListener('click', () => {
    collapsed = !collapsed;
    panel.style.transform = collapsed ? 'translateX(120%)' : 'translateX(0)';
    panel.style.opacity = collapsed ? '0' : '1';
  });

  // On connect request current users
  socket.on('connect', () => {
    addLog('Panel konekte ak sèvè.');
    socket.emit('requestUserList');
  });

  // On full user list from server
  socket.on('updateUserList', (list) => {
    if (!Array.isArray(list)) return;
    users = list.map(u => ({ user: u, online: true }));
    renderUsers();
    addLog('Lis itilizatè mete ajou.');
  });

})();
</script>
