  <style>
    * { box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0057b7, #f7d600, #ffffff);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 95%;
      max-width: 500px;
      height: 85vh;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    header {
      background: #0057b7;
      color: #fff;
      text-align: center;
      padding: 18px;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #messages {
      flex: 1;
      padding: 12px;
      margin: 0;
      list-style: none;
      overflow-y: auto;
      background: #f4f6f9;
      scroll-behavior: smooth;
    }

    #messages li {
      display: inline-block;
      clear: both;
      background: #f7d600;
      color: #000;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 80%;
      word-wrap: break-word;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #messages li.me {
      background: #0057b7;
      color: #fff;
      align-self: flex-end;
      float: right;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      border-top: 2px solid #0057b7;
      padding: 10px;
      background: #fff;
    }

    .input-top {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .input-top input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-top input:focus {
      border-color: #0057b7;
    }

    .input-bottom {
      display: flex;
      gap: 8px;
    }

    #msg {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    #send {
      background: #0057b7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    #send:hover {
      background: #f7d600;
      color: #000;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      header { font-size: 1.1rem; }
      #send { padding: 10px 15px; }
      .chat-wrapper { height: 90vh; }
    }

    @media (max-width: 400px) {
      .chat-wrapper { width: 98%; height: 95vh; }
      #msg, #user { font-size: 0.9rem; }
    }



  /* Footer pou pozisyon bouton an */
.chat-footer {
  text-align: center;
  margin-top: 20px;
  padding-bottom: 15px;
}

/* Bouton Chat Premium */
.premium-button {

  background-color: #1e3a8a;        /* Ble fonse pwofesyonèl */

  font-weight: bold;
  padding: 12px 28px;
  text-decoration: none;

  transition: all 0.3s ease-in-out;
}

/* Efè hover pou fè bouton an vivan */
.premium-button:hover {
  background-color: #2563eb;        /* Ble pi klè */

  transform: scale(1.05);           /* Leve yon ti kras */

}




#chat-container {
  margin-bottom: 50px;  /* pou evite lyen an kole ak chat la */
}
    


.fobas-footer {
  width: 100%;
  background: rgba(0, 0, 0, 0.7); /* nwa transparan élégance */
  color: #fff;
  text-align: center;
  padding: 12px 0;
  font-size: 0.9rem;
  font-weight: 500;
  position: fixed;
  bottom: 0;
  left: 0;
  z-index: 1000;

<body>
  <div class="chat-wrapper">
    <header>💬 CHAT FOBAS PUBLIC</header>
    <ul id="messages"></ul>
    <div class="input-area">
      <div class="input-top">
        <input id="user" placeholder="Antre non ou (opsyonèl)..." />
      </div>
      <div class="input-bottom">
        <input id="msg" placeholder="Ekri mesaj ou..." />
        <button id="send">📨 Voye</button>
      </div>
    </div>
  </div>


  
<script>
/* =====================================================
   ✅ CHAT SCRIPT FINAL + ONLINE USERS PANEL + REDIRECT CHAT PRIVE
   - Panel bèl ak koulè (jaune, bleue, blanc)
   - Scroll lè >5 itilizatè
===================================================== */

const socket = window.__fbsp_shared_socket || io('https://examen-backend-ihlx.onrender.com');
window.__fbsp_shared_socket = socket;

const sendBtn = document.getElementById('send');
const msgInput = document.getElementById('msg');
const userInput = document.getElementById('user'); // kenbe user ak userId
const messages = document.getElementById('messages');
const userList = document.getElementById('userList');

// ---------------------------
// Fonksyon pou anrejistre itilizatè
// ---------------------------
function registerUser() {
  const user = userInput?.value.trim() || 'Anonyme';
  socket.emit('setUser', user);
  return user;
}

// ---------------------------
// Fonksyon pou ajoute mesaj nan chat
// ---------------------------
function addMessage(data, isMe = false) {
  if (!data || !data.message) return;
  const li = document.createElement('li');
  const user = data.user || 'Anonyme';
  const message = data.message || '';
  const dateObj = new Date(data.date || Date.now());
  const h = dateObj.getHours().toString().padStart(2, '0');
  const m = dateObj.getMinutes().toString().padStart(2, '0');
  const d = dateObj.getDate().toString().padStart(2, '0');
  const mo = (dateObj.getMonth() + 1).toString().padStart(2, '0');
  const y = dateObj.getFullYear();
  li.textContent = `${user} [${d}/${mo}/${y} ${h}:${m}]: ${message}`;
  if (isMe) li.classList.add('me');
  messages.appendChild(li);
  li.scrollIntoView({ behavior: 'smooth', block: 'end' });
  messages.scrollTop = messages.scrollHeight;
}

// ---------------------------
// Evènman chat
// ---------------------------
socket.on('chatMessage', (data) => addMessage(data));

socket.on('loadMessages', (messagesArray) => {
  if (!Array.isArray(messagesArray)) return;
  const currentUser = userInput?.value.trim() || 'Anonyme';
  messagesArray.forEach(msg => {
    const isMe = msg.user === currentUser;
    addMessage(msg, isMe);
  });
});

function sendMessage() {
  const user = registerUser();
  const message = msgInput.value.trim();
  if (!message) return;
  const data = { user, message, date: new Date() };
  socket.emit('chatMessage', data);
  addMessage(data, true);
  msgInput.value = '';
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

// ---------------------------
// ONLINE USERS PANEL AK CHAT PRIVE
// ---------------------------
function renderUsers(users) {
  if (!userList) return;
  userList.innerHTML = '';
  users.forEach(u => {
    const li = document.createElement('li');
    li.dataset.userId = u.userId;      // kenbe userId
    li.dataset.display = u.user;       // kenbe display name

    const dot = document.createElement('span');
    dot.classList.add('status-dot');
    if (u.connected) dot.classList.add('online'); else dot.classList.add('offline');
    li.appendChild(dot);

    const nameSpan = document.createElement('span');
    nameSpan.classList.add('user-name');
    nameSpan.textContent = u.user;
    li.appendChild(nameSpan);

    userList.appendChild(li);
  });

  // Scroll si plis pase 5 itilizatè
  if (users.length > 5) {
    userList.style.overflowY = 'auto';
    userList.style.maxHeight = '300px';
  } else {
    userList.style.overflowY = 'hidden';
    userList.style.maxHeight = 'auto';
  }
}

// ---------------------------
// Lanse chat prive sou klike
// ---------------------------
if (userList) {
  userList.addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li) return;
    const targetUserId = li.dataset.userId;
    const targetDisplay = li.dataset.display || li.textContent.trim();
    const currentUser = userInput?.value.trim() || 'Anonyme';
    if (!targetUserId || targetUserId === currentUser) return;
    const privateUrl = `https://fondationbackupspirituel.com/Chatprive.html?from=${encodeURIComponent(currentUser)}&to=${encodeURIComponent(targetUserId)}`;
    window.location.href = privateUrl;
  });
}

// ---------------------------
// Konekte/dekonekte itilizatè
// ---------------------------
socket.on('userConnected', (user) => {
  if (!user) return;
  console.log('🟢 Konekte:', user.user);
  socket.emit('requestUserList'); // rele lis itilizatè yo
});

socket.on('userDisconnected', (user) => {
  if (!user) return;
  console.log('🔴 Dekonekte:', user.user);
  socket.emit('requestUserList'); // rele lis itilizatè yo
});

// ---------------------------
// Lè socket konekte
// ---------------------------
socket.on('connect', () => {
  const currentUser = userInput?.value.trim();
  if (currentUser) socket.emit('setUser', currentUser);
  socket.emit('requestUserList');
});

// ---------------------------
// Rele renderUsers sou lis itilizatè
// ---------------------------
socket.on('online-users', (arr) => renderUsers(arr));

</script>
