<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espas Egzamen Modilè</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f5f8fb;color:#072b44;padding:16px}
.card{max-width:1000px;margin:12px auto;padding:18px;border-radius:10px;background:#fff;box-shadow:0 6px 20px rgba(11,59,102,0.05)}
.btn{padding:8px 12px;border-radius:8px;border:none;background:#0b63b3;color:#fff;cursor:pointer}
.btn-outline{background:#fff;color:#0b63b3;border:1px solid #0b63b3}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hidden{display:none}
.small{font-size:13px;color:#666}
.timer{font-weight:700;color:#b02a37}
.school-container{margin-bottom:40px;border-top:2px solid #0b63b3;padding-top:20px;}
</style>
</head>
<body>

<div class="card">
  <h2 style="margin:0 0 8px">Fondation BackupSpirituel — Espas Egzamen Modilè</h2>
  <p class="small">Antre modpas pou chak lekòl. Chak lekòl gen pwòp klas, matyè ak egzamen.</p>
</div>

<div id="schools-wrapper"></div>

<script>
(() => {
  // ---------- CONFIG ----------
  const BASE_URL = 'https://examen-backend-ihlx.onrender.com';
  const ENDPOINTS = {
    school: BASE_URL + '/api/verify-school',
    class: BASE_URL + '/api/verify-class',
    subject: BASE_URL + '/api/verify-subject'
  };
  const FORM_ENDPOINT = 'https://formsubmit.co/ajax/infos@fondationbackupspirituel.com';

  // ---------- SCHOOLS DATA ----------
  const schools = [
    {
      id:'fobas',
      name:'Fondation BackupSpirituel',
      formEmail:'infos@fondationbackupspirituel.com'
    },
    {
      id:'lumiere',
      name:'College Lumiere Lakay de Mare Rouge',
      formEmail:'lumiere@fondationbackupspirituel.com'
    },
    {
      id:'cefotech',
      name:'College CEFOTECH-CO de Mare Rouge',
      formEmail:'cefotech@fondationbackupspirituel.com'
    }
  ];

  const classes = [
    { id:'7em', label:'7èm' },
    { id:'8em', label:'8èm' },
    { id:'9em', label:'9èm' },
    { id:'NS1', label:'NS I' },
    { id:'NS2', label:'NS II' },
    { id:'NS3', label:'NS III' },
    { id:'NS4', label:'NS IV' }
  ];

  const subjects = [
    { id:'math', label:'Matematik' },
    { id:'informatique', label:'Informatique' },
    { id:'creole', label:'Kreyòl' },
    { id:'francais', label:'Franse' },
    { id:'anglais', label:'Anglè' },
    { id:'sciences', label:'Syans' },
    { id:'histoire', label:'Istwa' },
    { id:'geographie', label:'Jeyografi' },
    { id:'espagnol', label:'Espayòl' },
    { id:'philosophie', label:'Filosofi' }
  ];

  const wrapper = document.getElementById('schools-wrapper');

  // ---------- RENDER SCHOOL ----------
  function renderSchool(school){
    const div = document.createElement('div');
    div.className='school-container';
    div.innerHTML=`
      <h3>${school.name}</h3>
      <div class="small">Antre modpas lekòl pou kontinye</div>
      <input type="password" class="school-pw" placeholder="Modpas lekòl">
      <button class="btn school-validate">Ouvri Espas</button>
      <div class="school-msg small" style="color:#b02a37;display:none"></div>

      <div class="classes-box hidden" style="margin-top:14px">
        <h4 style="margin:6px 0">Chwazi Klas</h4>
        <div class="class-list" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        <div class="class-pw-box hidden" style="margin-top:10px">
          <div class="class-title" style="font-weight:700;margin-bottom:6px"></div>
          <input type="password" class="class-pw" placeholder="Modpas klas">
          <button class="btn class-validate">Valide Klas</button>
          <div class="class-msg small" style="margin-top:6px;color:#b02a37;display:none"></div>
        </div>
      </div>

      <div class="subjects-box hidden" style="margin-top:14px">
        <h4 style="margin:6px 0">Matières — antre modpas pou ouvri egzamen</h4>
        <div class="subjects-grid grid"></div>
        <div class="subject-pw-box hidden" style="margin-top:10px">
          <div class="subject-title" style="font-weight:700;margin-bottom:6px"></div>
          <input type="password" class="subject-pw" placeholder="Modpas matyè">
          <button class="btn subject-validate">Valide Matyè</button>
          <div class="subject-msg small" style="margin-top:6px;color:#b02a37;display:none"></div>
        </div>
      </div>

      <div class="exam-box hidden" style="margin-top:14px">
        <h4 class="exam-title"></h4>
        <div class="small">Timer: <span class="timer">120:00</span></div>
        <form class="exam-form" style="margin-top:10px">
          <div style="display:grid;gap:8px">
            <input name="nom_prenom" placeholder="Nom / Prénom *" required style="padding:8px;border:1px solid #d0d7de;border-radius:6px;">
            <input name="ecole" placeholder="Nom d'Ecole *" required style="padding:8px;border:1px solid #d0d7de;border-radius:6px;">
            <input name="classe" placeholder="Classe *" required style="padding:8px;border:1px solid #d0d7de;border-radius:6px;">
            <input name="email" type="email" placeholder="Email *" required style="padding:8px;border:1px solid #d0d7de;border-radius:6px;">
          </div>
          <hr>
          <div class="exam-questions" style="margin-bottom:12px"></div>
          <div style="display:flex;gap:8px;align-items:center">
            <button type="submit" class="btn">Soumèt</button>
            <div class="submit-msg small" style="color:#0b63b3;display:none;margin-left:8px"></div>
          </div>
        </form>
      </div>
    `;
    wrapper.appendChild(div);
    initSchoolLogic(div, school);
  }

  // ---------- INIT SCHOOL LOGIC ----------
  function initSchoolLogic(div, school){
    const schoolPw = div.querySelector('.school-pw');
    const schoolValidate = div.querySelector('.school-validate');
    const schoolMsg = div.querySelector('.school-msg');

    const classesBox = div.querySelector('.classes-box');
    const classListEl = div.querySelector('.class-list');
    const classPwBox = div.querySelector('.class-pw-box');
    const classTitle = div.querySelector('.class-title');
    const classPw = div.querySelector('.class-pw');
    const classValidate = div.querySelector('.class-validate');
    const classMsg = div.querySelector('.class-msg');

    const subjectsBox = div.querySelector('.subjects-box');
    const subjectsGrid = div.querySelector('.subjects-grid');
    const subjectPwBox = div.querySelector('.subject-pw-box');
    const subjectTitle = div.querySelector('.subject-title');
    const subjectPw = div.querySelector('.subject-pw');
    const subjectValidate = div.querySelector('.subject-validate');
    const subjectMsg = div.querySelector('.subject-msg');

    const examBox = div.querySelector('.exam-box');
    const examTitle = div.querySelector('.exam-title');
    const examForm = div.querySelector('.exam-form');
    const submitMsg = div.querySelector('.submit-msg');
    const timerEl = div.querySelector('.timer');

    let currentClass = null;
    let currentSubject = null;
    let timerInterval = null;
    let remainingSeconds = 120*60;

    function show(el){ el.classList.remove('hidden'); }
    function hide(el){ el.classList.add('hidden'); }

    schoolValidate.addEventListener('click', async ()=>{
      schoolMsg.style.display='none';
      const pw = (schoolPw.value||'').trim();
      if(!pw){ schoolMsg.style.display='block'; schoolMsg.innerText='Antre modpas lekòl la.'; return; }
      try{
        schoolValidate.disabled=true; schoolValidate.innerText='Ap verifye...';
        const resp = await fetch(ENDPOINTS.school, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ password: pw, school: school.id })
        });
        const data = await resp.json();
        if(resp.ok && data.success){
          hide(schoolPw); hide(schoolValidate); hide(schoolMsg);
          show(classesBox);
          renderClassButtons();
        } else {
          schoolMsg.style.display='block';
          schoolMsg.innerText = (data && data.message) ? data.message : 'Modpas lekòl pa kòrèk';
        }
      } catch(err){
        schoolMsg.style.display='block';
        schoolMsg.innerText = 'Erè verifye: '+(err.message||err);
      } finally { schoolValidate.disabled=false; schoolValidate.innerText='Ouvri Espas'; }
    });

    function renderClassButtons(){
      classListEl.innerHTML='';
      classes.forEach(c=>{
        const b = document.createElement('button');
        b.className='btn-outline';
        b.style.margin='6px';
        b.innerText = c.label;
        b.onclick = ()=> {
          currentClass = c.id;
          classTitle.innerText = 'Modpas pou klas ' + c.label;
          classPw.value=''; classMsg.style.display='none';
          show(classPwBox);
        };
        classListEl.appendChild(b);
      });
    }

    classValidate.addEventListener('click', async ()=>{
      classMsg.style.display='none';
      const pw = (classPw.value||'').trim();
      if(!pw){ classMsg.style.display='block'; classMsg.innerText='Antre modpas klas la'; return; }
      try{
        classValidate.disabled=true; classValidate.innerText='Ap verifye...';
        const resp = await fetch(ENDPOINTS.class, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ password: pw, school: school.id, class: currentClass })
        });
        const data = await resp.json();
        if(resp.ok && data.success){
          hide(classPwBox);
          show(subjectsBox);
          renderSubjectsGrid();
        } else {
          classMsg.style.display='block';
          classMsg.innerText = (data && data.message) ? data.message : 'Modpas klas pa kòrèk';
        }
      } catch(err){
        classMsg.style.display='block';
        classMsg.innerText='Erè: '+(err.message||err);
      } finally { classValidate.disabled=false; classValidate.innerText='Valide Klas'; }
    });

    function renderSubjectsGrid(){
      subjectsGrid.innerHTML='';
      subjects.forEach(s=>{
        const d=document.createElement('div');
        d.style.border='1px solid #eef3f7';
        d.style.padding='8px';
        d.style.borderRadius='8px';
        d.style.textAlign='center';
        d.style.cursor='pointer';
        d.innerHTML = `<div style="font-weight:700">${s.label}</div><div class="small">swiv egzamen</div>`;
        d.onclick = ()=> {
          currentSubject = s.id;
          subjectTitle.innerText = s.label + ' — Antre modpas';
          subjectPw.value=''; subjectMsg.style.display='none';
          show(subjectPwBox);
        };
        subjectsGrid.appendChild(d);
      });
    }

    subjectValidate.addEventListener('click', async ()=>{
      subjectMsg.style.display='none';
      const pw = (subjectPw.value||'').trim();
      if(!pw){ subjectMsg.style.display='block'; subjectMsg.innerText='Antre modpas matyè a'; return; }
      try{
        subjectValidate.disabled=true; subjectValidate.innerText='Ap verifye...';
        const resp = await fetch(ENDPOINTS.subject, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ password: pw, school: school.id, class: currentClass, subject: currentSubject })
        });
        const data = await resp.json();
        if(resp.ok && data.success){
          hide(subjectPwBox);
          startExam(currentSubject);
        } else {
          subjectMsg.style.display='block';
          subjectMsg.innerText = (data && data.message) ? data.message : 'Modpas matyè pa kòrèk';
        }
      } catch(err){
        subjectMsg.style.display='block';
        subjectMsg.innerText='Erè: '+(err.message||err);
      } finally { subjectValidate.disabled=false; subjectValidate.innerText='Valide Matyè'; }
    });

    function startExam(subjectId){
      examTitle.innerText = 'Egzamen: ' + subjects.find(s=>s.id===subjectId).label;
      show(examBox);
      examForm.reset();
      submitMsg.style.display='none';
      remainingSeconds = 120*60;
      timerEl.innerText = formatTime(remainingSeconds);
      if(timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(()=>{
        remainingSeconds--;
        timerEl.innerText = formatTime(remainingSeconds);
        if(remainingSeconds <=0){
          clearInterval(timerInterval);
          autoSubmit();
        }
      },1000);
      examBox.scrollIntoView({behavior:'smooth'});
    }

    function formatTime(sec){
      const m = Math.floor(sec/60).toString().padStart(2,'0');
      const s = (sec%60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }

    async function autoSubmit(){
      try {
        submitMsg.style.display='block';
        submitMsg.innerText='Tan fini — ap soumèt otomatikman...';
        await submitExamForm(true);
      } catch(e){ submitMsg.innerText='Echwe soumèt otomatikman: '+(e.message||e); }
    }

    examForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      await submitExamForm(false);
    });

    async function submitExamForm(isAuto=false){
      const fd = new FormData(examForm);
      fd.append('Exam Subject', currentSubject);
      fd.append('Exam Class', currentClass);
      fd.append('Exam School', school.id);
      fd.append('AutoSubmitted', isAuto ? 'yes' : 'no');
      fd.append('Source Page', window.location.href);
      try{
        submitMsg.style.display='block';
        submitMsg.innerText='Ap voye...';
        const resp = await fetch(FORM_ENDPOINT, { method:'POST', body:fd, headers:{'Accept':'application/json'} });
        const data = await resp.json();
        if(!resp.ok) throw new Error(data.message||'Erè soumèt');
        submitMsg.innerText='✅ Egzamen soumèt ak siksè.';
        hide(examBox);
      } catch(err){
        submitMsg.innerText='Erè pandan soumèt: '+(err.message||err);
      }
    }
  }

  // ---------- RENDER ALL SCHOOLS ----------
  schools.forEach(school => renderSchool(school));

})();
</script>
</body>
</html>
