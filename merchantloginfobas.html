<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Connexion Commerçant FOBAS</title>

</head>
<body>

<div class="box">
  <h1>FOBAS</h1>

  <button id="loginBtn">Connexion</button>

  <p id="msg"></p>
</div>
