<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOBAS Echanges</title>
  <link rel="stylesheet" href="fobas.echanges.css">
</head>

<body>

<header>
  <h1>FOBAS ECHANGES</h1>
  <p>Marketplace byen kont byen</p>
</header>


<!-- 🟡 POST FORM -->
<section class="form-card">

  <!-- ❌ User ID retire nèt -->

  <input id="fullName" placeholder="Non konplè ou">

  <input id="title" placeholder="Tit anons">

  <textarea id="desc" placeholder="Deskripsyon"></textarea>

  <input id="category" placeholder="Kategori">

  <input type="file" id="image">
  <img id="preview" style="display:none; width:100%; max-height:200px; margin-top:10px; border-radius:10px;">

  <button onclick="createItem()">Pibliye anons</button>
  
  <button onclick="openChat('${item._id}')">Chat</button>

  <p class="info">
    ✔ 3 anons gratis<br>
    💰 Apre sa: 250 HT (Natcash only)
  </p>

</section>
<!-- 💳 PAYMENT SECTION -->
<section class="payment-card">

  <h2>Peman Natcash</h2>

  <p>
    Voye 250 HT sou:<br>
    <b>+50943706706 (MEME Selvandieu)</b>
  </p>

  <input type="file" id="proof">

  <button onclick="sendProof()">Voye prèv peman</button>

</section>

<hr>

<!-- 📦 ITEMS -->
<section id="items"></section>




<div id="chatBox" style="display:none; position:fixed; bottom:0; right:0; width:300px; height:400px; background:white; border:1px solid #ccc;">
  
  <div id="chatMessages" style="height:320px; overflow-y:auto;"></div>

  <input id="chatName" placeholder="Non ou">
  <input id="chatText" placeholder="Ekri mesaj...">
  <button onclick="sendMessage()">Voye</button>

</div>
  
<script src="fobas.echanges.js"></script>
</body>
</html>
