<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ÉCOLE EN LIGNE FOBAS - UNE AUTRE HAITI AVEC UNE NOULLE TECHNOLOGIE</title>
<link rel="stylesheet" href="ecole-en-ligne.css">
<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<style>
  /* Ajoute style pou videyo dinamik */
  #student-videos video {
    margin: 5px;
    width: 240px;
    height: 180px;
    object-fit: cover;
  }
  #screen-video {
    width: 480px;
    height: 360px;
    object-fit: cover;
    display: none; /* JS ap kontwole vizibilite lè yon moun pataje ekran */
  }
</style>
</head>
<body>

<!-- Panneau de connexion -->
<div id="login-panel">
  <input type="text" id="fullName" placeholder="Nom / Prénom">
  
  <select id="roleSelect">
    <option value="teacher">Teacher</option>
    <option value="student">Student</option>
  </select>

  <!-- Chan kòd jenere otomatikman pou pwofesè -->
  <div id="room-code-container" style="display:none;">
    <label for="generatedRoomCode">Code de la salle (à partager aux élèves):</label>
    <input type="text" id="generatedRoomCode" readonly placeholder="Généré automatiquement">
  </div>

 

<div id="student-room-input" style="display:none;">
  <label for="studentRoomCode">Entrer le code de la salle:</label>
  <input type="text" id="studentRoomCode" placeholder="Code donné par le prof">
</div>
  
  <button id="joinBtn">Rejoindre</button>
</div>



  
<!-- Salle de classe -->
<div id="classroom" style="display:none;">

  <!-- Section vidéos -->
  <div id="video-section">
    <div class="teacher-video-container">
      <h3>Professeur</h3>
      <video id="teacher-video" autoplay playsinline muted></video>
    </div>
    <div id="student-videos"></div>
  </div>

  <!-- Écran partagé -->
  <div id="screen-share-container">
    <h3>Partage d’écran</h3>
    <video id="screen-video" autoplay playsinline></video>
  </div>

  <!-- Panel latéral -->
  <div id="side-panel" style="display:none;">
    <div id="raised-hands">
      <h3>Mains Levées</h3>
      <div id="raised-hands-list"></div>
    </div>
    <div id="student-list-container">
      <h3>Élèves Connectés (<span id="student-count">0</span>/100)</h3>
      <div id="student-list"></div>
    </div>
  </div>

  <!-- Panel chat -->
  <div id="chat-panel" style="display:none;">
    <div id="chat-messages"></div>
    <input id="chat-input" placeholder="Écrire un message...">
    <button id="send-chat">Envoyer</button>
  </div>

  <!-- Panel annonces -->
  <div id="announcement-panel" style="display:none;"></div>

  <!-- Contrôles -->
  <div id="controls" style="display:none;">
    <button id="toggle-mic">Mic On/Off</button>
    <button id="toggle-camera">Camera On/Off</button>
    <button id="share-screen">Partager écran</button>
    <button id="main-hand">Main Levée</button>
    <button id="leave-class">Quitter</button>
    <button id="rejoin-class">Retourner dans la salle</button>
    <button id="change-background-btn">Changer Fond</button>
  </div>

  <!-- Div sipò pou fond AI / upload lokal -->
  <div id="background-selector" style="display:none;"></div>

</div>

<!-- Scripts -->
<script src="teacher-controls.js"></script>
<script src="student-controls.js"></script>
<script src="ecole-en-ligne.js"></script>

</body>
</html>
