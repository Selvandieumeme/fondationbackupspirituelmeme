<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Simulation — École en Ligne</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #login-panel, #classroom {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 320px;
      text-align: center;
    }
    input, select, button {
      display: block;
      margin: 10px auto;
      width: 90%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #classroom {
      display: none;
      background: #e8f7ff;
    }
    video {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- 🔹 PANNEAU DE CONNEXION -->
  <div id="login-panel">
    <h2>Connexion à la classe</h2>
    <input type="text" id="roomCode" placeholder="Code de la salle">
    <input type="text" id="fullName" placeholder="Nom / Prénom">
    <select id="roleSelect">
      <option value="teacher">Professeur</option>
      <option value="student">Élève</option>
    </select>
    <button id="joinBtn">Rejoindre</button>
  </div>

  <!-- 🔹 SALLE DE CLASSE (SIMULATION) -->
  <div id="classroom">
    <h2>Bienvenue dans la salle de classe 🎓</h2>
    <p id="class-info"></p>
    <video id="fake-video" autoplay muted loop playsinline src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
    <button id="leaveBtn">Quitter la classe</button>
  </div>

  <script>
    const joinBtn = document.getElementById('joinBtn');
    const roomInput = document.getElementById('roomCode');
    const nameInput = document.getElementById('fullName');
    const roleSelect = document.getElementById('roleSelect');
    const loginPanel = document.getElementById('login-panel');
    const classroom = document.getElementById('classroom');
    const info = document.getElementById('class-info');
    const leaveBtn = document.getElementById('leaveBtn');

    joinBtn.addEventListener('click', () => {
      const room = roomInput.value.trim();
      const name = nameInput.value.trim();
      const role = roleSelect.value;

      if (!name || !room) {
        alert("Veuillez entrer votre nom et le code de la salle !");
        return;
      }

      loginPanel.style.display = 'none';
      classroom.style.display = 'block';
      info.innerHTML = `<strong>${name}</strong> (${role}) a rejoint la salle <strong>${room}</strong>`;
    });

    leaveBtn.addEventListener('click', () => {
      classroom.style.display = 'none';
      loginPanel.style.display = 'block';
      roomInput.value = '';
      nameInput.value = '';
    });
  </script>

</body>
</html>
