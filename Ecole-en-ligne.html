<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>École en Ligne — Fondation Backup Spirituel</title>


<!-- Styles simples, palette: jaune, ble, blanc -->
<style>
:root{--yellow:#FFD700;--blue:#0057b7;--white:#ffffff;--muted:#f4f6f9}
*{box-sizing:border-box}
body{font-family:Inter,Arial,Helvetica,sans-serif;margin:0;background:linear-gradient(180deg,var(--white),#f7f9fc)}
header{background:var(--yellow);color:#000;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:18px}
header .controls{display:flex;gap:8px;align-items:center}
.container{display:flex;gap:12px;padding:12px;height:calc(100vh - 64px)}


/* left: video + local controls */
.left{flex:2;display:flex;flex-direction:column;gap:8px}
.video-grid{flex:1;background:var(--muted);padding:8px;border-radius:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;overflow:auto}
.video-box{position:relative;background:#000;border-radius:8px;overflow:hidden;min-height:120px}
.video-box video{width:100%;height:100%;object-fit:cover;display:block}
.video-label{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,0.45);color:#fff;padding:4px 8px;border-radius:6px;font-size:13px}


/* right: participants + chat */
.right{width:360px;display:flex;flex-direction:column;gap:8px}
.panel{background:#fff;padding:10px;border-radius:10px;box-shadow:0 6px 18px rgba(5,30,80,0.06);}
.participants{max-height:180px;overflow:auto}
.participant{display:flex;align-items:center;justify-content:space-between;padding:6px 4px;border-bottom:1px solid #eef3fb}


.chat{display:flex;flex-direction:column;height:300px}
.chat-messages{flex:1;overflow:auto;padding:8px;background:#fbfdff;border-radius:6px;border:1px solid #eef3fb}
.chat-input{display:flex;gap:6px;margin-top:8px}
.chat-input input{flex:1;padding:8px;border-radius:6px;border:1px solid #ccdffc}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.btn.secondary{background:var(--yellow);color:#000}


footer {padding:10px 18px;text-align:center;font-size:13px;color:#666}


@media(max-width:900px){.container{flex-direction:column}.right{width:100%}}
</style>
</head>
<body>
<header>
<h1>École en Ligne — Fondation Backup Spirituel</h1>
<div class="controls">
<div id="sessionInfo" style="font-size:13px;color:#012a4a">Session: <strong id="className">Salle principale</strong></div>
<button id="leaveBtn" class="btn secondary">Quitter</button>
</div>
</header>


<div class="container">
</html>
