<div id="login-panel">
  <input type="text" id="fullName" placeholder="Nom / Prénom">

  <select id="roleSelect">
    <option value="teacher">Teacher</option>
    <option value="student">Student</option>
  </select>

  <!-- Code de la salle -->
  <div id="room-code-container">
    <label for="generatedRoomCode">Code de la salle:</label>
    <input type="text" id="generatedRoomCode" readonly placeholder="Généré automatiquement pour teacher">
  </div>

  <!-- Ansyen code de la salle (Teacher sèlman) -->
  <div id="old-room-code-container">
    <label for="oldRoomCode">Ansyen code de la salle:</label>
    <input type="text" id="oldRoomCode" placeholder="Antre ansyen code si gen yon sèl">
  </div>

  <!-- Chan pou student antre code -->
  <div id="student-room-container">
    <label for="studentRoomCode">Entrer le code de la salle:</label>
    <input type="text" id="studentRoomCode" placeholder="Code donné par le prof">
  </div>

  <button id="joinBtn">Rejoindre</button>
</div>
