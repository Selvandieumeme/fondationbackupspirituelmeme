<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ÉCOLE EN LIGNE FOBAS</title>
  <link rel="stylesheet" href="ecole-en-ligne.css">
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>




  

  <!-- =================== LOGIN PANEL =================== -->
 <div id="login-panel">
  <h1>Connexion à la Salle de Classe</h1>

  <!-- Nom / Prénom -->
  <input type="text" id="inputFullName" placeholder="Nom / Prénom" required>

  <!-- Code de la salle -->
  <input type="text" id="inputRoomCode" placeholder="Code de la salle" required>

  <!-- Ancien code (seulement pour professeur) -->
  <input type="text" id="inputOldCode" placeholder="Ancien code (si applicable)" style="display:none;">

  <!-- Sélecteur de rôle -->
  <select id="selectRole">
    <option value="teacher">Professeur</option>
    <option value="student">Élève</option>
  </select>

  <!-- Boutons d’action -->
  <button id="joinBtn">Rejoindre</button>
  <button id="rejoinBtn">Retourner dans la salle</button>
</div>

<!-- Script pou montre/kache chan “Ancien code” + jenere code otomatik -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const roleSelect = document.getElementById('selectRole');
    const oldCodeField = document.getElementById('inputOldCode');
    const roomCodeField = document.getElementById('inputRoomCode');

    // ======================================================
    // Fonksyon pou jenere kòd inik otomatik (ex: ABCD4821)
    // ======================================================
    function generateRoomCode() {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const digits = Math.floor(1000 + Math.random() * 9000); // eg: 4821
      let randomLetters = '';
      for (let i = 0; i < 4; i++) {
        randomLetters += letters.charAt(Math.floor(Math.random() * letters.length));
      }
      return randomLetters + digits; // eg: ABCD4821
    }

    // ======================================================
    // Fonksyon pou mete kòd otomatikman si se pwofesè
    // ======================================================
    function updateRoomCodeField() {
      if (roleSelect.value === 'teacher') {
        oldCodeField.style.display = 'block';
        // Jenere nouvo kòd otomatikman pou pwofesè
        const newCode = generateRoomCode();
        roomCodeField.value = newCode;
        roomCodeField.readOnly = true; // anpeche pwofese modifye kòd la
      } else {
        oldCodeField.style.display = 'none';
        roomCodeField.value = ''; // elèv antre kòd pwofesè a manyèlman
        roomCodeField.readOnly = false;
      }
    }

    // ======================================================
    // Lè w chwazi wòl la (Professeur/Élève)
    // ======================================================
    roleSelect.addEventListener('change', updateRoomCodeField);

    // ======================================================
    // Lè paj la fin chaje (eta inisyal)
    // ======================================================
    updateRoomCodeField();
  });
</script>







  
  <!-- =================== SALLE DE CLASSE =================== -->
  <div id="classroom" style="display:none;">

    <!-- VIDEO SECTION -->
    <div id="video-section">
      <div id="teacher-camera" class="camera-panel">
        <h3>Professeur</h3>
        <video id="teacher-video" autoplay playsinline muted></video>
      </div>
      <div id="students-camera" class="camera-panel">
        <h3>Élèves</h3>
        <div id="student-videos"></div>
      </div>
    </div>

    <!-- SCREEN SHARE -->
    <div id="screen-share-container">
      <h3>Partage d’écran</h3>
      <video id="screen-video" autoplay playsinline></video>
      <button id="share-screen">Partager écran</button>
    </div>

    <!-- RIGHT PANEL -->
    <div id="side-panel">
      <div id="raised-hands">
        <h3>Mains Levées</h3>
        <div id="raised-hands-list"></div>
      </div>
      <div id="student-list-container">
        <h3>Participants (<span id="student-count">0</span>/100)</h3>
        <div id="student-list"></div>
      </div>
    </div>

    <!-- CHAT PANEL -->
    <div id="chat-panel">
      <h3>Chat</h3>
      <div id="chat-messages"></div>
      <input id="chat-input" placeholder="Écrire un message...">
      <button id="send-chat">Envoyer</button>
    </div>

    <!-- CONTROLS -->
    <div id="controls">
      <button id="toggle-mic">Mic On/Off</button>
      <button id="toggle-camera">Caméra On/Off</button>
      <button id="main-hand">Lever la main</button>
      <button id="mute-all">Mute All</button>
      <button id="record-btn">Record</button>
      <button id="download-btn">Télécharger</button>
      <button id="change-background-btn">Changer Fond</button>
      <button id="leave-class">Quitter</button>
    </div>

    <!-- BACKGROUND AI PANEL -->
    <div id="background-selector" style="display:none;">
      <h3>Choisir un fond d’écran</h3>
      <div id="background-options">
        <!-- Miniatures AI / Custom upload -->
      </div>
      <input type="file" id="upload-background" accept="image/*">
    </div>

    <!-- ANNOUNCEMENT PANEL -->
    <div id="announcement-panel" style="display:none;"></div>

  </div>

  <!-- =================== SCRIPTS =================== -->
  <script src="teacher-controls.js"></script>
  <script src="student-controls.js"></script>
  <script src="ecole-en-ligne.js"></script>



  <!-- Script Socket.io -->
<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const socket = io("https://examen-backend-ihlx.onrender.com", {
    transports: ["websocket"],
  });

  const fullName = document.getElementById("inputFullName");
  const roomCode = document.getElementById("inputRoomCode");
  const oldCode = document.getElementById("inputOldCode");
  const roleSelect = document.getElementById("selectRole");
  const joinBtn = document.getElementById("joinBtn");

  joinBtn.addEventListener("click", () => {
    const name = fullName.value.trim();
    const room = roomCode.value.trim();
    const role = roleSelect.value;
    const oldRoom = oldCode.value.trim();

    // Vérifikasyon si tout chan obligatwa yo ranpli
    if (!name || !room) {
      alert("Veuillez remplir tous les champs requis (Nom / Prénom et Code de la salle).");
      return;
    }

    // Envoi done koneksyon bay serveur la
    socket.emit("join-room", { name, room, role, oldRoom });

    // Message loading
    joinBtn.disabled = true;
    joinBtn.textContent = "Connexion en cours...";

    // Lè serveu a konfime koneksyon an
    socket.once("joined-room", (data) => {
      console.log("Connecté avec succès à la salle :", data);
      alert(`Bienvenue ${name} dans la salle ${room} !`);

      // Kache panel login la epi montre entèfas salle de classe a
      document.getElementById("login-panel").style.display = "none";
      ouvrirSalleDeClasse(name, role, room);
    });

    // Si gen erè
    socket.once("join-error", (err) => {
      alert("Erreur : " + err.message);
      joinBtn.disabled = false;
      joinBtn.textContent = "Rejoindre";
    });
  });

  // Fonksyon pou louvri entèfas salle de classe la
  function ouvrirSalleDeClasse(name, role, room) {
    const classroom = document.createElement("div");
    classroom.id = "classroom";
    classroom.innerHTML = `
      <h2>Salle de classe : ${room}</h2>
      <p>Connecté en tant que <strong>${role === 'teacher' ? 'Professeur' : 'Élève'}</strong> — ${name}</p>
      <div id="video-area">
        <p>(📹 Vidéo / 🎤 Audio / 💬 Chat / 📁 Partage ekran ap vini...)</p>
      </div>
      <button id="leaveBtn">Quitter la salle</button>
    `;
    document.body.appendChild(classroom);

    // Bouton pou kite sal la
    document.getElementById("leaveBtn").addEventListener("click", () => {
      socket.emit("leave-room", { name, room });
      document.body.removeChild(classroom);
      document.getElementById("login-panel").style.display = "block";
      joinBtn.disabled = false;
      joinBtn.textContent = "Rejoindre";
    });
  }
});
</script>

</body>
</html>
