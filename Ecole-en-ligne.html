<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎓 École en Ligne — Fondation Backup Spirituel</title>
  <link rel="stylesheet" href="ecole-style.css">
</head>
<body>
  <div id="auth-container" class="auth-screen">
    <h1>🎓 École en Ligne</h1>
    <p>Antre kòd d’accès ou pou rantre nan salle la 👇</p>
    <input type="text" id="accessCode" placeholder="Ex: FBS2025CLASS" maxlength="30">
    <button id="enterBtn">Entrer</button>
  </div>

  <div id="main-container" class="hidden">
    <header>
      <h2>🟢 Salle de Formation — Fondation Backup Spirituel</h2>
      <button id="leaveBtn">Quitter</button>
    </header>

    <section class="video-section">
      <video id="localVideo" autoplay muted playsinline></video>
      <div id="remoteVideos"></div>
    </section>

    <section class="chat-section">
      <div id="chat-box"></div>
      <div class="chat-input">
        <input type="text" id="chatMessage" placeholder="Écrire un message...">
        <button id="sendBtn">Envoyer</button>
      </div>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="ecole-script.js"></script>
</body>
</html>
