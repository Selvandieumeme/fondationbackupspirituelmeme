<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>École en Ligne — FOBAS - 800 Eleves/Salle de Classe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ecole-en-ligne.css">
  <link rel="stylesheet" href="meme-agent.css">
</head>
<body>
  <h1>École en Ligne — FOBAS - 800 Eleves/Salle de Classe</h1>

  <!-- Section room controls -->
  <div id="room-controls">
    <input type="text" id="room-code" placeholder="Code de salle">
    <input type="text" id="username" placeholder="Votre nom">
    <select id="role">
      <option value="teacher">Teacher</option>
      <option value="student">Student</option>
    </select>
    <button id="join-room">Rejoindre</button>
  </div>

  <!-- Teacher controls (affiché seulement si role=teacher) -->
  <div id="teacher-controls" style="display:none;">
    <input type="file" id="upload-doc">
  </div>

  <!-- Video section -->
  <div id="video-section">
    <video id="teacher-video" autoplay muted></video>
    <div id="student-videos"></div>
  </div>

  <!-- Chat section -->
  <div id="chat-section">
    <ul id="messages"></ul>
    <input id="msg" placeholder="Votre message">
    <button id="send">Envoyer</button>
  </div>

  <!-- SOCKET.IO -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <!-- Core app script -->
  <script src="ecole-en-ligne.js"></script>

  <!-- Scripts modules -->
  <script src="teacher-controls.js"></script>
  <script src="student-controls.js"></script>
  <script src="join-approval.js"></script>
  <script src="meme-agent.js"></script>
</body>
</html>
