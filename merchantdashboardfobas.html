<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dashboard Commerçant FOBAS</title>
<link rel="stylesheet" href="merchantdashboardfobas.css">
</head>
<body>

<header>
  <h1>FOBAS</h1>
  <button onclick="logout()">Déconnexion</button>
</header>

<div class="stats">
  <div class="card">💰 Solde<br><strong id="balance">0.00 HTG</strong></div>
  <div class="card">📥 Paiements<br><strong id="payments">0</strong></div>
</div>

<div class="actions">
  <input type="number" id="amountInput" placeholder="Antre montant HTG" min="0.01" step="0.01">
  <button onclick="generateQR()">Recevoir Paiement</button>
</div>

<div id="transferSection">
  <h3>Transfert Lajan sou Merchant</h3>
  <input type="number" id="transferAmount" placeholder="Antre kantite HTG">
  <button id="transferBtn">Transfere lajan</button>
  <div id="transferMsg"></div>
</div>

<div id="qr"></div>

<p id="msg"></p>

<script>
// ==========================
// 🔹 Vérification login
// ==========================
  
const email = localStorage.getItem("merchantEmail");
const connected = localStorage.getItem("merchantConnected"); // Sèl clé ki mete nan login

if(!connected || connected !== "true" || !email){
  window.location.href = "merchantloginfobas.html";
}

// ==========================
// 🔹 Charger les données du dashboard
// ==========================
async function loadDashboard(){
  try {
    const res = await fetch(`https://api.fondationbackupspirituel.com/merchant/dashboard?email=${email}`);
    const data = await res.json();

    if(data.success){
      document.getElementById("balance").innerText = parseFloat(data.balance).toFixed(2) + " HTG";
      document.getElementById("payments").innerText = data.payments.length;
    } else {
      document.getElementById("msg").innerText = data.message || "Erreur lors du chargement du dashboard";
    }
  } catch(err){
    console.error("Erreur API dashboard:", err);
    document.getElementById("msg").innerText = "Erreur serveur, réessayez plus tard.";
  }
}

// Appel lè paj la chaje
loadDashboard();

// ==========================
// 🔹 Génération QR Code
// ==========================
async function generateQR() {
  const qrDiv = document.getElementById("qr");
  const amountInput = document.getElementById("amountInput");
  const amount = parseFloat(amountInput.value);

  if (isNaN(amount) || amount <= 0) {
    alert("Montant invalide. Tanpri antre yon kantite valab.");
    return;
  }

  qrDiv.innerHTML = "Génération du QR en cours...";

  try {
    const res = await fetch(
      `/merchant/generate-qr?email=${merchantEmail}&amount=${amount}`
    );
    const data = await res.json();

    if (data.success) {
      qrDiv.innerHTML = `<h3>QR Paiement HTG</h3><img src="${data.qrUrl}" alt="QR Code HTG">`;
    } else {
      qrDiv.innerText = data.message || "Erreur génération QR";
    }
  } catch (err) {
    console.error("QR ERROR:", err);
    qrDiv.innerText = "Erreur serveur QR Code.";
  }
}

// ==========================
// 🔹 Déconnexion
// ==========================
function logout(){
  localStorage.removeItem("merchantConnected");
  localStorage.removeItem("merchantEmail");
  window.location.href = "merchantloginfobas.html";
}
</script>

</body>
</html>
