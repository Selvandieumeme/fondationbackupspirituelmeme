<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dashboard Commerçant FOBAS</title>
<link rel="stylesheet" href="merchantdashboardfobas.css">
<style>
/* ======================
   STYLING PROFESSIONNEL
====================== */
body {
  font-family: 'Arial', sans-serif;
  background: #f4f8fb;
  color: #333;
  margin: 0;
  padding: 0;
}
header {
  background: linear-gradient(90deg, #FFD700, #0033A0, #FFFFFF);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
header h1 {
  margin: 0;
  color: #0033A0;
}
header button {
  padding: 8px 15px;
  background: #FFD700;
  border: none;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
  color: #0033A0;
}
.stats {
  display: flex;
  justify-content: space-around;
  margin: 20px 0;
}
.card {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: center;
  width: 200px;
  font-size: 18px;
}
.actions, #transferSection, #abonnementQRSection, #productsSection {
  background: #fff;
  margin: 15px auto;
  padding: 20px;
  border-radius: 12px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.actions input, .productCard input, .abonnementCard input {
  width: calc(100% - 12px);
  padding: 6px;
  margin: 5px 0 10px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
}
button {
  padding: 8px 15px;
  border: none;
  border-radius: 6px;
  background: #0033A0;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background: #FFD700;
  color: #0033A0;
}
#qr img, #productQR1 img, #productQR2 img, #qrMonth, #qrYear {
  margin-top: 10px;
  max-width: 250px;
  display: block;
}
.productCard, .abonnementCard {
  background: #f9f9f9;
  padding: 15px;
  border-radius: 10px;
  margin: 10px 0;
  box-shadow: 0 1px 5px rgba(0,0,0,0.1);
}
.productCard p, .abonnementCard p {
  font-weight: bold;
  color: #0033A0;
}
.productCard div, .abonnementCard div {
  margin-top: 5px;
}
</style>
</head>
<body>

<header>
  <h1>FOBAS</h1>
  <button onclick="logout()">Déconnexion</button>
</header>

<div class="stats">
  <div class="card">💰 Solde<br><strong id="balance">0.00 HTG</strong></div>
  <div class="card">📥 Paiements<br><strong id="payments">0</strong></div>
</div>

<!-- GENERATE QR PAIEMENT -->
<div class="actions">
  <h3>Recevoir Paiement</h3>
  <input type="number" id="amountInput" placeholder="Antre montant HTG" min="0.01" step="0.01">
  <input type="hidden" id="merchantEmail" value="">
  <button onclick="generateQR()">Générer QR Paiement</button>
  <div id="qr"></div>
</div>

<!-- TRANSFERT WALLET -->
<div id="transferSection">
  <h3>Transfert Lajan sou Merchant</h3>
  <input type="number" id="transferAmount" placeholder="Antre kantite HTG">
  <button id="transferBtn">Transfere lajan</button>
  <div id="transferMsg"></div>
</div>


</div>

<!-- ABONNEMENT QR -->
<div id="abonnementQRSection">
  <h3>QR Abonnement Merchant</h3>
  <div class="abonnementCard">
    <input type="radio" name="abonnementType" value="month" id="abonnementMonth" checked>
    <label for="abonnementMonth">Mois (1000 HTG)</label><br>
    <input type="radio" name="abonnementType" value="year" id="abonnementYear">
    <label for="abonnementYear">Année (5000 HTG)</label><br>
    <button onclick="generateAbonnementQR()">Générer QR Abonnement</button>
    <div id="abonnementQR"></div>
  </div>
</div>

<p id="msg"></p>

<script>
// 🔹 LOGIN CHECK
const email = localStorage.getItem("merchantEmail");
const connected = localStorage.getItem("merchantConnected");
if(!connected || connected !== "true" || !email){
  window.location.href = "merchantloginfobas.html";
}
document.getElementById("merchantEmail").value = email;

// 🔹 LOAD DASHBOARD
async function loadDashboard(){
  try {
    const res = await fetch(`https://api.fondationbackupspirituel.com/merchant/dashboard?email=${email}`);
    const data = await res.json();
    if(data.success){
      document.getElementById("balance").innerText = parseFloat(data.balance).toFixed(2) + " HTG";
      document.getElementById("payments").innerText = data.payments.length;
    } else {
      document.getElementById("msg").innerText = data.message || "Erreur lors du chargement du dashboard";
    }
  } catch(err){
    console.error("Erreur API dashboard:", err);
    document.getElementById("msg").innerText = "Erreur serveur, réessayez plus tard.";
  }
}
loadDashboard();

// 🔹 GENERATE QR PAIEMENT
async function generateQR() {
  const qrDiv = document.getElementById("qr");
  const amountInput = document.getElementById("amountInput");
  const merchantEmail = document.getElementById("merchantEmail").value;
  const amount = parseFloat((amountInput.value || "").trim().replace(",", "."));
  if (!merchantEmail || isNaN(amount) || amount <= 0){
    alert("Tanpri antre email ak kantite valab.");
    qrDiv.innerHTML = "";
    return;
  }
  qrDiv.innerHTML = "Génération du QR en cours...";
  try {
    const res = await fetch(`https://api.fondationbackupspirituel.com/merchant/generate-qr?email=${encodeURIComponent(merchantEmail)}&amount=${amount}`);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(data.success) qrDiv.innerHTML = `<h3>QR Paiement HTG</h3><img src="${data.qrUrl}" alt="QR Code Paiement">`;
    else qrDiv.innerText = data.message || "Erreur génération QR";
  } catch(err){
    console.error("QR ERROR:", err);
    qrDiv.innerText = "Erreur serveur QR Code.";
  }
}

// 🔹 GENERATE PRODUIT QR DYNAMIQUE
async function generateProductQR(productNum){
  const email = localStorage.getItem("merchantEmail");
  const nameInput = document.getElementById("productName" + productNum);
  const amountInput = document.getElementById("productAmount" + productNum);
  const qrDiv = document.getElementById("productQR" + productNum);
  const productName = nameInput.value.trim();
  const amount = parseFloat(amountInput.value);
  if(!productName || isNaN(amount) || amount <= 0){
    alert("Tanpri antre non pwodwi ak pri valab.");
    return;
  }
  qrDiv.innerHTML = "Génération du QR en cours...";
  try{
    const res = await fetch(`/merchant/generate-product-qr?email=${encodeURIComponent(email)}&productId=PROD-${productNum}&productName=${encodeURIComponent(productName)}&amount=${amount}`);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(data.success) qrDiv.innerHTML = `<img src="${data.qrUrl}" alt="QR Produit">`;
    else qrDiv.innerText = data.message || "Erreur génération QR Produit";
  } catch(err){
    console.error("PRODUCT QR ERROR:", err);
    qrDiv.innerText = "Erreur serveur QR Produit";
  }
}

// 🔹 GENERER QR ABONNEMENT
async function generateAbonnementQR(){
  const email = localStorage.getItem("merchantEmail");
  const type = document.querySelector('input[name="abonnementType"]:checked').value;
  const qrDiv = document.getElementById("abonnementQR");
  let amount = type === "month" ? 1000 : 5000;
  qrDiv.innerHTML = "Génération du QR en cours...";
  try{
    const res = await fetch(`/merchant/generate-product-qr?email=${encodeURIComponent(email)}&productId=ABONNEMENT-${type.toUpperCase()}&productName=Produit_FOBAS&amount=${amount}`);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(data.success) qrDiv.innerHTML = `<img src="${data.qrUrl}" alt="QR Abonnement">`;
    else qrDiv.innerText = data.message || "Erreur génération QR Abonnement";
  } catch(err){
    console.error("ABONNEMENT QR ERROR:", err);
    qrDiv.innerText = "Erreur serveur QR Abonnement";
  }
}

// 🔹 LOGOUT
function logout(){
  localStorage.removeItem("merchantConnected");
  localStorage.removeItem("merchantEmail");
  window.location.href = "merchantloginfobas.html";
}
</script>




<script>
// 🔹 GENERATE PRODUIT QR DYNAMIQUE AVEC TOUS LES CHAMPS
async function generateProductQR(productNum) {
  const email = localStorage.getItem("merchantEmail");
  const qrDiv = document.getElementById("productQR" + productNum);

  // Récupérer tous les champs
  const fullName = document.getElementById("fullName" + productNum).value.trim();
  const companyName = document.getElementById("companyName" + productNum).value.trim();
  const productName = document.getElementById("productName" + productNum).value.trim();
  const quantity = parseFloat(document.getElementById("quantity" + productNum).value) || 0;
  const whatsapp = document.getElementById("whatsapp" + productNum).value.trim();
  const clientName = document.getElementById("clientName" + productNum).value.trim();
  const receiptNum = document.getElementById("receiptNum" + productNum).value.trim();
  const unitPrice = parseFloat(document.getElementById("unitPrice" + productNum).value) || 0;
  const total = parseFloat(document.getElementById("total" + productNum).value) || 0;
  const signature = document.getElementById("signature" + productNum).value.trim();

  // Validation minimale
  if(!fullName || !companyName || !productName || quantity <= 0 || unitPrice <=0){
    alert("Tanpri ranpli tout chan obligatwa avèk valè valab.");
    return;
  }

  qrDiv.innerHTML = "Génération du QR en cours...";

  try {
    // Payload complet
    const payload = new URLSearchParams({
      email: email,
      productId: "PROD-" + productNum,
      type: "FOBAS_PRODUCT",
      fullName,
      companyName,
      productName,
      quantity,
      whatsapp,
      clientName,
      receiptNum,
      unitPrice,
      total,
      signature
    });

    const res = await fetch(`/merchant/generate-product-qr?${payload.toString()}`);
    if(!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();

    if(data.success){
      qrDiv.innerHTML = `<img src="${data.qrUrl}" alt="QR Produit" style="max-width:200px;">`;
    } else {
      qrDiv.innerText = data.message || "Erreur génération QR Produit";
    }
  } catch(err) {
    console.error("PRODUCT QR ERROR:", err);
    qrDiv.innerText = "Erreur serveur QR Produit";
  }
}
</script>
</body>
</html>
